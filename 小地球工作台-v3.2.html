  /* ============ 跨模块双向同步（时间轴 ↔ 英语/日语/读书/漫画/运动） ============
     设计：
     · 模块（英语/日语/读书/漫画/运动）产生的记录，在时间轴中自动聚合显示为「同步」条目；
     · 在时间轴中按同步分类（英语/日语/读书/漫画/运动）新增的条目，会自动在对应模块生成一条记录；
     · 删除/编辑会双向级联：时间轴删虚拟条目 → 删模块记录；模块删记录 → 时间轴聚合随之消失。
     链接条目（从时间轴创建）带 src+ref，刷新时以模块最新数据为准。 */
  SYNC_CATS:['英语','日语','读书','漫画','运动'],
  catToSrc(cat){return {'英语':'eng','日语':'jp','读书':'book','漫画':'manga','运动':'sport'}[cat]||null},
  srcToCat(src){return {eng:'英语',jp:'日语',book:'读书',manga:'漫画',sport:'运动'}[src]||null},
  isSyncCat(cat){return this.SYNC_CATS.includes(cat)},
  /* 内容关键词 → 同步分类（中英日 不区分大小写）。用于时间轴“只记一次就自动同步” */
  detectSyncCat(text){
    const t=(text||'').toLowerCase();
    const has=(...kw)=>kw.some(k=>t.includes(k.toLowerCase()));
    /* 日语专属词（假名/五十音/にほんご 等）必须先于泛用“单词/语法”，否则“日语单词”会误判为英语 */
    if(has('日语','japanese','假名','五十音','ひらがな','カタカナ','にほんご','日本語','n1','n2','n3','n4','n5','日语pod'))return '日语';
    if(has('英语','english','背单词','单词','听力','口语','语法','新概念','voa','流利说','精听','英语pod','课文','音标','ep','toefl','ielts'))return '英语';
    if(has('漫画','番','manga','追番','看漫画'))return '漫画';
    if(has('运动','健身','训练','跑步','举铁','瑜伽','有氧','撸铁','锻炼','波比跳','帕梅拉','刘畊宏','拉伸','跳绳','力量','hiit','普拉提'))return '运动';
    if(has('读书','阅读','看书','读了','book','看的书','纸质书','啃书'))return '读书';
    return null;
  },
  /* 若用户显式选了同步分类就用它；否则按内容识别，避免“选错/没选分类导致不同步” */
  resolveSyncCat(selectedCat, content){
    if(this.isSyncCat(selectedCat))return selectedCat;
    return this.detectSyncCat(content);
  },
  syncSlot(src){return {eng:14,jp:15.5,book:20,manga:21,sport:18}[src]||19},
  modKey(src){return {eng:'eng_learned',jp:'jpLogs',book:'book_records',manga:'manga_records',sport:'spRecs'}[src]||null},

  getModuleRecords(src,date){
    const k=this.modKey(src);if(!k)return [];
    return DB.get(k,[]).filter(r=>r.date===date);
  },
  getModuleRecord(src,ref){
    const k=this.modKey(src);if(!k)return null;
    return DB.get(k,[]).find(r=>r.id===ref)||null;
  },

  /* 模块记录 → 时间轴条目（带默认时间段，避免重叠） */
  moduleToTL(src,rec){
    const cat=this.srcToCat(src);
    let content='',dur=0,from=null,to=null;
    if(src==='eng'){content=rec.text||'';dur=(+rec.mins||0)*60;}
    else if(src==='jp'){
      const jt=rec.types&&rec.types.length?rec.types:([rec.type].filter(Boolean));
      content=(jt.length&&!(jt.length===1&&jt[0]==='综合')?'['+jt.join('/')+'] ':'')+(rec.content||'');
      dur=(+rec.min||0)*60;
    }
    else if(src==='book'){content=rec.bookTitle||'';dur=(+rec.mins||0)*60;if(rec.startT&&rec.endT){from=rec.startT;to=rec.endT;}}
    else if(src==='manga'){content=(rec.emoji||'📚')+' '+(rec.title||'');dur=(+rec.mins||0)*60;if(rec.startT&&rec.endT){from=rec.startT;to=rec.endT;}}
    else if(src==='sport'){content=(rec.parts&&rec.parts.length?rec.parts.join('、'):(rec.blogger||'运动'));dur=(+rec.min||0)*60;}
    /* 英语/日语/运动 改造为阅读记录样式后也带 startT/endT，时间轴显示真实时间段 */
    if((src==='eng'||src==='jp'||src==='sport')&&rec.startT&&rec.endT){from=rec.startT;to=rec.endT;}
    if(from==null){
      const start=this.syncSlot(src);
      from=pad(Math.floor(start))+':'+pad(Math.round((start%1)*60));
      const endMin=Math.floor(start*60)+Math.max(1,Math.round(dur/60));
      to=pad(Math.floor(endMin/60))+':'+pad(endMin%60);
    }
    return {src,ref:rec.id,cat,content,dur,from,to};
  },

  /* 汇总：手动条目 + 已链接条目(读模块最新) + 模块虚拟条目 */
  collectTimeline(date){
    const stored=this.getTimeItems();
    const linked=stored.filter(it=>it.src&&it.ref);
    const linkedKeys=new Set(linked.map(it=>it.src+':'+it.ref));
    let items=stored.filter(it=>!it.src);
    linked.forEach(it=>{
      const rec=this.getModuleRecord(it.src,it.ref);
      if(rec){const t=this.moduleToTL(it.src,rec);items.push(Object.assign(t,{id:it.id,from:it.from,to:it.to,dur:it.dur}));}
    });
    const cursor={};
    ['eng','jp','book','manga','sport'].forEach(src=>{
      this.getModuleRecords(src,date).forEach(rec=>{
        if(linkedKeys.has(src+':'+rec.id))return;
        const t=this.moduleToTL(src,rec);
        const noTime=(!rec.startT&&!rec.endT);
        if(noTime){
          const base=this.syncSlot(src)+(cursor[src]||0);
          const startH=Math.floor(base),startM=Math.round((base%1)*60);
          const durMin=Math.max(1,Math.round((t.dur||0)/60));
          const endTotal=Math.floor(base*60)+durMin;
          t.from=pad(startH)+':'+pad(startM);
          t.to=pad(Math.floor(endTotal/60))+':'+pad(endTotal%60);
          cursor[src]=(cursor[src]||0)+Math.max(0.5,durMin/60);
        }
        t._virtual=true;
        items.push(t);
      });
    });
    /* 给每条记录一个稳定排序 ID */
    items.forEach(it=>{it._id=it.id||(it.src+':'+it.ref);});
    return items;
  },

  /* 时间轴排序模式：true=手动，false=按开始时间 */
  tlManual(date){return DB.get('tl_manual_'+date,false)},
  setTlManual(date,v){DB.set('tl_manual_'+date,v)},
  tlOrder(date){return DB.get('tl_order_'+date,[])},
  setTlOrder(date,arr){DB.set('tl_order_'+date,arr)},

  /* 在时间轴新增同步条目时，在对应模块创建记录 */
  createModuleRecord(cat,info){
    const src=this.catToSrc(cat);if(!src)return null;
    const id=uid();
    if(src==='eng'){const a=DB.get('eng_learned',[]);a.push({id,text:info.content,date:info.date,mins:info.mins||0,startT:info.from||'',endT:info.to||'',tags:[],note:''});DB.set('eng_learned',a);}
    else if(src==='jp'){const a=DB.get('jpLogs',[]);a.push({id,date:info.date,types:['综合'],min:info.mins||0,content:info.content,startT:info.from||'',endT:info.to||'',note:''});DB.set('jpLogs',a);}
    else if(src==='book'){const a=DB.get('book_records',[]);a.push({id,date:info.date,bookTitle:info.content,startT:info.from||'',endT:info.to||'',mins:info.mins||0,pageFrom:0,pageTo:0,status:'reading',note:''});DB.set('book_records',a);}
    else if(src==='manga'){const a=DB.get('manga_records',[]);a.push({id,date:info.date,title:info.content,emoji:'📚',startT:info.from||'',endT:info.to||'',mins:info.mins||0,chapters:'',status:'reading',note:''});DB.set('manga_records',a);}
    else if(src==='sport'){const a=DB.get('spRecs',[]);a.push({id,date:info.date,parts:[info.content],min:info.mins||0,startT:info.from||'',endT:info.to||'',lv:'',blogger:'',note:'',imgs:[]});DB.set('spRecs',a);}
    return {id};
  },
  updateModuleRecordFromTL(src,ref,content,from,to){
    const k=this.modKey(src);if(!k)return;
    const arr=DB.get(k,[]);const r=arr.find(x=>x.id===ref);if(!r)return;
    if(src==='eng'){r.text=content;if(from)r.startT=from;if(to)r.endT=to;}
    else if(src==='jp'){r.content=content;if(from)r.startT=from;if(to)r.endT=to;}
    else if(src==='book'){r.bookTitle=content;if(from)r.startT=from;if(to)r.endT=to;}
    else if(src==='manga'){r.title=content;if(from)r.startT=from;if(to)r.endT=to;}
    else if(src==='sport'){r.parts=[content];if(from)r.startT=from;if(to)r.endT=to;}
    DB.set(k,arr);
  },
  deleteModuleRecord(src,ref){
    const k=this.modKey(src);if(!k)return;
    DB.set(k,DB.get(k,[]).filter(x=>x.id!==ref));
  },

  /* 虚拟条目（来自模块）的编辑/删除 */
  editVirt(src,ref){
    const rec=this.getModuleRecord(src,ref);if(!rec)return;
    const t=this.moduleToTL(src,rec);
    const hasTime=(src==='eng'||src==='jp'||src==='book'||src==='manga'||src==='sport');
    const fields=[
      {k:'content',label:'内容',value:t.content},
      {k:'mins',label:'分钟',type:'number',value:Math.round((t.dur||0)/60)}
    ];
    if(hasTime){
      fields.splice(1,0,
        {k:'startT',label:'开始时间',type:'time',value:(rec.startT||'14:00')},
        {k:'endT',label:'结束时间',type:'time',value:(rec.endT||'15:00')}
      );
    }
    App.modal({title:'编辑同步记录',emo:'🔗',fields,onOk:v=>{
      const k=this.modKey(src);const arr=DB.get(k,[]);const r=arr.find(x=>x.id===ref);if(!r)return false;
      const c=(v.content||'').trim();if(!c)return false;
      const mins=+v.mins||0;
      const startT=hasTime?(v.startT||''):'';const endT=hasTime?(v.endT||''):'';
      if(src==='eng'){r.text=c;r.mins=mins;r.startT=startT;r.endT=endT;}
      else if(src==='jp'){r.content=c;r.min=mins;r.startT=startT;r.endT=endT;}
      else if(src==='book'){r.bookTitle=c;r.mins=mins;r.startT=startT;r.endT=endT;}
      else if(src==='manga'){r.title=c;r.mins=mins;r.startT=startT;r.endT=endT;}
      else if(src==='sport'){r.parts=[c];r.min=mins;r.startT=startT;r.endT=endT;}
      DB.set(k,arr);
      this.renderDay();toast('已保存 🔗');
    }});
  },
  delVirt(src,ref){
    App.confirm('删除该同步记录？这也会从「'+(this.srcToCat(src))+'」板块一并删除。',()=>{
      this.deleteModuleRecord(src,ref);
      this.renderDay();toast('已删除 🔗');
    });
  },

  saveTasks(t){DB.set('daily_tasks_'+this.date,t)},

    html+='<div class="panel accent"><div class="hd"><i class="dot"></i><h3>📋 今日任务 & 固定习惯</h3><span class="tag">'+allDone+'/'+allTotal+'</span><div class="sp"></div>'+

      html+='<div style="margin-bottom:10px"><span style="font-size:11.5px;font-weight:800;color:var(--nerv);display:inline-flex;align-items:center;gap:4px">✨ 固定习惯 <span class="mut" style="font-weight:400;font-size:9.5px">（连续打卡 · 可增删）</span></span></div>';

        html+='<div class="task'+(checked?' done':'')+'" style="padding-right:6px">'+

      });

    /* ---- 今日任务（一次性任务） ---- */

      tasks.forEach((t,i)=>{
        html+='<div class="task'+(t.done?' done':'')+'" data-idx="'+i+'">'+
          '<div class="cbx'+(t.done?' on':'')+'" onclick="Daily.toggleTask('+i+')"></div>'+
          '<span class="tx">'+esc(t.txt)+'</span>'+

  /* ============ 时间轴（可选日期+6-24点+完成时段） ============ */
  renderTimelineHTML(items){
    const isToday=this.date===today();
    items=this.collectTimeline(this.date);
    const manual=this.tlManual(this.date);
    if(manual){
      const order=this.tlOrder(this.date);
      const orderMap=new Map(order.map((id,i)=>[id,i]));
      items.sort((a,b)=>{
        const ia=orderMap.get(a._id), ib=orderMap.get(b._id);
        if(ia!==undefined && ib!==undefined)return ia-ib;
        if(ia!==undefined)return -1;
        if(ib!==undefined)return 1;
        return a.from.localeCompare(b.from);
      });
    }else{
      items.sort((a,b)=>a.from.localeCompare(b.from));
    }
    let html='<div class="panel accent" style="margin-top:16px"><div class="hd"><i class="dot"></i><h3>⏱️ 时间轴</h3>'+
      '<div style="margin-left:auto;display:flex;gap:6px;align-items:center">'+
        '<span class="btn sm'+(manual?'':' pri')+'" onclick="Daily.toggleSortMode()">'+(manual?'⏱️ 按时间':'✋ 手动排序')+'</span>'+
        '<input type="date" class="ipt" id="tlDatePick" value="'+this.date+'" style="width:140px;font-size:12px;padding:4px 8px" onchange="Daily.goTlDate(this.value)">'+
        (!isToday?'<span class="btn sm" onclick="Daily.goTlDate(\''+today()+'\')">回今天</span>':'')+
      '</div></div><div class="bd">';

    /* 快速输入 */
    html+='<div class="tl-add">'+
      '<input class="ipt f" id="quickTL" placeholder="如：9-10 日语学习 或直接写内容...">'+
      '<select class="sel" id="tlCat" style="width:auto;flex:none">'+this.tlCats().map(c=>'<option>'+esc(c)+'</option>').join('')+'</select>'+
      '<div class="btn sm" title="新建分类" onclick="Daily.addTLCat()">＋分类</div>'+
      '<div class="btn pri sm" onclick="Daily.quickAdd()">记录</div>'+
      '</div>';
    /* 分类管理 */
    html+='<div class="row" style="gap:5px;flex-wrap:wrap;margin-top:8px">'+
      this.tlCats().map(c=>'<span class="chip" style="cursor:pointer" onclick="Daily.delTLCat(\''+esc(c).replace(/'/g,"\\'")+'\')" title="点击删除该分类">'+esc(c)+' <span style="opacity:.6">✕</span></span>').join('')+
      '</div>';

    /* 即使没有时间轴条目，已完成的、带时间段的任务也应显示在可视化时间条上 */
    const doneTasks=DB.get('daily_tasks_'+this.date,[]).filter(t=>t.done&&t._tl);
    if(items.length || doneTasks.length){
      if(items.length){
        html+='<div class="blk-list'+(manual?' manual':'')+'" style="margin-top:14px" id="tlList">';
        items.forEach((item,idx)=>{
          const acts=item._virtual
            ? '<div class="btn sm gh" onclick="Daily.editVirt(\''+item.src+'\',\''+item.ref+'\')">编辑</div><div class="btn sm gh" onclick="Daily.delVirt(\''+item.src+'\',\''+item.ref+'\')">删</div>'
            : '<div class="btn sm gh" onclick="Daily.editTL(\''+item.id+'\')">编辑</div><div class="btn sm gh" onclick="Daily.delTL(\''+item.id+'\')">删</div>';
          const reorder=manual?'<div class="reorder-btns"><span onclick="Daily.moveUp(\''+item._id+'\')">▲</span><span onclick="Daily.moveDown(\''+item._id+'\')">▼</span></div>':'';
          html+='<div class="blk-item'+(item._virtual?' sync':'')+'" data-id="'+esc(item._id)+'" draggable="'+manual+'" ondragstart="Daily.dragStart(event)" ondragover="Daily.dragOver(event)" ondrop="Daily.dragDrop(event)" ondragend="Daily.dragEnd(event)">'+
            (manual?'<div class="drag-handle">⋮⋮</div>':'')+
            '<div class="bar" style="background:'+this.catColor(item.cat)+'"></div>'+
            '<div class="tm">'+item.from+'-'+item.to+'</div>'+
            '<div class="ct"><b>'+esc(item.content)+'</b><div class="meta">'+
              '<span class="chip" style="font-size:9px;background:'+this.catColor(item.cat)+'">'+esc(item.cat)+'</span>'+
              (item.src?'<span class="chip" style="font-size:9px;background:var(--nerv-light);color:var(--nerv)">🔗 同步</span>':'')+
              (item.dur?'<span>'+Math.round(item.dur/60)+'min</span>':'')+
            '</div></div>'+
            '<div class="acts">'+acts+'</div>'+reorder+
          '</div>';
        });
        html+='</div>';
      }
      /* 可视化时间条（6:00-24:00） */
      html+=this.renderTimelineBar(items);
      /* 每日分类占比饼图 */

      items.forEach(it=>{tlAgg[it.cat]=(tlAgg[it.cat]||0)+Math.round((it.dur||0)/60)});

    }

    html+='</div></div>';
    return html;

  /* ============ 时间轴排序 / 拖拽 ============ */
  toggleSortMode(){
    const manual=!this.tlManual(this.date);
    this.setTlManual(this.date,manual);
    if(manual){
      /* 切换到手动时，把当前顺序记下来 */
      const items=this.collectTimeline(this.date);
      items.sort((a,b)=>a.from.localeCompare(b.from));
      this.setTlOrder(this.date,items.map(it=>it._id));
      toast('已切换为手动排序，长按/拖拽 ⋮⋮ 或点击 ▲▼ 调整');
    }else{
      toast('已恢复按开始时间排序');
    }
    this.renderDay();
  },
  _tlOrderFromDOM(){
    const list=$('#tlList');if(!list)return [];
    return Array.from(list.querySelectorAll('.blk-item[data-id]')).map(el=>el.dataset.id);
  },
  dragStart(e){
    const id=e.currentTarget.dataset.id;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',id);
    this.dragId=id;
  },
  dragOver(e){
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
    e.dataTransfer.dropEffect='move';
  },
  dragDrop(e){
    e.preventDefault();
    const target=e.currentTarget;
    target.classList.remove('drag-over');
    const dragId=this.dragId;
    const dropId=target.dataset.id;
    if(!dragId||dragId===dropId)return;
    if(!this.tlManual(this.date))this.setTlManual(this.date,true);
    const order=this._tlOrderFromDOM();
    const i=order.indexOf(dragId), j=order.indexOf(dropId);
    if(i<0||j<0)return;
    order.splice(i,1); order.splice(j,0,dragId);
    this.setTlOrder(this.date,order);
    this.renderDay();
  },
  dragEnd(e){
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.blk-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
    this.dragId=null;
  },
  moveUp(id){
    if(!this.tlManual(this.date))this.setTlManual(this.date,true);
    const order=this.tlOrder(this.date);
    const i=order.indexOf(id); if(i<=0)return;
    [order[i-1],order[i]]=[order[i],order[i-1]];
    this.setTlOrder(this.date,order); this.renderDay();
  },
  moveDown(id){
    if(!this.tlManual(this.date))this.setTlManual(this.date,true);
    const order=this.tlOrder(this.date);
    const i=order.indexOf(id); if(i<0||i>=order.length-1)return;
    [order[i],order[i+1]]=[order[i+1],order[i]];
    this.setTlOrder(this.date,order); this.renderDay();
  },

  quickAdd(){
    const v=$('#quickTL').value.trim();
    if(!v){toast('写点什么','err');return}
    const selCat=$('#tlCat').value;
    const m=v.match(/^(\d{1,2})[:：]?(\d{02})?\s*[-~－～]\s*(\d{1,2})[:：]?(\d{0})?\s*(.+)?/);
    let from,to,content;
    if(m){
      from=pad(+m[1])+':'+(m[2]||'00');
      to=pad(+m[3])+':'+(m[4]||'00');
      content=(m[5]||'').trim()||selCat+'学习';
    }else{
      const h=new Date().getHours();
      from=pad(h)+':00';
      to=pad(h+1)+':00';
      content=v;
    }
    /* 自动识别学习类型：若分类未选同步类，则按内容关键词推断（英语/日语/读书/漫画/运动），实现“记一次自动同步” */
    const effCat=this.resolveSyncCat(selCat, content);
    if(effCat && effCat!==selCat){
      const sel=$('#tlCat'); if(sel)sel.value=effCat;   // 让 UI 同步反映识别到的分类
    }
    const items=this.getTimeItems();
    const dur=this.calcDur(from,to);
    let src=null,ref=null;
    if(this.isSyncCat(effCat)){
      const rec=this.createModuleRecord(effCat,{content,date:this.date,mins:Math.round(dur/60),from,to});
      if(rec){src=this.catToSrc(effCat);ref=rec.id;}
    }
    items.push({from,to,content,cat:effCat,dur,id:uid(),src,ref});
    this.saveTimeItems(items);
    $('#quickTL').value='';
    this.renderDay();
    toast(src?'已记录并自动同步到「'+(this.srcToCat(src))+'」板块 🔗':'已记录 ⏱️');
  },
  calcDur(a,b){
    const [ah,am]=a.split(':').map(Number);
    const [bh,bm]=b.split(':').map(Number);
    return Math.max(0,(bh*60+bm)-(ah*60+am))*60;
  },
  delTL(id){
    const items=this.getTimeItems();
    const it=items.find(x=>x.id===id);
    if(!it){this.renderDay();return;}
    if(it.src&&it.ref)this.deleteModuleRecord(it.src,it.ref);
    this.saveTimeItems(items.filter(x=>x.id!==id));
    this.renderDay();
  },
  renderTimelineBar(items){
    /* 时间轴范围 6:00 - 24:00（共18小时） */
    const START_H=6, END_H=24, TOTAL_H=END_H-START_H;
    let html='<div class="tlbar"><div class="axis">';
    for(let h=START_H;h<=END_H;h+=2)html+='<span style="left:'+((h-START_H)/TOTAL_H*100)+'%">'+pad(h)+':00</span>';
    html+='</div><div class="track">';
    items.forEach(item=>{
      const [sh,sm]=item.from.split(':').map(Number);
      const [eh,em]=item.to.split(':').map(Number);
      const left=Math.max(0,(sh+sm/60-START_H)/TOTAL_H*100);
      const w=Math.max(((eh+em/60)-(sh+sm/60))/TOTAL_H*100,1);
      if(left>100)return; /* 超出范围不显示 */
      html+='<div class="blk" style="left:'+Math.min(left,100)+'%;width:'+Math.min(w,100-left)+'%;background:'+this.catColor(item.cat)+'">'+
        '<span>'+item.content+'</span></div>';
    });
    /* 已完成的任务也显示在时间轴上 */
    const tasks=DB.get('daily_tasks_'+this.date,[]).filter(t=>t.done&&t._tl);
    tasks.forEach(t=>{
      if(!t._tl)return;
      const [sh,sm]=t._tl.from.split(':').map(Number);
      const [eh,em]=t._tl.to.split(':').map(Number);
      const left=Math.max(0,(sh+sm/60-START_H)/TOTAL_H*100);
      const w=Math.max(((eh+em/60)-(sh+sm/60))/TOTAL_H*100,1);
      if(left>100)return;
      html+='<div class="blk" style="left:'+Math.min(left,100)+'%;width:'+Math.min(w,100-left)+'%;background:var(--nerv);opacity:.6">'+
        '<span>✅ '+esc(t.txt)+'</span></div>';
    });
    for(let h=START_H+2;h<END_H;h+=2)html+='<div class="gridline" style="left:'+((h-START_H)/TOTAL_H*100)+'%"></div>';
    html+='</div></div>';
    return html;
  },

  /* ============ 月计划 ============ */
  renderMonth(){
    const now=new Date();
    const y=now.getFullYear(),m=now.getMonth();
    const key=y+'-'+pad(m+1);
    const goals=DB.get('monthly_goals',{})[key]||[];
    const selDate=this.date;

    let html='<div class="greet"><b>'+y+'年'+(m+1)+'月 计划</b></div>';

    /* 日历 */
    html+='<div class="panel accent"><div class="hd"><i class="dot"></i><h3>📅 本月日历</h3></div><div class="bd">';
    html+=monthsGrid(y,
      k=>{return (DB.get('daily_tasks_'+k,[])||[]).length>0||(DB.get('daily_tl_'+k,[])||[]).length>0},
      'Daily.pickDate',selDate
    );
    html+='</div></div>';

    /* 月度目标 */
    html+='<div class="panel accent" style="margin-top:16px"><div class="hd"><i class="dot"></i><h3>🎯 本月目标</h3></div><div class="bd">';
    goals.forEach((g,i)=>{
      html+='<div class="task'+(g.done?' done':'')+'">'+
        '<div class="cbx'+(g.done?' on':'')+'" onclick="Daily.toggleMonthGoal('+i+')"></div>'+
        '<span class="tx">'+esc(g.txt)+'</span>'+
        '<span class="rm" onclick="Daily.delMonthGoal('+i+')">✕</span>'+
        '</div>';
    });
    if(goals.length===0)html+='<div class="empty"><span>🎯</span><div>本月还没有目标</div></div>';
    html+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<input class="ipt f" id="newMGoal" placeholder="+ 添加月度目标..." onkeydown="if(event.key===\'Enter\')Daily.addMonthGoal()">'+
      '<div class="btn pri sm" onclick="Daily.addMonthGoal()">添加</div>'+
      '</div></div></div>';

    /* 月度统计 */
    const allDays=[];
    for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
      const dk=y+'-'+pad(m+1)+'-'+pad(d);
      const dt=DB.get('daily_tasks_'+dk,[])||[];
      const dl=DB.get('daily_tl_'+dk,[])||[];
      if(dt.length||dl.length)allDays.push({d:dk,tasks:dt,tl:dl});
    }
    const totalDone=allDays.reduce((a,x)=>a+x.tasks.filter(t=>t.done).length,0);
    const totalTasks=allDays.reduce((a,x)=>a+x.tasks.length,0);

    html+='<div class="panel" style="margin-top:16px"><div class="hd"><i class="dot"></i><h3>📊 本月统计</h3></div><div class="bd">'+
      kpi([{v:allDays.length,k:'活跃天数',emo:'📅'},{v:totalDone+'/'+totalTasks,k:'任务完成',emo:'✅'}])+
      '</div></div>';

    $('#dailyBody').innerHTML=html;
  },
  pickDate(d){this.date=d;this.tab='day';this.render()},
  addMonthGoal(){
    const txt=$('#newMGoal').value.trim();if(!txt)return;
    const now=new Date();const key=now.getFullYear()+'-'+pad(now.getMonth()+1);
    const mg=DB.get('monthly_goals',{});if(!mg[key])mg[key]=[];
    mg[key].push({id:uid(),txt,done:false});DB.set('monthly_goals',mg);
    $('#newMGoal').value='';this.renderMonth();toast('月目标已添加 ✅');
  },
  toggleMonthGoal(i){
    const now=new Date();const key=now.getFullYear()+'-'+pad(now.getMonth()+1);
    const mg=DB.get('monthly_goals',{});if(mg[key]&&mg[key][i])mg[key][i].done=!mg[key][i].done;
    DB.set('monthly_goals',mg);this.renderMonth();
  },
  delMonthGoal(i){
    const now=new Date();const key=now.getFullYear()+'-'+pad(now.getMonth()+1);
    const mg=DB.get('monthly_goals',{});if(mg[key])mg[key].splice(i,1);
    DB.set('monthly_goals',mg);this.renderMonth();
  },

  /* ============ 年计划 ============ */
  renderYear(){
    const y=new Date().getFullYear();
    const goals=DB.get('yearly_goals',[])||[];

    let html='<div class="greet"><b>'+y+' 年度计划</b></div>';

    html+='<div class="panel accent"><div class="hd"><i class="dot"></i><h3>🎯 年度目标</h3></div><div class="bd">';
    goals.forEach((g,i)=>{
      html+='<div class="task'+(g.done?' done':'')+'">'+
        '<div class="cbx'+(g.done?' on':'')+'" onclick="Daily.toggleYearGoal('+i+')"></div>'+
        '<span class="tx">'+esc(g.txt)+'</span>'+
        '<span class="chip" style="font-size:9px;margin-left:6px;background:var(--nerv-light);color:var(--nerv)">'+esc(g.category||'未分类')+'</span>'+
        '<span class="rm" onclick="Daily.delYearGoal('+i+')">✕</span>'+
        '</div>';
    });
    if(goals.length===0)html+='<div class="empty"><span>🌟</span><div>还没有年度目标，开始规划吧！</div></div>';
    html+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<input class="ipt f" id="newYGoal" placeholder="+ 添加年度目标..." onkeydown="if(event.key===\'Enter\')Daily.addYearGoal()">'+
      '<select class="sel" id="yCat" style="width:auto;flex:none"><option>健康</option><option>学习</option><option>事业</option><option>财务</option><option>生活</option><option>成长</option></select>'+
      '<div class="btn pri sm" onclick="Daily.addYearGoal()">添加</div>'+
      '</div></div></div>';

    /* 季度概览 */
    const quarters=['Q1 (1-3月)','Q2 (4-6月)','Q3 (7-9月)','Q4 (10-12月)'];
    html+='<div class="panel" style="margin-top:16px"><div class="hd"><i class="dot"></i><h3>📊 季度概览</h3></div><div class="bd"><div class="g2">';
    quarters.forEach((q,qi)=>{
      const startM=qi*3+1,endM=qi*3+3;
      let activeDays=0,totalTasks=0,doneTasks=0;
      for(let m=startM;m<=endM;m++){
        const key=y+'-'+pad(m);
        const mg=(DB.get('monthly_goals',{})[key])||[];
        totalTasks+=mg.length;doneTasks+=mg.filter(g=>g.done).length;
        for(let d=1;d<=new Date(y,m,0).getDate();d++){
          const dk=y+'-'+pad(m)+'-'+pad(d);
          if((DB.get('daily_tasks_'+dk,[])||[]).length)activeDays++;
        }
      }
      html+='<div class="kpi"><span class="emo">📅</span><div class="v">'+activeDays+'</div><div class="k">'+q+'</div>'+
        '<div style="font-size:9px;color:var(--tx-3);margin-top:2px">任务 '+doneTasks+'/'+totalTasks+'</div></div>';
    });
    html+='</div></div></div>';

    $('#dailyBody').innerHTML=html;
  },
  addYearGoal(){
    const txt=$('#newYGoal').value.trim();if(!txt)return;
    const goals=DB.get('yearly_goals',[])||[];
    goals.push({id:uid(),txt,category:$('#yCat').value,done:false});
    DB.set('yearly_goals',goals);$('#newYGoal').value='';this.renderYear();toast('年度目标已添加 ✅');
  },
  toggleYearGoal(i){const g=DB.get('yearly_goals',[]);if(g[i])g[i].done=!g[i].done;DB.set('yearly_goals',g);this.renderYear()},
  delYearGoal(i){const g=DB.get('yearly_goals',[]);g.splice(i,1);DB.set('yearly_goals',g);this.renderYear()},

  /* ============ 习惯打卡 ============ */
  renderHabit(){
    const habits=DB.get('daily_habits',[])||[];
    const todayKey=today();

    habits.forEach(h=>{
      if(h.days[todayKey])h.checked=true;else h.checked=false;
    });

    let html='<div class="greet"><b>每日习惯打卡 ✦</b></div>';

    html+='<div class="panel accent"><div class="hd"><i class="dot"></i><h3>✨ 今日打卡</h3><span class="tag">'+todayKey+'</span></div><div class="bd">';
    habits.forEach((h,i)=>{
      html+='<div class="habit">'+
        '<span class="he">'+h.icon+'</span>'+
        '<span class="hn">'+esc(h.name)+'</span>'+
        '<span style="font-size:11px;color:var(--nerv);font-family:var(--mono);flex:none;margin-right:8px">🔥'+h.streak+'天</span>'+
        '<div class="cb'+(h.checked?' on':'')+'" onclick="Daily.checkHabit('+i+')"></div>'+
        '</div>';
    });
    html+='</div></div>';

    /* 打卡热力图（近30天） */
    html+='<div class="panel" style="margin-top:16px"><div class="hd"><i class="dot"></i><h3>🔥 近30天打卡</h3></div><div class="bd">';
    html+='<div class="heat">';
    for(let i=29;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const k=ymd(d);
      const count=habits.filter(h=>h.days&&h.days[k]).length;
      const lv=count===0?0:(count<=2?1:(count<=habits.length/2?2:3));
      const isToday=k===todayKey;
      html+='<div class="x lv'+lv+(isToday?' today':'')+'" title="'+k+' ('+count+'/'+habits.length+')"></div>';
    }
    html+='</div></div></div>';

    /* 管理习惯 */
    html+='<div class="panel" style="margin-top:16px"><div class="hd"><i class="dot"></i><h3>⚙️ 管理习惯</h3><span class="tag">'+habits.length+' 个</span></div><div class="bd">'+
      (habits.length?habits.map((h,i)=>{
        const days=Object.keys(h.days||{}).length;
        const wk=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-k);return ymd(d)});
        const ticks=wk.slice().reverse().map(k=>'<span style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;background:'+(h.days&&h.days[k]?'var(--nerv)':'var(--line)')+'"></span>').join('');
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">'+
          '<span style="font-size:18px">'+h.icon+'</span>'+
          '<div style="flex:1;min-width:0"><b style="font-size:12.5px">'+esc(h.name)+'</b>'+
          '<div class="mut" style="font-size:10px">已打卡 '+days+' 天 · 连续 '+h.streak+' 天</div>'+
          '<div style="margin-top:3px">'+ticks+'</div></div>'+
          '<span class="btn sm" style="color:var(--nerv)" onclick="Daily.editHabit('+i+')">编辑</span>'+
          '<span class="btn sm dgr" onclick="Daily.delHabit('+i+')">删除</span>'+
        '</div>';
      }).join(''):'<div class="mut">还没有习惯，下面添加一个吧</div>')+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+
        '<input class="ipt f" id="newHab" placeholder="+ 新习惯名称...">'+
        '<input class="ipt" id="newHabIcon" placeholder="emoji图标" value="⭐" style="width:70px">'+
        '<div class="btn pri sm" onclick="Daily.addHabit()">添加</div>'+
      '</div></div></div>';

    $('#dailyBody').innerHTML=html;
  },
  checkHabit(i){
    const habits=DB.get('daily_habits',[])||[];
    if(!habits[i])return;
    const todayKey=today();
    if(!habits[i].days)habits[i].days={};
    if(habits[i].days[todayKey]){
      delete habits[i].days[todayKey];
      habits[i].streak=this.calcStreak(habits[i]);
    }else{
      habits[i].days[todayKey]=true;
      habits[i].streak=this.calcStreak(habits[i]);
      toast('打卡成功 🔥');
    }
    DB.set('daily_habits',habits);
    this.renderDay();
  },
  calcStreak(habit){
    if(!habit.days)return 0;
    let streak=0;
    const d=new Date();
    while(true){
      const k=ymd(d);
      if(habit.days[k]){streak++;d.setDate(d.getDate()-1)}
      else break;
    }
    return streak;
  },
  addHabit(){
    const name=$('#newHab').value.trim();
    const icon=$('#newHabIcon').value.trim()||'⭐';
    if(!name)return;
    const habits=DB.get('daily_habits',[])||[];
    habits.push({id:uid(),name,icon,streak:0,days:{}});
    DB.set('daily_habits',habits);
    $('#newHab').value='';
    this.renderDay();
    toast('习惯已添加 ✅');
  },
  /* 快速添加习惯（从统一列表中的「＋加习惯」按钮触发） */
  addHabitQuick(){
    App.modal({title:'添加固定习惯',emo:'✨',fields:[
      {k:'name',label:'习惯名称',ph:'如：喝8杯水、冥想10分钟'},
      {k:'icon',label:'图标 emoji',value:'⭐',ph:'⭐'}
    ],onOk:v=>{
      if(!v.name)return false;
      const habits=DB.get('daily_habits',[])||[];
      habits.push({id:uid(),name:v.name,icon:v.icon||'⭐',streak:0,days:{}});
      DB.set('daily_habits',habits);
      this.renderDay();toast('习惯已添加 ✅');
    }});
  },
  editHabit(i){
    const habits=DB.get('daily_habits',[])||[];const h=habits[i];if(!h)return;
    App.modal({title:'编辑习惯',emo:'✨',fields:[
      {k:'name',label:'习惯名称',value:h.name,ph:'如：喝8杯水、冥想10分钟'},
      {k:'icon',label:'图标 emoji',value:h.icon||'⭐',ph:'⭐'}
    ],onOk:v=>{
      if(!v.name||!v.name.trim())return false;
      habits[i].name=v.name.trim();habits[i].icon=(v.icon||'⭐').trim();
      DB.set('daily_habits',habits);this.renderDay();toast('已更新习惯 ✅');
    }});
  },
  delHabit(i){
    const habits=DB.get('daily_habits',[])||[];const h=habits[i];if(!h)return;
    App.confirm('删除习惯「'+h.name+'」？该习惯的全部打卡记录会一并清除。',()=>{
      DB.set('daily_habits',habits.filter((_,x)=>x!==i));this.renderDay();toast('已删除习惯');
    });
  }
};

RENDER.daily=()=>{Daily.init();Daily.render()};
</script>

<script>

/* 雅思口语话题池（Part 2 常见主题，每日推荐+可换题） */
const IELTS_TOPICS=[

  {q:'Describe a book that you enjoyed reading.',title:'参考范文 · 描述一本喜欢的书',answer:"I'd like to talk about 'Atomic Habits' by James Clear, which has genuinely changed my daily routine. The book explains how tiny, consistent changes can lead to remarkable results over time.\n\nWhat I love most about it is that it's not about dramatic transformations — it's about improving just 1% every day. For instance, instead of trying to read an hour each day, I started with just two pages. Surprisingly, this small habit snowballed into reading over twenty books last year.\n\nThe author uses real-life examples from athletes, artists, and business leaders, which makes the content both practical and inspiring. I'd recommend this book to anyone who feels stuck or overwhelmed by big goals.",tips:'💡 使用具体书名+作者增加可信度；用数字支撑观点；结构：介绍→喜欢的原因→推荐'},
  {q:'Talk about a person who has influenced you.',title:'参考范文 · 影响你的人',answer:"The person who has influenced me most is my grandmother. She's not famous or wealthy, but her resilience and kindness have shaped who I am today.\n\nWhen she was young, she faced tremendous hardships — raising four children alone after my grandfather passed away unexpectedly. Yet she never complained. Instead, she worked multiple jobs, ensured all her children received good education, and still found time to volunteer at our local community center.\n\nFrom her, I learned that true strength isn't about never falling down — it's about always getting back up. Whenever I face difficulties, I think of her quiet determination. She taught me that kindness costs nothing but means everything.",tips:'💡 用故事化叙述代替空洞描述；展示而非讲述(show don\'t tell)；结尾升华主题'},
  {q:'Describe a place you would like to visit.',title:'参考范文 · 想去的地方',answer:"If I could visit any place in the world, I would choose Kyoto, Japan. It's been on my bucket list for years, and let me explain why.\n\nFirstly, Kyoto represents a perfect blend of tradition and modernity. You have ancient temples like Kinkakuji standing alongside contemporary cafes and boutiques. This contrast fascinates me culturally.\n\nSecondly, I'm particularly drawn to the cherry blossom season. Imagine walking through the Philosopher's Path, with thousands of sakura trees forming a pink canopy above you. The photos I've seen are absolutely breathtaking.\n\nLastly, as someone deeply interested in Japanese culture and language, visiting Kyoto would be both a dream come true and an opportunity to immerse myself in the environment I've been studying for years.",tips:'💡 用 Firstly/Secondly/Lastly 结构清晰；加入个人关联(学日语)；感官描写增强画面感'},
  {q:'Talk about a skill you would like to learn.',title:'参考范文 · 想学的技能',answer:"The skill I've always wanted to learn is video editing. In today's digital age, being able to create compelling visual content is incredibly valuable.\n\nMy interest started when I tried making a simple travel vlog. I spent hours struggling with basic cuts and transitions, but the process was surprisingly addictive. There's something magical about transforming raw footage into a coherent story.\n\nI believe video editing combines technical precision with artistic creativity. You need to understand timing, rhythm, color theory, and storytelling all at once. It's challenging, but that's exactly what appeals to me.\n\nI plan to start with free software like DaVinci Resolve, then gradually move to professional tools. Who knows — maybe one day I'll be able to turn this hobby into a side career.",tips:'💡 从个人经历切入；展示对技能深度的理解；有明确的学习计划体现决心'},
  {q:'Describe a memorable event in your life.',title:'参考范文 · 难忘的事件',answer:"One event that stands out vividly in my memory is my university graduation ceremony. It wasn't just about receiving a degree — it represented the culmination of four years of hard work, growth, and unforgettable experiences.\n\nWhat made it truly special was seeing my parents in the audience. My father, who rarely shows emotion, had tears in his eyes when my name was called. That moment hit me harder than anything else.\n\nAfterward, my classmates and I spent hours taking photos, sharing memories, and promising to stay in touch. Looking back now, some of those promises were kept, others weren't — but the emotion of that day remains crystal clear.\n\nThis event taught me that achievements mean more when shared with people who supported you through the journey.",tips:'💡 情感细节是关键(父亲的眼泪)；反思升华意义；过去时态描述，现在时态感悟'},
  {q:'Talk about your favorite type of music.',title:'参考范文 · 喜欢的音乐类型',answer:"My favorite type of music is definitely lo-fi hip hop. It might sound unusual to some people, so let me explain why I'm so drawn to it.\n\nPrimarily, I use lo-fi music as a study companion. The steady, relaxed beats help me focus without being distracting. Unlike lyrical music, which can pull my attention toward the words, instrumental lo-fi provides the perfect background atmosphere.\n\nInterestingly, the lo-fi community has grown tremendously recently. Platforms like YouTube have 24/7 live streams with thousands of listeners studying together. There's something comforting about knowing people worldwide are focusing to the same soundtrack.\n\nFor me, lo-fi isn't just background noise — it's become an essential part of my productivity routine. I honestly can't imagine studying without it now.",tips:'💡 选小众话题更容易出彩；解释为什么喜欢而不只是说喜欢；联系实际使用场景'},
  {q:'Describe a movie that made a deep impression on you.',title:'参考范文 · 印象深刻的电影',answer:"The movie that has left the deepest impression on me is 'The Pursuit of Happyness'. It's based on a true story about a man who refuses to give up despite overwhelming adversity.\n\nWhat struck me most was the relationship between the father and his son. Even when they were homeless and sleeping in public restrooms, the father never stopped protecting his son's innocence and hope.\n\nThe film taught me two valuable lessons. First, talent and hard work matter, but persistence matters even more. Second, success often comes right after the moment you want to quit.\n\nWhenever I feel discouraged, I remember the scene where the protagonist finally gets the job and tries so hard to hold back tears. It reminds me that struggle is temporary, but giving up is permanent.",tips:'💡 用真实故事改编的电影增加说服力；聚焦一个打动你的场景；提炼人生教训'},
  {q:'Talk about a hobby you enjoy in your free time.',title:'参考范文 · 喜欢的爱好',answer:"One hobby I truly enjoy is photography. I started about three years ago when I borrowed a friend's camera during a trip, and I've been hooked ever since.\n\nWhat I love about photography is that it forces me to slow down and pay attention to details I would normally ignore — the way light hits a building, the expression on a stranger's face, or the colors of the sky during sunset.\n\nI mostly take street and landscape photos. Street photography challenges me to capture authentic human moments, while landscape photography gives me a reason to explore nature and wake up early for sunrise.\n\nThis hobby has also improved my patience. A great shot often requires waiting for the perfect moment. In a world that moves so fast, photography is my way of pressing pause.",tips:'💡 说明爱好的起源；描述具体拍摄类型；联系个人成长(耐心)'},
  {q:'Describe a piece of technology you find useful.',title:'参考范文 · 有用的科技产品',answer:"The piece of technology I find most useful is my noise-canceling headphones. They may look simple, but they have completely transformed how I work and study.\n\nI live in a busy city, and my apartment is near a main road, so there's always background noise. Before I bought these headphones, I struggled to concentrate for more than twenty minutes. Now I can create a quiet personal space anywhere — on the subway, in a café, or even at home.\n\nBesides studying, I also use them for online meetings and podcasts. The sound quality is excellent, and the battery lasts a full day.\n\nIn my opinion, the best technology isn't the most expensive or complicated — it's the one that quietly solves a real problem in your daily life.",tips:'💡 从生活痛点切入；说明具体使用场景；结尾给出观点升华'},
  {q:'Talk about a time you helped someone.',title:'参考范文 · 帮助他人的经历',answer:"Last year, I helped a colleague prepare for an important English presentation. She was nervous because English isn't her first language, and she was worried about being misunderstood by international clients.\n\nWe met after work for two weeks. I helped her organize the structure, simplify complex sentences, and practice pronunciation. More importantly, I encouraged her to speak slowly and confidently rather than perfectly.\n\nOn the day of the presentation, she did wonderfully. Her clients were impressed, and she later told me it was a turning point for her career.\n\nHelping her didn't take much effort, but it reminded me that sometimes the smallest support can make a huge difference in someone's life.",tips:'💡 交代背景(对方遇到的困难)；描述具体帮助行动；强调结果和感悟'},
  {q:'Describe a tradition in your country.',title:'参考范文 · 国家的传统',answer:"One tradition that I deeply value is the Spring Festival reunion dinner. It's not just a meal — it's a symbol of family unity and new beginnings.\n\nEvery Chinese New Year's Eve, family members travel from different cities, sometimes across the country, just to sit around the same table. The dinner usually includes fish, dumplings, and many other dishes, each carrying a special meaning.\n\nWhat I appreciate most is the atmosphere. Grandparents tell stories, children receive red envelopes, and everyone catches up on the past year. For a few hours, phones are put away and people truly connect.\n\nIn a modern society where everyone is busy, this tradition reminds us that no matter how far we go, family is always where we belong.",tips:'💡 解释传统的象征意义；描述具体食物和活动；联系现代社会的价值'},
  {q:'Talk about an important decision you made.',title:'参考范文 · 重要决定',answer:"One of the most important decisions I made was switching from a stable office job to becoming a freelance designer. It was terrifying but ultimately the right choice.\n\nFor years, I worked in a position that paid well but left me creatively empty. Every Sunday evening, I felt anxious about Monday. I realized that staying there was costing me more than money — it was costing my enthusiasm for life.\n\nThe first six months of freelancing were difficult. Income was unstable, and I had to learn how to manage clients. But gradually, I built a portfolio and found projects I genuinely cared about.\n\nThis decision taught me that security and growth rarely come together. Sometimes you have to choose the uncertain path to discover what you're truly capable of.",tips:'💡 描述决定前的矛盾和焦虑；说明过渡期的困难；结尾给出成长感悟'},
  {q:'Describe a sport you enjoy watching or playing.',title:'参考范文 · 喜欢的运动',answer:"The sport I enjoy most is badminton. It's fast, strategic, and can be played both indoors and outdoors, which makes it perfect for any season.\n\nI usually play twice a week with friends at a local sports center. What I love about badminton is that it looks simple but requires excellent reflexes, footwork, and tactical thinking. A single match can be both physically exhausting and mentally engaging.\n\nPlaying badminton also helps me relieve stress. After a busy workday, running around the court and focusing on the shuttlecock clears my mind completely.\n\nCompared to gym workouts, badminton feels less like exercise and more like fun. That's probably why I've been able to stick with it for so many years.",tips:'💡 说明运动频率和场地；强调运动的身心双重好处；与另一种运动对比'},
  {q:'Talk about a friend you admire.',title:'参考范文 · 欣赏的朋友',answer:"The friend I admire most is called Lin. We met in college, and although we now live in different cities, we still talk regularly.\n\nWhat I admire about her is her incredible self-discipline. While many people make New Year's resolutions and forget them within a month, she actually follows through. For example, she taught herself Spanish by studying thirty minutes every single day for two years.\n\nShe's also one of the most honest people I know. She doesn't tell me what I want to hear — she tells me what I need to hear. Her advice has helped me through several difficult decisions.\n\nHaving a friend like Lin motivates me to be a better version of myself. I think everyone needs at least one person in their life who challenges them to grow.",tips:'💡 用具体事例证明品质(自学西班牙语)；说明朋友对你的实际影响；结尾点题'},
  {q:'Describe a meal you enjoyed.',title:'参考范文 · 享受的一餐',answer:"One meal I still remember vividly was a hot pot dinner with my college roommates during our final winter vacation. It wasn't fancy, but it was unforgettable.\n\nWe bought fresh beef, lamb, vegetables, and tofu from a nearby market and cooked everything in a small electric pot in our dormitory. The room was filled with steam and laughter.\n\nWhat made it special was the timing. We all knew graduation was approaching and that we might not see each other as often. So that evening felt precious, like a quiet celebration of our friendship.\n\nNow whenever I eat hot pot, I'm reminded of that night. It taught me that the best meals are never about the food — they're about the people sitting around the table.",tips:'💡 描述食物细节；强调特殊时机；结尾升华到人际关系'},
  {q:'Talk about a goal you want to achieve in the future.',title:'参考范文 · 未来目标',answer:"A goal I want to achieve in the next five years is becoming fluent in Japanese. This isn't just about passing an exam — I want to be able to live, work, and make friends in Japan comfortably.\n\nMy motivation comes from several sources. I love Japanese literature and films, and I often feel that translations don't fully capture the original meaning. I'm also fascinated by Japanese design culture and would love to collaborate with professionals there.\n\nTo reach this goal, I've already started taking online classes and practicing with language exchange partners. I aim to study at least one hour every day, even when I'm busy.\n\nI know fluency takes years, but I believe consistent effort will get me there. The journey itself is already changing how I see language and communication.",tips:'💡 说明目标的深层动机；给出具体学习计划；强调过程的价值'},
  {q:'Describe a time you received good news.',title:'参考范文 · 收到好消息',answer:"The best news I received recently was getting accepted into a master's program I had dreamed about for two years. I still remember the exact moment I read the email.\n\nIt was a rainy afternoon, and I was actually feeling quite anxious because the results were supposed to come out that day. When I saw the words 'We are pleased to offer you admission', I read them three times to make sure I wasn't imagining it.\n\nThe first person I called was my mother. She screamed with joy on the phone, and we both ended up crying. That night, my family went out for a big dinner to celebrate.\n\nThis news was important not just because of the program itself, but because it proved that my hard work had paid off. It gave me confidence that I can achieve difficult things if I stay committed.",tips:'💡 描述收到消息时的环境；加入情绪反应；说明好消息的长期意义'},
  {q:'Talk about an environmental problem in your area.',title:'参考范文 · 环境问题',answer:"One environmental problem in my city is the increasing amount of plastic waste, especially from takeout food packaging. It's becoming hard to ignore.\n\nAlmost every day, I see plastic bags, disposable chopsticks, and food containers thrown into ordinary trash bins. Because these items are not properly sorted, most of them end up in landfills or even rivers.\n\nThe main cause, in my opinion, is convenience culture. People want fast delivery and don't want to wash reusable containers. But this short-term convenience creates long-term damage.\n\nI believe the solution requires both individuals and businesses to change. Customers can choose restaurants that use eco-friendly packaging, and companies should take responsibility for reducing waste at the source. Small changes, when multiplied by millions of people, can make a real difference.",tips:'💡 描述具体可见的问题；分析原因；提出个人和企业层面的解决方案'}

  {q:"Describe a businessman that you admire",title:"Part 2 范文",answer:"Sarah Paiji Yoo is someone I admire. She built the Blueland brand in the US. She was worried about the amount of microplastics in the water she used to feed her child, and was eager to eliminate her reliance on disposable plastics as a new mother. I got to know this brand through an advertisement on Instagram, and I was very interested in it, so I searched for her stories on the official website. This is a business that sells hand soap, laundry detergent, bathroom cleaner, and more. Unlike other brands, their soaps are in the form of dry tablets and packaged wi th compostable paper-based wrappers or containers. When the customers start using it, just add water and dry tablets to the bottle, and they can get a bottle of common household detergent, which significantly reduce the waste of plastic bottles by reusing the bottles again and again. Environmental problems are getting more and more serious, especially the toxic effects of plastics. We are eating and drinking plastic because the raw materials contain microplastics. Since plastic may be accidentally eaten int o the stomach by wild animals and cannot be digested, it can endanger their lives. In addition, the ocean is being polluted because most of the plastic waste is dumped in the ocean because it cannot be degraded. I think this business idea is great, and this is the trend of an advanced business idea. It is not only environmentally friendly, but also saves money. When they produce and transport products, they reduce the risk of damage to the packaging, while also reducing the volume and weight of the packaging. The Blueland only sell to customers the core of the product, and the customers get a sense of accomplishment in participating in environmental protection without reducing their sense of use.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a creative person whose work you admire",title:"Part 2 范文",answer:"The creative person I admire very much is my college tutor. His name is Kimi. I came into formal contact with my academic advisor in my sophomore year. Because everyone needs to write a graduation thesis before graduation, each student will be assigned a teacher for guidance. The reason why I say my tutor is a very creative person is that he is young but has already made many academic achievements. For example, he has published articles as the first author in many influential international journals. He always has his own unique and advanced views on the construction of theoretical models, and can better respond to problems in real life and put forward creative and tried solutions, His research fields are mainly related to government investment and innovation and entrepreneurship. As a young teacher, he has made a lot o f scientific research achievements. During his undergraduate study, he has always been an example for me. At the same time, he is also happy to communicate with students and people from all walks of life and share the latest ideas and views. I think this is probably one of the reasons why he is so creative. I was very impressed that when we held an academic seminar, Kimi was always able to come up with a highly feasible solution to the bottlenecks encountered by the seniors in their respective research fiel ds after some thinking and logical reasoning. I think this is also an embodiment of strong creativity. Creativity is not only reflected in practical ability, such as handcraft or other inventions. From my personal point of view, a steady stream of new ideas is also one of the manifestations of creativity. Of course, it is undeniable that these need a high level of knowledge and personal ability as support.\n\nPart3 Do you think you are a creative person？ I don't think I am a particularly creative person. I should have more learning ability than creativity. I seldom have a new idea or inspiration in my mind. Usually, I play the role of execution or imitation in the team. I think creativity requires a strong knowledge system or rich insight to often have new i deas. In the future, perhaps I need further learning and knowledge accumulation, and maybe one day I will have a creative achievement.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a person who offer a clever solution to a problem",title:"Part 2 范文",answer:"I would like to talk about an able person who come up with an intelligent method is the leadership of my internship company in the last summer holiday. The leader mainly be responsible for the personnel management especially the new worker. As we all know that it would be quite challenging for people to adapt to new environment and feel embarrassed at first to talk with others, which would influent the work efficiency undoubtedly so this was the headache for us in that we were unwilling to have conversation with unfamiliar co-workers and the result of which was that the working atmosphere was intense. Consequently, the leader wanted to address this barrier so that we could get along well with each other and increase the work efficiency. When it comes to the method towards this problem, our leader adopted a weekly chat room as an icebreaker where we had some thrilling games that we had to cooperate together and had some interaction. I still remembered an unforgettable game that we needed to find a partner or two people according to rules before the music stops. It was truly an exciting game in that those who failed had the little punishment like singing or dancing. After that, we got to know each other quickly and discussed the work mission Regarding the explanation why I think his solution was clever mainly for two reasons. To begin with, He brought us closer together unconsciously and strengthened our relationship in order to have better communication and then promote the efficiency. What’s more, we also alleviated the stress while playing and it didn't take up t he time off work.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an famous athlete that you know",title:"Part 2 范文",answer:"I would like to talk about a well-known shooting athlete who participated in 2020 Tokyo Olympics. I knew her occasionally when I was watching the Olympics on tv, I found that young female won bur quite calm unlike other athletes who would cry out with excitement. So she successfully caught my attention and then I could see her on many social media applications frequently. When it comes to her achievements, she won the first gold medal for China and also got another gold medal in the pair competition. In the interview, her father said that he never assumed that she would behave so well in the first attempt. Besides, she was also a student in the one of the best universities in China, Qing Hua college. I still could remember that competition that she when she took every shot with equanimity, even if there was a little mistake. It was her strong heart that could help her accomplish such crucial competition. After she got the first gold medal for our country, her hairpins and nails were in vogue among people. The hairpins were even out of stock. There are several reasons for why she becomes so renowned. To b egin with, she strived for the first medal in the spotlight of the public and was also quite young. Apart from this, it was her first competing in Olympics as well as she was a student of the top university, as a result of which, a majority of people think she is an all-round talent.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a foreign person who you have heard or known that you think is interesting",title:"Part 2 范文",answer:"Well, I would like to talk about Michael Jackson, who is the most interesting man I have ever heard about. Michael Jackson was an American singer, songwriter, and dancer. Since my fat her is a fan of Michael, he often plays Michael's songs at home. Therefore, I got to know him and started to listen to his music when I was very young. At first, I was just interested on how he made his music, his dance moves, how he was able to become the greatest entertainer in the world. How did that journey go? To me it was really motivating that he went from being a little kid in a 3 room house with 10 other people living there, to the world's superstar Michael Jackson. And I truly got to know about his genius and how he saw the world, which was truly amazing. Then, as I got more into his life, I wanted an explanation for all the controversies around him and what I found was even more amazing, though I have to say that I felt ashamed for all my ignorance before I knew what I know today. While I learned about his life I got that kind of knowledge that I though I'd never need. Seeing all the malicious attacks he got during many years made me realize more about human nature and reminded me what it means. Seeing the way he faced everything, the positive message he brought to people and how much he did for others, inspired me to want to be a better person, no matter how good I think I already am. After all, Michael Jackson taught me that it's all about LOVE. Michael Jackson is absolutely an interesting person. It does not mean that he is a funny guy who can make people laugh, just like a clown does. He is interesting because he has the ability to inspire people and teach people love. That's more than interesting for me.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a person who impressed you most when you were in primary school",title:"Part 2 范文",answer:"I'm going to talk about Xiaohan. She was one of my best friends in primary school. She transferred to our class in the third grade. Before she came, I always ranked first in our class, but after she came, because of her good grades, we often compete. Although we compete a lot, we often did homework, discussed topics together, and we also exchanged idea. Besides, we have similar specialties and hobbies. I am very good at long-distance running, so before the winter long-distance running every year, I helped her practice, and we crossed the finish line side by si de in the formal competition. She is good at sprinting, and she often taught me about the starting posture and breathing rate helped me achieve good results in the sports competition. In addition, we like drawing. We often exchanged sketchbooks to give suggestions to each other. I guessed this is the basis for her to work in a design company now. I think she has a great influence on me because we can help each other and grow together, not only in academics, but also in specialties and hobbies. She is not o nly my best friend, but also the closest partner and teammate on the road to growth. When I am in trouble, I always think of asking her for help. When I was sad, she would put aside the things at hand and accompany me out to relax and chat. When I have achievements, she will always be happy for me sincerely. We are still in contact until now. Although we are not in the same school anymore, we still meet in person or chat through video from time to time. I feel very lucky to have such a good friend for a lifetime, and I am very grateful for her help and encouragement.\n\nPart 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a person whose music or singing you like",title:"Part 2 范文",answer:"I’d like to describe my favorite singer whose name is Chen Yixun or Eason as his fans like to call him. Born and raised in Hongkong, Eason has been singing for over three decades, and his name is well -known both in Hongkong and mainland China. I think he is in his late 40s, but he is still pretty active both on and off stage. I mean he still holds concerts every year, and whenever I see him in a talk show or an interview, he looks so energetic always with a big smile on his face. So, if I were to characterize him, I would say he is outgoing, optimistic and passionate about his singing career. Talking about his style, well, he is a pop singer and is very versatile if I may say so. Throughout his singing career, he’s tried different kinds of music styles like R&B, rap, blues and even r ock. I think that explains why he is able to remain popular with the audience --- he always tries to explore in music and never gets satisfied. Finally, let me explain why he is my favorite singer. Well, it is his voice, which sound so natural, and thus attractive. When listening to his songs, you don’t feel he is so obsessed with the so -called techniques. I mean he’s just there telling you a deeply felt story with the lyrics and melody. Besides, I guess, most important, I like singing his songs. And I find a close resemblance between our voices. It is this resemblance that I feel connects me to Eason.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a time when you got up early",title:"Part 2 范文",answer:"I want to talk about on last weekend, I woke up at five o'clock for two days to verify a three-hour morning routine proposed by a video I saw on the social media, which says it can make people feel refreshed throughout the day. This procedure has twelve steps. After waking up, I first recalled what dream I had the night before, then I made up the bedding and drank a glass of warm water. After that, I meditated for 20 minutes, did push -ups for 2 minutes, and then took a cold shower to wake me up. While waiting for tea, I wrote a diary and made a to-do list for the day. I also made a to-feel list to tell myself what I should be gratitude during the day, for example, I should be thankful to the meals my parents would cook for me today. After drinking tea, I read a book for 20 minutes and made a smootie for breakfast. It was almost eight o'clock when these things were done, and I started a day of study. Since I was up and ready, I could study efficiently and attentively all morning. I think this morning routine has taken me a lot of time, but it is very helpful to develop a healthy living habit. For example, I know I am a morning person, the routine forces me to go to bed early and get up early to avoid staying up late. Besides, since reading is one of the steps, I have no excuses not to read and I have already read some good articles on last weekend. In addition, listing and having my schedule written down for the whole day before studying or working, I can ensure that I won’t miss anything. Since there are so many pros, I decided to follow this morning routine every weekend, and I also recommend others to try this if you are a morning person as well.\n\nPart3 Do you think getting up early is important？ I think it is important for morning people like me to get up early. Because I do things efficiently in the morning, getting up early makes me more productive. Of course, getting up early should be based on not staying up late, otherwise lack of sleep will harm our health.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a time you were friendly to someone you didn’t like.",title:"Part 2 范文",answer:"Let me tell you about the challenging person I had to deal with when I was doing a group assignment for a course last year. I still remember it was a marketing course, and the teacher divided us randomly into small groups. We were asked to investigate a company's marketing strategies and wrote a group report, which counts for half of the final results. Therefore, I treated this assignment seriously. However, there was a guy called Li Ming, who was in my group. He was a really irresponsible guy who was usually late for our group meetings, a nd even absent with no reason. He did not contribute anything to this important group assignments at first. Thought I was really frustrated by him and did not personally like him, I tried hard to face it. I had to get along well with this guy because I nee ded his participation to be successful in this assignments. Therefore, in the following days, I tried to communicate with him to find out the reason why he did not want to contribute. To my shock, the true reason he did nothing for the group assignment is that his mother was sick and in hospital those days. He had to look after his mother in the hospital, so he did not have much time for the meetings. He told me he was really sorry for the absense before, and he also promised me that he would do more to compromise as soon as his mother got better. He kept his promise, and focused on the assignment when his mother was good enough to leave the hospital. In the end, our assignment was finished perfectly. I was really glad that I chose to talk to him but not directly told on him. Sometimes, it is useful to be friendly to others who you might even do not like.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a bicycle/motorcycle/car trip you would like to go",title:"Part 2 范文",answer:"I'd like to talk about a car trip I plan to go on next summer vacation. Actually, I planned to travel to Xinjiang Province with my family last month, but the covid -19 came out of the blue, so everything was delayed. I planned to travel there with my parents because we all had a summer holiday and it was the only time in a year for us to gather together. We'd like to visit Xinjiang province, where is located in the west of China, situated far from the sea and encircled by high mountains. We watched a video on the Internet about the landscapes of the famous Kanas Lake, which is called the Pearl of Northern Xinjiang, and we were impressed by its clear and tranquil water. Besides, my father also wants to try hiking around Kanas Lake, which is on our must-to-do list. I want to visit Xinjiang next summer holiday when my parents and I can take ten days off in the middle of August. Apart from the famous Kanas Lake, we also plan to go to Sayram Laks, which is the largest alpine lake in Xinjiang. It's said that we can see the best view of the lake in August. The great snowy mountains in the west of the lake will offer a cooling effect on the hottest days while near the lake, and wildflowers will bloom aplenty on the grasslands. I can't wait to see that lovely view. We want to go there by c ar because Xinjiang province is vast and only has few airports. There are a few flights between major attractions, so it's very time -consuming and expensive to travel in Xinjiang by plane. Besides, my dad is an excellent driver, and he has rich experience in car traveling. So we trust him. And lastly, my family is very casual about traveling. We don't like to follow the timetable and make our schedule very tight. So, traveling by car is the best option for us.\n\nPart3 Which form of vehicle is more popular in your country, bikes, cars or motorcycles? In the city center, cars are more popular, and almost every family has their private vehicles. It's more convenient for people to travel by car. And it can save their commuting time. In the countryside, bikes and motorcycles are more popular, where the mountain road is narrow and the road condition is complex.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a time when you waited for something special that would happen",title:"Part 2 范文",answer:"Two months ago, I attended my undergraduate graduation ceremony. One of the parts was that the tutors turn of the tassel for students, which means that all of us officially will end our college life and graduate from college. At about 8 a.m. on the day of graduation ceremony, we arrived at the campus in academic dress, which is located in Xuhui District, Shanghai, and it is an area full of life. First of all, we sat in the auditorium and listened to the headmaster and Dean express their wishes and expectations for our graduation. Then, under the leadership of student representatives, we made a joint oath. The last part is the one we waited for the longest and full of expectations, that is, the turning of tassel of the teacher. The whole audience went on stage in turn, and every twelve people were in a group. E veryone lined up backstage in advance. During the backstage preparation, I was excited and a little nervous, of course, also with joy. Additionally, I was silently thinking about what to say to my mentor for a while. When the music sounded, the students in our queue went to the podium together and came to the teachers who were also in the same academic dresses. I took the graduation certificate from my teacher, then lowered my head and waited for the turning of teacher, after finishing, I shook hands with him and expressed my gratitude for his guidance and education during my university's life. The teacher also expressed congratulations on my graduation. This process was very short. We came down from the stage after about a minute, but for me, it was a significant ceremony and left me a really deep memory.\n\nPart 3 On what occasions do people usually need to wait? The occasions that people need to wait has gradually decreased with the progress of digital workflow, but what I see most in life is waiting in line for dinner in the mall or waiting in line at the door of the elevator. Generally speaking, when the supply and demand are unbalanced, especially when the supply is significantly less than the demand, there will be waiting. Another occasion is that a certain ceremony will only take place at a specific time or place, so people will make preparations in advance and wait there.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an occasion when you were proud of your parents.",title:"Part 2 范文",answer:"In fact, I am often proud of my parents. My father is the le ader of the Education Bureau. His work is to make overall arrangements for primary and secondary schools in our city, including textbooks ordering and production, schools’ establishment, counterpart regional division, rules and regulations and so on. As a Communist Party member, in his 20- year work experience, he has well explained the purpose of serving the people. Of course, what I admire most is not only his own work. Since the year before last, he and my mother have gone to the countryside to help the poor, went deep into the rural grass-roots level, carried out auxiliary publicity and sales activities of agricultural products for poor counties, conducted door-to-door survey in order to find the difficulties of the people, and tried to solve the problems which still exist in their lives, I still remember that last winter, they went to the rural areas in need of poverty alleviation again and they made a short video for me. The snow on the mountain was very heavy, and the life environment is really poor. There was no bathroom for them to take a bath. When they worked there, they could only wipe their bodies with wet towels every day. Fortunately, through the efforts of them and the working group, the farmers who once lived in poverty have gradually led a nor mal life, and their agricultural products can also be sold to the cities so that they have a steady income now. During the Spring Festival this year, we also received agricultural products from the farmers to express their thanks. I was really touched. I hope that I can become a person who can have a positive impact on society and family like them in the future.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an occasion when two of your friends disagreed about something",title:"Part 2 范文",answer:"I’d like to talk about an argument that happened between two of my friends - Nick and Jonas. It was two years ago when we flew to Bali for vacation. Nick is quite good at or ganization so he planed all the itineraries before we started. As soon as I got off the plane in Bali, the sea breeze blew away all my fatigue. It was like, a wonderful holiday was calling me ahead. But who knows it’s just the beginning of a nightmare. It was nearly 1 a.m when we got back to the hotel after a full-day visit, and all of us were super exhausted. At that time, Nick told us that we would go to Ayong River rafting at 6 o 'clock next morning, as the place where we stayed was far away from the des tination, there was very little time for us to sleep. So, Jonas complained that Nick’s schedule was too tight and that it’s gonna be impossible to get up early next morning. Anyway, after a few short hours of sleep, we got up with loose eyes, then we rushed to the meeting place after quick washing, but we found no one there. We waited for another thirty minutes and still no one was in sight. Suddenly, Jonas got irritated because he found the scheduled time was 6 p.m., he shouted loudly at Nick and complaine d why he didn’t check the reservation carefully. Nick was aggrieved and he accused Jonas of doing nothing and counting on him to make all the arrangements. I didn’t know how to persuaded them to calm down, so I just watched them fighting over each other fiercely. Well, I’ve already forgotten how we went back to the hotel, but I clearly remember that they didn’t talk to each other for the next few days. Then I realized that we should not rely too much on others when traveling abroad, and it’s better to share responsibilities.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an occasion you remember when you saw a lot of people smiling",title:"Part 2 范文",answer:"Last spring festival I went to Alice’s house to celebrate this great day with a bunch of old friends.It was so sweet that Alice made a table of gourmet dishes for us. While enjoying the food, Alice's five -year-old daughter, Mary, came in and told us she prepared a show for us; This cutie finished the show all by herself, and she pretended to be her idol to play the role of both hostess and performer. I must say it was a great show that made everyone feel delighted. In the beginning, she gave an opening speech with exaggerated f acial expressions and vivid postures. She looked so bouncy and a bit hilarious, which kept everyone laughing through the show. The funniest thing was that she tried to wear some cosmetic products, like eye shadows and lipsticks, but she just wore too much，making her look like a clown. Alice was amazed about all these, and she was the one who laughed to tears. She told us Mary stole her mini-skirt to dress up, but it looked like she was wearing a long gown. While dancing, Mary was wearing her mom 's high -heels, which made her stumble a bit. This time, everyone was smiling at her, encouraging her by saying things like‘ wow, you look great! '. That was probably the sweetest moment. It must make Mary feel stronger since she gave a really nice ending to her sho w. Children might be the happiest people in this world, and it’s so lucky to have them by our side\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a time when you shared something with others (or another people)",title:"Part 2 范文",answer:"I shared something interesting about psychology with my colleague s last month to improve the sanitation of the bathroom in our office, and it worked pretty well. There is a psychology theory called “broken windows effect”, which points out that if an area showed small amounts of destruction, such as a broken window or graffiti on a wall, the vandalism would increasingly grow if it is not fixed straight away. I mean, people are inclined to deface the area when it is slightly damaged. However, if an area is clean and not vandalized, people are more likely to respect and look after it. In terms of why I shared it with them. Well, my boss found that the sanitary condition of the staff toilet was getting worse and worse, my colleagues’ waste paper was not put into the basket and the water on the washbasin was spilling everywhere. So he called me and several other department heads of the company to have a discussion on this matter. They didn’t have a good idea to make employees voluntarily maintain good working conditions, so this psychological case popped into my mind and I shared it with them. As expected the case was solved within a month. Everyone realized the importance of protecting the sanitation of public areas. You know, they would immediately clean it up after using the bathroom. This experience inspired me a lot, and I think sharing things with others brings me a sense of comfort and self-satisfaction.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a time you saw something interesting on social media",title:"Part 2 范文",answer:"Last weekend, I was snowed under with loads of homework at home. No exaggeration to say, I was typing for the whole morning, and I just finished one piece of them. That was quite frustrating, so not soon after, I started to fiddle with my phone. While I was browsing the internet through Weibo, A funny video clip caught my attention. The title of this video is: how babies react after tasting sour lemon, and the cover page is a crying face of a cute baby. I clicked the button and started to view it. That was probably the funniest one I’ve ever watched. In this video, ten babies were filmed while they’re trying this food, and they gave complete different reactions. Some of them cried loudly with a face saying: are you giving me the poison? One of them seemed shocked at first, and then he kept licking the lemon bits by bits. In the end, there was a deep frown on his face; I was almost laughed into tears when seeing these cute babies doing this. I guess they must feel confused about this strange food, and also become angry about their naughty parents. They might be thinking: why do you give me such horrible food? Later I found trying lemons is a good way for babies to stimulate their taste buds and explore the sense of taste. After watching this video, I got recovered from fatigue and restarted doing my assignments. No wonder why people say social media has the power to help you let off steam.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a time when you did something to help a friend",title:"Part 2 范文",answer:"I’d like to describe an experience that I helped a friend of mine. This friend whose name is Mark is my high school classmate, and we’ve been friends for over 10 years now. Even though, I’ve been living and working in another city in recent years, we still keep in contact and remain close. It happened two months ago when I received a phone call from Mark. Well, normally we chat on Wechat rather than talk on the phone, so I just had a hunch that there was something serious. Like I expected, Mark felt a little weird in his voice. It felt as if there was something he wanted to say but found it hard to get the words out. in order to help with situation, I just asked him what was going on and urged him to be straight with me. A it turned out, he was planning to buy a new apartment but was low on money, so he hoped that I would lend him 20,000 yuan for his down payment. Without any hesitation, I said yes and asked for his bank account number so that I could wire the money to him. The reasons why I helped him were simple. He is my friend, probably the only good friend I’ve ever had and am going to have, so I f elt it my responsibility to lend a helping hand, well in this case, money. Besides, 20,000 yuan wasn’t too much for me at that time, but it would mean a lot for Mark and his plan of buying a new house. So, I saw no reason why I shouldn’t help him out. I fe lt good of course because I just helped a person I really cared about. Mark promised to pay me back in one month, and I wasn’t worried at all because Mark was always good for his words.\n\nPART 3 How do people usually help each other In fact, there are many ways to help others depending on what kind of difficulties the people encounter and what kind of help they need. For example, when we meet children in poverty-stricken mountainous areas, we can make donations within our capabilities; When we find it diff icult for our friends to resolve the depression, we can take them out to relax, eat and chat. All in all, in my opinion, there is no fixed way to help others. As long as the problem can be solved, the result is good, and the approach is not the most important thing.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
