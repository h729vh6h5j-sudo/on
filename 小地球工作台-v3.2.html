<title>地球Online 工作台 ✦ 清新简约个人工作台</title>
<style>
/* ============ 0. TOKENS - 莫兰迪低饱和橄榄绿 ============ */
:root{
  /* 主色调：莫兰迪橄榄绿（适配EXIT图标） */
  --nerv:#8B9A7D; --nerv-2:#A8B89C; --nerv-dim:rgba(139,154,125,.14);
  --nerv-light:#F0F3ED;
  /* 背景与面板：暖白+米灰 */
  --bg:#FAFAF6; --bg-2:#F3F4EE; --panel:#FFFFFF; --panel-2:#F7F8F3;
  /* 线条与边框：暖灰 */
  --line:#E5E7DD; --line-2:#D4D9CC;
  /* 文字：深灰棕 */
  --tx:#3D3D37; --tx-2:#5E5E55; --tx-3:#909285;
  /* 辅助色（各模块用 - 莫兰迪低饱和） */
  --accent-pink:#E8C4C4; --accent-mint:#B8CEB8; --accent-lavender:#C8C0D4;
  --accent-peach:#E8D4BC; --accent-sky:#B8C8D4; --accent-lime:#D4DDB8;
  /* 圆角与阴影 */
  --r:20px; --nav-w:240px; --nav-w-m:140px;
  --shadow:0 4px 20px rgba(139,154,125,.07);
  --shadow-hover:0 8px 30px rgba(139,154,125,.13);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
/* 强制浅色模式，拒绝深色 */
html[data-theme="dark"]{
  --nerv:#8B9A7D; --nerv-2:#A8B89C; --nerv-dim:rgba(139,154,125,.14);
  --bg:#FAFAF6; --bg-2:#F3F4EE; --panel:#FFFFFF; --panel-2:#F7F8F3;
  --line:#E5E7DD; --line-2:#D4D9CC;
  --tx:#3D3D37; --tx-2:#5E5E55; --tx-3:#909285;
  --shadow:0 4px 20px rgba(139,154,125,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  font-size:14px; line-height:1.6; overflow:hidden;
  -webkit-font-smoothing:antialiased; position:relative;
}
/* 极简柔光背景 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
  background:
    radial-gradient(60vw 60vw at 10% -10%, rgba(139,154,125,.07), transparent 60%),
    radial-gradient(50vw 50vw at 90% 10%, rgba(168,184,156,.05), transparent 60%),
    radial-gradient(55vw 55vw at 50% 110%, rgba(139,154,125,.045), transparent 60%);
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--nerv-2)}
::-webkit-scrollbar-track{background:transparent}
input,textarea,select,button{font-family:inherit;font-size:14px;color:inherit;border:none;outline:none}
a{color:var(--nerv);text-decoration:none}
a:hover{text-decoration:underline}

/* ============ 1. LAYOUT — 左侧边栏 + 右侧内容区 ============ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;height:100dvh}

/* --- 左侧导航栏（清新简约风） --- */
.nav-panel{
  display:flex;flex-direction:column;background:linear-gradient(180deg,#FFFFFF 0%,var(--bg-2) 50%,var(--bg) 100%);
  border-right:1px solid var(--line);min-height:0;position:relative;z-index:10;
  overflow:hidden;transition:transform .28s ease,opacity .2s ease;
}
/* 侧栏折叠（手机/电脑通用） */
.app.nav-collapsed{grid-template-columns:0 1fr}
.app.nav-collapsed .nav-panel{transform:translateX(-100%);opacity:0;pointer-events:none;box-shadow:none}
/* 桌面端顶栏菜单按钮 */
.top-menu-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--nerv);cursor:pointer;
  flex:none;margin-right:4px;
}
/* 移动端顶栏（含小汉堡按钮） */
.mtop{
  min-height:calc(48px + env(safe-area-inset-top));flex:none;display:none;align-items:center;gap:10px;
  padding:env(safe-area-inset-top) 14px 0;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
}
.mtop .mb-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--nerv);cursor:pointer;flex:none;
}
.mtop .mt-title{flex:1;font-size:15px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px}
.mtop .mt-title .emo{font-size:18px}
.mtop .mt-clock{font-family:var(--mono);font-size:11px;color:var(--nerv);font-weight:600}
.nav-head{
  padding:calc(24px + env(safe-area-inset-top)) 18px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);text-align:center;
}
.nav-avatar{
  width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--nerv);
  box-shadow:0 4px 16px var(--nerv-dim);flex:none;background:var(--nerv-light);
  display:grid;place-items:center;
}
.nav-avatar img{width:100%;height:100%;object-fit:cover}
.nav-head h1{margin:4px 0 0;font-size:16px;font-weight:700;color:var(--nerv);letter-spacing:.5px}
.nav-head p{margin:0;font-size:10px;color:var(--tx-3);letter-spacing:2px;font-family:var(--mono)}
/* 云同步状态指示器 */
.sync-status{
  display:flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px;
  background:var(--nerv-light);border-radius:12px;font-size:10px;font-weight:600;
  color:var(--nerv);cursor:pointer;transition:.2s;
}
.sync-status.connected{background:var(--accent-mint);color:#2D7D5A}
.sync-status .dot{width:7px;height:7px;border-radius:50%;background:var(--tx-3);transition:.2s}
.sync-status.connected .dot{background:#4CAF50;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* 模块列表 */
.mod-list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.mod-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;
  cursor:pointer;color:var(--tx-2);position:relative;transition:.2s;
  border:1.5px solid transparent;background:var(--panel);user-select:none;
}
.mod-item:hover{background:var(--panel-2);border-color:var(--line);transform:translateX(4px)}
.mod-item.on{background:linear-gradient(135deg,var(--nerv-light),var(--panel-2));
  border-color:var(--nerv);color:var(--nerv);font-weight:700;box-shadow:0 4px 14px var(--nerv-dim)}
.mod-item .mi-icon{
  width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;
  border:2px solid var(--line-2);display:grid;place-items:center;background:var(--bg);
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.mod-item .mi-icon img{width:100%;height:100%;object-fit:cover}
.mod-item .mi-icon .emo-fallback{font-size:20px}
.mod-item .mi-text{flex:1;min-width:0}
.mod-item .mi-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-item .mi-sub{font-size:10px;color:var(--tx-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-item .mi-badge{font-size:9px;background:var(--nerv);color:#fff;padding:2px 8px;border-radius:10px;font-weight:800;flex:none}
/* 板块管理按钮 */
.mod-manage{
  display:flex;align-items:center;justify-content:center;gap:4px;
  padding:8px;margin:4px 12px;border-radius:12px;border:1.5px dashed var(--line-2);
  color:var(--tx-3);font-size:11px;font-weight:600;cursor:pointer;transition:.2s;
}
.mod-manage:hover{border-color:var(--nerv);color:var(--nerv);background:var(--nerv-light)}
/* 底部工具 */
.nav-foot{
  border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;
  flex-wrap:wrap;justify-content:center;
}

/* --- 右侧主内容区 --- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:transparent;position:relative}
.top{
  height:56px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 24px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
}
.top h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
.top h2 .emo{font-size:20px}
.top .sub{font-size:11px;color:var(--tx-3);font-family:var(--mono);border-left:1px solid var(--line-2);padding-left:12px}
.top .sp{flex:1}
.clock{font-family:var(--mono);font-size:12px;color:var(--nerv);letter-spacing:.5px;text-align:right;line-height:1.3;font-weight:600}
.clock b{display:block;font-size:9px;color:var(--tx-3);letter-spacing:1.6px;font-weight:500}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;-webkit-overflow-scrolling:touch}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 2. PANEL - 大圆角卡片 ============ */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr)}
.g-main-r{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;
  transition:.2s;
}
.panel:hover{box-shadow:var(--shadow-hover)}
.panel>.hd{
  display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--panel-2);
}
.panel>.hd .dot{width:8px;height:8px;background:var(--nerv);flex:none;border-radius:50%;
  box-shadow:0 0 0 3px var(--nerv-dim)}
.panel>.hd h3{margin:0;font-size:14px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.panel>.hd .emo{font-size:16px}
.panel>.hd .tag{font-family:var(--mono);font-size:9px;color:var(--tx-3);letter-spacing:1.4px}
.panel>.hd .sp{flex:1}
.panel>.bd{padding:16px}
.panel.accent::after{content:"";position:absolute;top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--nerv),transparent 70%)}

/* ============ 3. ATOMS ============ */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--tx-2);font-size:12px;font-weight:700;
  transition:.2s;white-space:nowrap;
}
.btn:hover{border-color:var(--nerv);color:var(--nerv);background:var(--nerv-light);transform:translateY(-1px)}
.btn.sm{padding:6px 12px;font-size:11px;border-radius:10px}
.btn.gh{background:transparent;border-color:transparent}
.btn.gh:hover{background:var(--nerv-light)}
.btn.pri{background:var(--nerv);border-color:var(--nerv);color:#fff;box-shadow:0 4px 12px var(--nerv-dim)}
.btn.pri:hover{background:var(--nerv-2);color:#fff}
.btn.dgr:hover{border-color:#FF8A9D;color:#FF8A9D;background:rgba(255,138,157,.08)}
.ipt,.sel,.ta{
  width:100%;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);
  color:var(--tx);outline:none;transition:.2s;font-size:13px;
}
.ipt:focus,.sel:focus,.ta:focus{border-color:var(--nerv);box-shadow:0 0 0 3px var(--nerv-dim)}
.ta{resize:vertical;min-height:70px;line-height:1.65}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx-3) 50%),linear-gradient(135deg,var(--tx-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.lbl{display:block;font-size:10px;letter-spacing:1.2px;color:var(--tx-3);font-family:var(--mono);margin:0 0 5px;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.f{flex:1;min-width:0}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--tx-2);cursor:pointer;transition:.2s;font-weight:700;
}
.chip:hover{border-color:var(--nerv);color:var(--nerv)}
.chip.on{background:var(--nerv);border-color:var(--nerv);color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:8px;font-size:10px;font-weight:800;font-family:var(--mono);letter-spacing:.4px}
.q{border-left:3px solid var(--nerv);background:var(--nerv-light);padding:10px 14px;border-radius:0 12px 12px 0;font-size:13.5px;line-height:1.7;color:var(--tx);margin:2px 0 6px}
.kpi{text-align:center;padding:14px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.kpi .v{font-size:26px;font-weight:800;font-family:var(--mono);color:var(--nerv);line-height:1.1}
.kpi .k{font-size:10px;color:var(--tx-3);letter-spacing:1px;margin-top:3px}
.kpi .emo{position:absolute;top:6px;right:8px;font-size:14px;opacity:.5}
.empty{text-align:center;padding:36px 16px;color:var(--tx-3);font-size:12px}
.empty .emo{font-size:36px;display:block;margin-bottom:8px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.06))}

/* ============ 饼状图 ============ */
.pie-wrap{text-align:center;padding:8px 0}
.pie-svg{max-width:220px;margin:0 auto}
.pie-legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.pie-legend .pl-item{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
.pie-legend .pl-dot{width:10px;height:10px;border-radius:3px;flex:none}
.pie-legend .pl-pct{font-family:var(--mono);color:var(--nerv);font-weight:800}
.pie-label{font-size:10px;fill:var(--tx);font-weight:700;text-anchor:middle;pointer-events:none}
.pie-pct-label{font-size:9px;fill:#fff;font-weight:800;text-anchor:middle;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.3)}

.bar-txt{font-family:var(--mono);font-size:12px;line-height:1.9;white-space:pre;overflow-x:auto;letter-spacing:-.4px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.mut{color:var(--tx-3);font-size:11px}
.sc{max-height:360px;overflow-y:auto;padding-right:4px}
.prog{height:8px;background:var(--panel-2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--nerv),var(--nerv-2));border-radius:8px;transition:.4s}

/* ============ 4. SUBNAV ============ */
.mod-wrap{display:grid;grid-template-columns:58px 1fr;gap:16px;align-items:start}
.subnav{display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.subnav .sn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:14px;
  cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--tx-3);font-size:10px;font-weight:700;transition:.2s}
.subnav .sn .emo{font-size:20px}
.subnav .sn:hover{color:var(--nerv);border-color:var(--line-2);transform:translateY(-2px)}
.subnav .sn.on{background:var(--nerv);border-color:var(--nerv);color:#fff;box-shadow:0 6px 16px var(--nerv-dim)}
.subnav.horz{flex-direction:row;position:static;overflow-x:auto;padding-bottom:4px}
.subnav.horz .sn{flex:1;min-width:64px}

/* ============ 5. DAILY - 每日总览卡片样式 ============ */
.daily-overview{
  background:linear-gradient(135deg,var(--nerv),var(--nerv-2));
  border-radius:var(--r);padding:24px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;
}
.daily-overview::before{
  content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;
  background:rgba(255,255,255,.1);border-radius:50%;
}
.daily-overview .do-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.daily-overview .do-title{font-size:16px;font-weight:800}
.daily-overview .do-stats{display:flex;gap:24px;font-size:13px}
.daily-overview .do-stats b{font-size:22px;font-weight:800}
.daily-overview .do-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
.do-kpi{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:14px;padding:14px;text-align:center}
.do-kpi .num{font-size:28px;font-weight:800;display:block}
.do-kpi .label{font-size:11px;opacity:.9;margin-top:4px}
.do-progress{margin-top:12px}
.do-progress-bar{height:10px;background:rgba(255,255,255,.25);border-radius:10px;overflow:hidden}
.do-progress-fill{height:100%;background:#fff;border-radius:10px;transition:.5s}
.cat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.cat-card{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;transition:.2s}
.cat-card:hover{border-color:var(--nerv);transform:translateY(-2px)}
.cat-card .cc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cat-card .cc-name{font-size:13px;font-weight:700}
.cat-card .cc-dot{width:10px;height:10px;border-radius:50%}
.cat-card .cc-count{font-size:24px;font-weight:800;font-family:var(--mono);color:var(--nerv)}
.cat-card .cc-total{font-size:11px;color:var(--tx-3);margin-top:2px}
.cat-card .cc-bar{height:6px;background:var(--bg);border-radius:6px;margin-top:8px;overflow:hidden}
.cat-card .cc-fill{height:100%;border-radius:6px;transition:.4s}

/* ============ 6. CARDS / LISTS ============ */
.tl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl-r{display:grid;grid-template-columns:64px 1fr 96px 30px;align-items:stretch;border-bottom:1px solid var(--line);min-height:42px}
.tl-r:last-child{border-bottom:0}
.tl-r:hover{background:var(--panel-2)}
.tl-r.now{background:var(--nerv-light)}
.tl-t{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--tx-3);
  background:var(--panel-2);border-right:1px solid var(--line);position:relative}
.tl-r.now .tl-t{color:var(--nerv);font-weight:700}
.tl-r.now .tl-t::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--nerv)}
.tl-i{border:0;background:transparent;padding:7px 10px;outline:none;width:100%;min-width:0}
.tl-i::placeholder{color:var(--tx-3);opacity:.5}
.tl-c{border:0;background:transparent;outline:none;font-size:11px;font-weight:700;cursor:pointer;padding:0 4px;
  border-left:1px solid var(--line);text-align:center;color:var(--nerv)}
.tl-x{display:grid;place-items:center;color:var(--tx-3);cursor:pointer;font-size:15px;border-left:1px solid var(--line)}
.tl-x:hover{color:#FF8A9D}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;font-size:9px;color:var(--tx-3);font-family:var(--mono);padding:3px 0}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:11px;cursor:pointer;
  position:relative;color:var(--tx-2);border:1px solid transparent;transition:.15s}
.cal .d:hover{background:var(--panel-2);color:var(--tx)}
.cal .d.o{opacity:.25}
.cal .d.has::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--nerv)}
.cal .d.today{border-color:var(--nerv);color:var(--nerv);font-weight:800}
.cal .d.sel{background:var(--nerv);color:#fff;font-weight:800}
.cal .d.sel::after{background:#fff}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  margin-bottom:7px;background:var(--panel-2);transition:.2s}
.task:hover{border-color:var(--line-2)}
.task.done{opacity:.5}
.task.done .tx{text-decoration:line-through}
.cbx{width:20px;height:20px;flex:none;border:1.5px solid var(--line-2);border-radius:6px;cursor:pointer;display:grid;place-items:center;transition:.2s}
.cbx:hover{border-color:var(--nerv)}
.cbx.on{background:var(--nerv);border-color:var(--nerv)}
.cbx.on::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.task .tx{flex:1;font-size:13px;min-width:0;word-break:break-word}
.task .rm{color:var(--tx-3);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.task .rm:hover{color:#FF8A9D}
.habit{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--panel-2)}
.habit .he{font-size:18px;width:24px;text-align:center}
.habit .hn{flex:1;font-size:13px;font-weight:600}
.habit .rm{color:var(--tx-3);cursor:pointer;font-size:14px}
.habit .rm:hover{color:#FF8A9D}
.habit .cb{width:36px;height:22px;border-radius:22px;background:var(--line-2);position:relative;cursor:pointer;transition:.2s;flex:none}
.habit .cb::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.habit .cb.on{background:var(--nerv)}
.habit .cb.on::after{left:16px}
/* 通用勾选框（用于每日要闻等非习惯场景） */
.cb{width:36px;height:22px;border-radius:22px;background:var(--line-2);position:relative;cursor:pointer;transition:.2s;flex:none}
.cb::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cb.on{background:var(--nerv)}
.cb.on::after{left:16px}
.greet{font-size:13px;color:var(--tx-2);margin-bottom:12px;padding:12px 16px;background:var(--panel-2);border-radius:14px;border:1px solid var(--line)}
.greet b{color:var(--nerv)}

/* ============ 7. ITEMS / CARDS ============ */
.item{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:11px;background:var(--panel-2);transition:.2s;position:relative}
.item:hover{border-color:var(--line-2);transform:translateX(2px)}
.item h4{margin:0 0 5px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item p{margin:0;font-size:12px;color:var(--tx-2);line-height:1.75;word-break:break-word}
.item .acts{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:.2s}
.item:hover .acts{opacity:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
.mv{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel-2);cursor:pointer;transition:.2s;position:relative}
.mv:hover{border-color:var(--nerv);transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.mv .ph{aspect-ratio:2/3;background:linear-gradient(150deg,var(--panel),var(--bg-2));display:grid;place-items:center;overflow:hidden}
.mv .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mv .ph .emo{font-size:36px;opacity:.35}
.mv .in{padding:10px 11px}
.mv .in b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .in .m{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:10px;color:var(--tx-3);font-family:var(--mono)}
.stars{color:#FFB84D;font-size:11px;letter-spacing:.5px}
.mvwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.mvc{border-radius:14px;overflow:hidden;background:var(--panel-2);box-shadow:var(--sh);transition:.2s}
.mvc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.mvc .cv{height:120px;display:flex;align-items:center;justify-content:center}
.mvc .cv .emo{font-size:42px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.15))}
.mvc .ct{padding:8px 9px}
.mvc .ct b{font-size:12px;display:block;line-height:1.3}
.mvc .cm{display:flex;align-items:center;gap:5px;margin:4px 0}
.mvc .chip{font-size:9px;padding:2px 6px;border-radius:8px;background:var(--nerv);color:#fff;opacity:.92}
.mvc .acts{margin-top:3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat .x{aspect-ratio:1;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);position:relative}
.heat .x.lv1{background:var(--nerv-dim)}
.heat .x.lv2{background:rgba(139,154,125,.22)}
.heat .x.lv3{background:var(--nerv)}
.heat .x.lv3{color:#fff}
.heat .x.today{border-color:var(--nerv);box-shadow:0 0 0 2px var(--nerv-dim)}

/* 博主头像 */
.blogger{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.2s}
.blogger:hover{transform:translateY(-3px)}
.blogger .av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--nerv-2),var(--nerv));display:grid;place-items:center;font-size:28px;border:2px solid var(--panel);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.blogger .nm{font-size:11px;font-weight:700;color:var(--tx)}
.blogger .del{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:1px solid var(--line-2);color:var(--tx-3);display:grid;place-items:center;font-size:11px;line-height:1;cursor:pointer;opacity:.55;transition:.2s;z-index:2}
.blogger .del:hover{opacity:1;color:#FF8A9D;border-color:#FF8A9D}
.blogger-add .av{background:transparent;border:2px dashed var(--line-2);color:var(--tx-3);font-size:26px}
.blogger-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:13px}
/* 视频链接（可跳转原平台） */
.bililinks{margin-top:8px;display:flex;flex-wrap:wrap}
.bili{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:12px;background:var(--nerv-light);color:var(--nerv);font-weight:800;font-size:12px;border:1px solid var(--line-2);margin:0 7px 7px 0;transition:.2s}
.bili:hover{text-decoration:none;background:var(--nerv);color:#fff;transform:translateY(-1px)}

/* 功能卡片 */
.fun-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel-2);cursor:pointer;transition:.2s}
.fun-card:hover{border-color:var(--nerv);transform:translateY(-2px);background:var(--panel)}
.fun-card .e{font-size:30px;margin-bottom:8px}
.fun-card b{font-size:13.5px;display:block;margin-bottom:4px}
.fun-card p{font-size:11px;color:var(--tx-3);margin:0;line-height:1.6}
.fun-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}

/* 灵感库 */
.idea-search{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:7px 7px 7px 18px;display:flex;gap:8px;margin-bottom:14px}
.idea-search .ipt{border:0;background:transparent;padding:7px 0}
.idea-search .ipt:focus{box-shadow:none}
.idea-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* 多选标签 */
.msel{display:flex;gap:6px;flex-wrap:wrap}
.msel .m{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:18px;font-size:11px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.msel .m.on{background:var(--nerv);border-color:var(--nerv);color:#fff}

/* 视频链接组 */
.link-group{display:flex;flex-direction:column;gap:7px;margin-bottom:9px}
.link-row{display:flex;gap:7px;align-items:center}
.link-row .ipt{flex:1}

/* ============ 8. MODAL / TOAST ============ */
.mask{position:fixed;inset:0;background:rgba(44,62,80,.3);backdrop-filter:blur(4px);z-index:200;display:none;
  align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:20px;width:100%;max-width:540px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(44,62,80,.15);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal .mh{padding:16px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:20px 20px 0 0}
.modal .mh h3{margin:0;font-size:15px;font-weight:800;flex:1;display:flex;align-items:center;gap:7px}
.modal .mb{padding:18px;overflow-y:auto}
.modal .mf{padding:14px 19px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.fld{margin-bottom:14px}
#toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--panel);border:1px solid var(--nerv);color:var(--tx);padding:11px 18px;border-radius:14px;
  font-size:13px;box-shadow:var(--shadow);animation:pop .25s ease-out;font-weight:700}
.tst.ok{border-color:var(--nerv)}
.tst.err{border-color:#FF8A9D}

/* ============ 9. MOBILE ============ */
.mtop,.tabbar,.scrim,.mtabs{display:none}
@media(max-width:900px){
  body{font-size:15px}
  .app{grid-template-columns:var(--nav-w-m) 1fr}
  .nav-panel{position:relative;width:var(--nav-w-m);transform:none;transition:none;box-shadow:none;padding-top:0;
    border-right:1px solid var(--line);z-index:10;background:linear-gradient(180deg,#FFFFFF 0%,var(--bg-2) 50%,var(--bg) 100%)}
  .nav-panel.open{transform:none;box-shadow:none}
  .nav-head{padding:14px 8px 10px;gap:4px}
  .nav-avatar{width:52px;height:52px;border-width:2px}
  .nav-head h1{font-size:12px;margin-top:2px}
  .nav-head p{display:none}
  .sync-status{display:flex;margin-top:4px;padding:3px 8px;font-size:9px}
  .mod-list{padding:10px 6px;gap:8px;display:grid;grid-template-columns:1fr 1fr;align-content:start}
  .mod-item{flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;min-height:76px;border-radius:12px;transform:none!important}
  .mod-item:hover{transform:none}
  .mod-item .mi-icon{width:32px;height:32px;border-radius:9px}
  .mod-item .mi-name{font-size:10px;text-align:center;white-space:normal;overflow:visible;text-overflow:clip}
  .mod-item .mi-sub{display:none}
  .mod-item .mi-badge{display:none}
  .mod-manage{display:flex;margin:4px 8px;padding:7px;font-size:10px}
  .nav-foot{padding:10px 8px;flex-direction:column;gap:5px}
  .nav-foot .btn{font-size:10px;padding:7px 7px;width:100%;justify-content:center}
  .top{display:none}
  .mtop{display:flex}
  .mtop .mb-btn{display:flex}
  .top-menu-btn{display:none}
  .body{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .grid{gap:13px}
  .g2,.g3,.g4,.main,.g-main,.g-main-r{grid-template-columns:1fr}
  .panel{border-radius:16px}
  .panel>.bd{padding:14px}
  .mod-wrap{grid-template-columns:1fr}
  .subnav{flex-direction:row;position:static;overflow-x:auto;padding-bottom:4px}
  .subnav .sn{flex:1;min-width:64px}
  .tabbar{display:none}
  .scrim{display:none}
  .app.nav-collapsed{grid-template-columns:0 1fr}
  .app.nav-collapsed .nav-panel{transform:translateX(-100%);width:0;padding-left:0;padding-right:0;opacity:0;pointer-events:none}
  .tl-r{grid-template-columns:52px 1fr 78px 28px;min-height:46px}
  .tl-t{font-size:10px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(48%,1fr));gap:11px}
  .modal{max-width:100%;max-height:90vh;border-radius:18px}
  .item .acts{opacity:1;position:static;margin-top:8px}
  .btn{padding:10px 15px}
  .sc{max-height:none}
  .kpi .v{font-size:23px}
  .blogger-grid{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
  .fun-grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
  .daily-overview{padding:18px}
  .daily-overview .do-body{grid-template-columns:repeat(2,1fr)}
  .cat-cards{grid-template-columns:repeat(2,1fr)}
  .home-hero{padding:20px}
  .home-hero .hh-time{font-size:34px}
  .home-fun-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:380px){.cards{grid-template-columns:1fr 1fr}}

/* ============ 5b. 连续时间轴 ============ */
.tl-add{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.tl-add .ipt,.tl-add .sel{padding:9px 10px}
.tlbar{margin-top:8px}
.tlbar .axis{position:relative;height:16px;margin:0 0 3px}
.tlbar .axis span{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--tx-2);font-family:var(--mono)}
.tlbar .track{position:relative;height:46px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tlbar .gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
.tlbar .blk{position:absolute;top:5px;bottom:5px;border-radius:8px;display:flex;align-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:.2s}
.tlbar .blk:hover{filter:brightness(1.06);transform:scaleY(1.04)}
.tlbar .blk span{font-size:10px;color:#fff;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.blk-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.blk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);transition:.2s}
.blk-item:hover{border-color:var(--line-2)}
.blk-item.dragging{opacity:.5;transform:scale(.98);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.blk-item.drag-over{border-color:var(--nerv);background:var(--nerv-light)}
.blk-item .drag-handle{width:18px;height:18px;display:grid;place-items:center;cursor:grab;color:var(--tx-3);font-size:12px;flex:none;touch-action:none}
.blk-item .drag-handle:active{cursor:grabbing}
.blk-list.manual .blk-item{position:relative}
.blk-list.manual .blk-item .drag-handle{display:grid}
.reorder-btns{display:flex;flex-direction:column;gap:2px;margin-left:4px}
.reorder-btns span{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--tx-2);font-size:10px;cursor:pointer}
.reorder-btns span:active{background:var(--nerv-light)}
.blk-item .bar{width:5px;align-self:stretch;border-radius:4px;flex:none}
.blk-item .tm{font-family:var(--mono);font-size:11px;color:var(--tx-2);white-space:nowrap;text-align:center;line-height:1.35;flex:none}
.blk-item .ct{flex:1;min-width:0}
.blk-item .ct b{font-size:13px;display:block;word-break:break-word}
.blk-item .ct .meta{font-size:10.5px;color:var(--tx-3);margin-top:2px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.blk-item .acts{display:flex;gap:5px;flex:none}
.dist{display:flex;flex-direction:column;gap:9px;margin-top:3px}
.dist .row{display:grid;grid-template-columns:80px 1fr 68px;gap:8px;align-items:center}
.dist .lab{font-size:11.5px;font-weight:700;color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist .bar{height:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dist .bar i{display:block;height:100%;border-radius:8px;transition:.4s}
.dist .val{font-size:11.5px;font-weight:700;text-align:right;font-family:var(--mono);color:var(--tx)}

/* ============ 5c. 场景对话（EnglishPod） ============ */
.scene{display:flex;flex-direction:column;gap:12px;margin-top:3px}
.scene .ln{display:flex;gap:10px;align-items:flex-start}
.scene .ln.b{flex-direction:row-reverse;text-align:right}
.scene .av{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--nerv-light);color:var(--nerv);border:1px solid var(--line-2)}
.scene .bub{flex:1;min-width:0;border:1px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--panel-2)}
.scene .ln.b .bub{background:var(--nerv-light);border-color:var(--line-2)}
.scene .bub .who{font-size:10px;color:var(--tx-3);font-weight:800;margin-bottom:3px;letter-spacing:.3px}
.scene .bub .en{font-size:14px;font-weight:700;line-height:1.65;color:var(--tx)}
.scene .bub .zh{font-size:12px;color:var(--tx-2);margin-top:3px;line-height:1.65}
.scene .tip{border-left:3px solid var(--nerv);background:var(--nerv-light);padding:10px 14px;border-radius:0 12px 12px 0;font-size:12px;line-height:1.75;color:var(--tx)}
@media(max-width:900px){
  .tl-add{gap:7px}
  .tl-add .ipt,.tl-add .sel{width:auto!important;flex:1;min-width:80px}
  .dist .row{grid-template-columns:66px 1fr 60px}
}
@media print{.nav-panel,.top,.mtop,.tabbar{display:none}.app{grid-template-columns:1fr}}

/* ============ TTS发音按钮 ============ */
.tts-btn{
  display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:50%;background:var(--nerv-light);border:1px solid var(--line-2);
  color:var(--nerv);cursor:pointer;font-size:14px;transition:.2s;flex:none;
}
.tts-btn:hover{background:var(--nerv);color:#fff;transform:scale(1.1)}

/* ============ 语音输入按钮 ============ */
.voice-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 14px;border-radius:12px;background:var(--nerv-light);border:1px solid var(--line-2);
  color:var(--nerv);cursor:pointer;font-size:12px;font-weight:700;transition:.2s;
}
.voice-btn:hover{background:var(--nerv);color:#fff}
.voice-btn.recording{background:#FF8A9D;color:#fff;border-color:#FF8A9D;animation:recPulse 1.5s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,138,157,.4)}50%{box-shadow:0 0 0 8px rgba(255,138,157,0)}}

/* ============ 打卡功能 ============ */
.checkin-btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:12px;
  background:var(--accent-mint);border:1px solid #A8E6CF;color:#2D7D5A;
  cursor:pointer;font-size:12px;font-weight:800;transition:.2s;
}
.checkin-btn:hover{background:#98D4BE;transform:translateY(-1px)}
.checkin-btn.checked{background:#4CAF50;color:#fff;border-color:#4CAF50}

/* ============ 历史折叠 ============ */
.history-collapse{
  border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;
}
.history-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--panel-2);cursor:pointer;transition:.2s;
}
.history-header:hover{background:var(--nerv-light)}
.history-date{font-size:14px;font-weight:700;color:var(--nerv)}
.history-count{font-size:11px;color:var(--tx-3);font-family:var(--mono)}
.history-arrow{transition:.2s;font-size:12px;color:var(--tx-3)}
.history-collapse.open .history-arrow{transform:rotate(180deg)}
.history-body{display:none;padding:12px 16px}
.history-collapse.open .history-body{display:block}

/* ============ 10. 首页（HOME） ============ */
.home-hero{
  background:linear-gradient(135deg,var(--nerv),var(--nerv-2));
  border-radius:var(--r);padding:28px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;
}
.home-hero::before{
  content:'';position:absolute;top:-50px;right:-30px;width:180px;height:180px;
  background:rgba(255,255,255,.09);border-radius:50%;
}
.home-hero .hh-time{font-size:42px;font-weight:800;font-family:var(--mono);letter-spacing:2px;line-height:1}
.home-hero .hh-date{font-size:14px;opacity:.88;margin-top:4px;letter-spacing:1px}
.home-hero .hh-greet{margin-top:14px;font-size:15px;line-height:1.7;opacity:.95}
.home-hero .hh-greet b{display:inline-block;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:8px;margin-top:6px;font-weight:700}
.home-hero .hh-greet .q-foreign{display:block;font-size:15px;font-weight:600;opacity:1;letter-spacing:.3px}
.home-hero .hh-greet .q-cn{display:block;font-size:12px;opacity:.72;margin-top:2px;font-style:italic}
.home-tasks{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.home-tasks .ht-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.home-tasks .ht-head h3{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.home-tasks .ht-count{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--nerv);background:var(--nerv-light);padding:4px 12px;border-radius:10px}
.home-tasks .ht-prog{height:10px;background:var(--panel-2);border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.home-tasks .ht-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--nerv),var(--nerv-2));border-radius:10px;transition:.5s}
.home-task-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.home-task-item:last-child{border-bottom:0}
.home-task-item .cbx{width:18px;height:18px;border-width:1.5px;border-radius:5px}
.home-task-item .tx{flex:1;font-size:13px}
.home-task-item.done{opacity:.45}
.home-task-item.done .tx{text-decoration:line-through}
.home-funs{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.home-funs h3{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.home-funs .hf-toggle{margin-left:auto;display:flex;gap:4px;background:var(--panel-2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.home-funs .hf-toggle span{padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--tx-3);transition:.2s}
.home-funs .hf-toggle span.on{background:var(--nerv);color:#fff;font-weight:700}
.home-fun-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.home-fun-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel-2);cursor:pointer;transition:.2s;text-align:center}
.home-fun-card:hover{border-color:var(--nerv);transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.home-fun-card .e{font-size:32px}
.home-fun-card b{font-size:12.5px;font-weight:800}
.home-fun-card p{font-size:10px;color:var(--tx-3);margin:0}
/* 首页功能列表视图 */
.home-fun-list{display:flex;flex-direction:column;gap:0}
.home-fun-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s;border-radius:0}
.home-fun-row:last-child{border-bottom:0}
.home-fun-row:hover{background:var(--nerv-light)}
.home-fun-row .e{font-size:24px;flex-shrink:0}
.home-fun-row .info{flex:1}
.home-fun-row b{display:block;font-size:13.5px;font-weight:700}
.home-fun-row p{font-size:11px;color:var(--tx-3);margin:2px 0 0}
.home-fun-row .go{color:var(--tx-3);font-size:18px;flex-shrink:0}

/* ===== 通用：列表/网格视图切换 ===== */
.vw-toggle{display:inline-flex;gap:4px;background:var(--panel-2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.vw-toggle span{padding:4px 9px;border-radius:8px;cursor:pointer;font-size:11.5px;color:var(--tx-3);transition:.2s;user-select:none;white-space:nowrap}
.vw-toggle span:hover{color:var(--tx)}
.vw-toggle span.on{background:var(--nerv);color:#fff;font-weight:700}

/* ===== 要闻网格 ===== */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.news-card{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:.2s;text-decoration:none}
.news-card.done{opacity:.55}
.news-card.done .tt{text-decoration:line-through}
.news-card:hover{border-color:var(--nerv);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.news-card .ct{font-size:10px;font-weight:700;color:var(--nerv);background:var(--nerv-dim);padding:2px 7px;border-radius:6px;align-self:flex-start}
.news-card .tt{font-size:12.5px;font-weight:700;color:var(--tx);line-height:1.5;flex:1}
.news-card .sc{font-size:10.5px;color:var(--tx-3)}

/* ===== 观影列表视图 ===== */
.mv-list{display:flex;flex-direction:column;gap:8px}
.mv-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}
.mv-row:hover{border-color:var(--nerv);background:var(--nerv-light)}
.mv-row .po{width:42px;height:58px;border-radius:8px;background:var(--line);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.mv-row .po img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.mv-row .mi{flex:1;min-width:0}
.mv-row .mi b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-row .mi p{font-size:11px;color:var(--tx-3);margin:3px 0 0}

/* ===== 图片灯箱预览 ===== */
.lbx{position:fixed;inset:0;background:rgba(30,32,34,.86);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:34px;animation:lbxIn .18s ease}
@keyframes lbxIn{from{opacity:0}to{opacity:1}}
.lbx img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.lbx .cls{position:absolute;top:18px;right:22px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.2s}
.lbx .cls:hover{background:rgba(255,255,255,.3)}
.lbx .cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.86);font-size:12.5px}

/* ===== 截图存档 ===== */
.shot-drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:.2s;background:var(--panel-2)}
.shot-drop:hover,.shot-drop.dragover{border-color:var(--nerv);background:var(--nerv-light)}
.shot-drop .ic{font-size:30px;margin-bottom:6px}
.shot-drop b{display:block;font-size:13px;font-weight:700;margin-bottom:3px}
.shot-drop p{font-size:11px;color:var(--tx-3)}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shot-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.2s;position:relative}
.shot-card:hover{border-color:var(--nerv);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.shot-card .th{width:100%;height:112px;background:var(--line);cursor:zoom-in;display:block;object-fit:cover}
.shot-card .mt{padding:8px 10px}
.shot-card .mt b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot-card .mt p{font-size:10px;color:var(--tx-3);margin:2px 0 0}
.shot-card .rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:6px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:.2s}
.shot-card:hover .rm{opacity:1}
.shot-list{display:flex;flex-direction:column;gap:8px}
.shot-row{display:flex;align-items:center;gap:11px;padding:9px 11px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px}
.shot-row img{width:52px;height:38px;object-fit:cover;border-radius:7px;cursor:zoom-in;flex:none}

/* ===== 护肤建议 ===== */
.sk-adv{background:linear-gradient(135deg,var(--nerv-light),var(--panel-2));border:1px solid var(--nerv-dim);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sk-adv .hd2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sk-adv .hd2 b{font-size:13.5px;font-weight:800;color:var(--nerv)}
.sk-adv ul{margin:0;padding-left:18px}
.sk-adv li{font-size:12px;line-height:1.85;color:var(--tx-2)}
.sk-step{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line)}
.sk-step:last-child{border-bottom:0}
.sk-step .no{width:22px;height:22px;border-radius:50%;background:var(--nerv);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sk-step .si{flex:1;min-width:0}
.sk-step .si b{display:block;font-size:12.5px;font-weight:700}
.sk-step .si p{font-size:10.5px;color:var(--tx-3);margin:2px 0 0}

/* ============ 11. 启动页（地球玩家 SPLASH · 锁屏风） ============ */
.splash{
  position:fixed;inset:0;z-index:99999;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,#A9E8BE 0%,#C2EFD2 34%,#B2EAD0 64%,#88D8B0 100%);
  transition:opacity .8s ease,visibility .8s ease;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash .sp-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.splash .sp-bg .particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(40,140,85,.3);animation:spFloat linear infinite}
@keyframes spFloat{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.5}100%{transform:translateY(-10vh) scale(1);opacity:0}}
/* 顶部状态栏（手机锁屏风） */
.splash .sp-bar{
  position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:18px 26px;font-family:var(--mono);font-size:15px;font-weight:700;color:rgba(255,255,255,.95);
  z-index:2;letter-spacing:.5px;text-shadow:0 1px 3px rgba(40,140,85,.25);
}
.splash .sp-bar .sp-icons{display:flex;align-items:center;gap:11px;font-size:15px}
.splash .sp-bar .sp-batt{display:inline-flex;align-items:center;gap:3px}
.splash .sp-bar .sp-batt i{width:22px;height:11px;border:1.5px solid rgba(255,255,255,.7);border-radius:3px;position:relative;display:inline-block}
.splash .sp-bar .sp-batt i::after{content:'';position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:68%;background:rgba(255,255,255,.9);border-radius:1px}
.splash .sp-bar .sp-batt i::before{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:rgba(255,255,255,.7);border-radius:0 1px 1px 0}
/* 中央内容 */
.splash .sp-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:1}
.splash .sp-time{font-size:82px;font-weight:800;font-family:var(--mono);letter-spacing:2px;line-height:1;text-shadow:0 2px 18px rgba(40,140,85,.3)}
.splash .sp-date{font-size:18px;color:rgba(255,255,255,.95);letter-spacing:2px;margin-bottom:20px;text-shadow:0 1px 3px rgba(40,140,85,.28)}
.splash .sp-earth{font-size:52px;filter:drop-shadow(0 4px 18px rgba(40,140,85,.4));animation:spIconBounce 2.4s ease-in-out infinite;margin-bottom:2px}
@keyframes spIconBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.splash .sp-title{font-size:28px;font-weight:800;letter-spacing:6px;text-shadow:0 1px 8px rgba(40,140,85,.32)}
.splash .sp-sub{font-size:13px;color:rgba(255,255,255,.88);letter-spacing:3px;text-transform:uppercase;font-family:var(--mono);margin-top:5px;text-shadow:0 1px 3px rgba(40,140,85,.25)}
.splash .sp-text{font-size:18px;line-height:2;color:rgba(255,255,255,.96);min-height:36px;letter-spacing:1px;text-align:center;margin-top:22px;text-shadow:0 1px 4px rgba(40,140,85,.3)}
.splash .sp-text .sp-jp{display:block;font-size:19px;font-weight:700;letter-spacing:.3px}
.splash .sp-text .sp-cn{display:block;font-size:14px;opacity:.92;margin-top:2px;font-style:italic}
.splash .sp-text .cursor{display:inline-block;width:2px;height:18px;background:#2E9E5B;margin-left:2px;vertical-align:text-bottom;animation:spBlink .7s step-end infinite}
@keyframes spBlink{0%,100%{opacity:1}50%{opacity:0}}
.splash .sp-enter{
  margin-top:30px;padding:12px 40px;border-radius:22px;
  background:#fff;color:#2E9E5B;border:1.5px solid #fff;
  font-size:16px;font-weight:700;letter-spacing:3px;cursor:pointer;
  transition:.3s;opacity:0;transform:translateY(12px);pointer-events:none;
}
.splash .sp-enter.ready{opacity:1;transform:translateY(0);pointer-events:auto}
.splash .sp-enter:hover{background:rgba(255,255,255,.85);transform:translateY(-2px)}
.splash .sp-enter:active{transform:scale(.97)}
.splash .sp-hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.9);letter-spacing:2px;z-index:2;text-shadow:0 1px 3px rgba(40,140,85,.25)}
@media(max-width:900px){
  .splash .sp-bar{padding:14px 18px;font-size:13px}
  .splash .sp-time{font-size:62px}
  .splash .sp-date{font-size:15px;margin-bottom:15px}
  .splash .sp-earth{font-size:44px}
  .splash .sp-title{font-size:23px;letter-spacing:4px}
  .splash .sp-text{font-size:16px}
  .splash .sp-enter{padding:10px 32px;font-size:14.5px}
}
</style>

/* ---------- 存储系统 ---------- */
const DB={
  p:'eo:',
  _mt:null,_mtT:null,
  /* 每个 key 的本地最后修改时间，用于云同步冲突判定 */
  mt(){if(!this._mt){try{this._mt=JSON.parse(localStorage.getItem('eo:_mt')||'{}')||{}}catch(e){this._mt={}}}return this._mt},
  touch(k,ts){
    this.mt()[k]=ts||Date.now();
    clearTimeout(this._mtT);
    this._mtT=setTimeout(()=>{try{localStorage.setItem('eo:_mt',JSON.stringify(this._mt))}catch(e){}},400);
  },
  get(k,def){try{const v=localStorage.getItem(this.p+k);return v==null?def:JSON.parse(v)}catch(e){return def}},
  /* 静默写入：不触发云同步（供云端拉取回填使用，避免回环） */
  setLocal(k,v){try{localStorage.setItem(this.p+k,JSON.stringify(v));return true}catch(e){toast('存储空间不足','err');return false}},
  removeLocal(k){try{localStorage.removeItem(this.p+k);return true}catch(e){return false}},
  set(k,v){
    if(!this.setLocal(k,v))return false;
    if(typeof Supabase!=='undefined'&&!Supabase.isSkip(k)){this.touch(k);Supabase.queuePush(k,v,false)}
    return true;
  },
  keys(){return Object.keys(localStorage).filter(k=>k.startsWith(this.p)).map(k=>k.slice(this.p.length)).filter(k=>k!=='_mt')},
  remove(k){
    if(!this.removeLocal(k))return false;
    if(typeof Supabase!=='undefined'&&!Supabase.isSkip(k)){this.touch(k);Supabase.queuePush(k,null,true)}
    return true;
  }
};
/* 图片存 IndexedDB */
const IDB={
  db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('eo_img',1);
    q.onupgradeneeded=e=>{e.target.result.createObjectStore('img')};
    q.onsuccess=e=>{IDB.db=e.target.result;r(true)};q.onerror=()=>r(false)}catch(e){r(false)}})},
  put(k,v){return new Promise(r=>{if(!IDB.db){DB.set('img_'+k,v);return r(true)}
    const t=IDB.db.transaction('img','readwrite');t.objectStore('img').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)})},
  get(k){return new Promise(r=>{if(!IDB.db)return r(DB.get('img_'+k,''));
    const q=IDB.db.transaction('img','readonly').objectStore('img').get(k);q.onsuccess=()=>r(q.result||'');q.onerror=()=>r('')})},
  del(k){return new Promise(r=>{if(!IDB.db){localStorage.removeItem('eo:img_'+k);return r(true)}
    const t=IDB.db.transaction('img','readwrite');t.objectStore('img').delete(k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)})},
  all(){return new Promise(r=>{if(!IDB.db)return r({});const out={};
    const c=IDB.db.transaction('img','readonly').objectStore('img').openCursor();
    c.onsuccess=e=>{const cur=e.target.result;if(cur){out[cur.key]=cur.value;cur.continue()}else r(out)};c.onerror=()=>r({})})}
};

/* ---------- Supabase 云同步（电脑 ⇄ 手机） ----------
   表结构（在 Supabase SQL Editor 执行一次）：
     create table if not exists eo_data(
       space text not null, key text not null, value jsonb,
       deleted boolean not null default false,
       updated_at timestamptz not null default now(),
       primary key(space,key));
     alter table eo_data enable row level security;
     create policy eo_all on eo_data for all to anon using(true) with check(true);
   策略：按 key 粒度 last-write-wins，比较本地 mtime 与云端 updated_at。
------------------------------------------------------ */
const SB_SQL=`create table if not exists eo_data(
  space text not null,
  key text not null,
  value jsonb,
  deleted boolean not null default false,
  updated_at timestamptz not null default now(),
  primary key(space,key)
);
alter table eo_data enable row level security;
drop policy if exists eo_all on eo_data;
create policy eo_all on eo_data for all to anon using(true) with check(true);`;

const Supabase={
  connected:false,busy:false,
  url:'',key:'',space:'',auto:true,
  lastSync:0,lastErr:'',
  SKIP:['supabase_url','supabase_key','supabase_space','supabase_auto','supabase_last','_mt'],
  isSkip(k){return this.SKIP.indexOf(k)>=0||k.indexOf('img_')===0},

  init(){
    this.url=(DB.get('supabase_url','')||'').replace(/\/+$/,'');
    this.key=DB.get('supabase_key','');
    this.space=DB.get('supabase_space','');
    this.auto=DB.get('supabase_auto',true)!==false;
    this.lastSync=DB.get('supabase_last',0)||0;
    this.updateUI();
    if(this.url&&this.key&&this.space)this.connect(true);
    // 回到前台时自动拉一次
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden&&this.connected&&this.auto)this.sync(true);
    });
    // 定时轻量同步
    setInterval(()=>{if(this.connected&&this.auto&&!document.hidden)this.sync(true)},60000);
  },
  hdr(extra){
    return Object.assign({
      'apikey':this.key,
      'Authorization':'Bearer '+this.key,
      'Content-Type':'application/json'
    },extra||{});
  },
  async connect(silent){
    if(!this.url||!this.key||!this.space){this.connected=false;this.updateUI();return false}
    try{
      const res=await fetch(this.url+'/rest/v1/eo_data?select=key&limit=1',{headers:this.hdr()});
      if(res.status===404||res.status===400){
        this.connected=false;this.lastErr='数据表不存在';this.updateUI();
        if(!silent)this.showSQL();
        return false;
      }
      if(!res.ok){
        this.connected=false;this.lastErr='HTTP '+res.status;this.updateUI();
        if(!silent)toast('连接失败：'+this.lastErr,'err');
        return false;
      }
      this.connected=true;this.lastErr='';this.updateUI();
      await this.sync(silent);
      return true;
    }catch(e){
      this.connected=false;this.lastErr='网络不可达';this.updateUI();
      if(!silent)toast('连接失败：网络不可达','err');
      return false;
    }
  },
  updateUI(){
    const el=$('#syncStatus'),txt=$('#syncText');
    if(!el||!txt)return;
    el.classList.toggle('connected',!!this.connected);
    if(this.busy)txt.textContent='同步中…';
    else if(this.connected)txt.textContent='已同步'+(this.lastSync?' '+this.hm(this.lastSync):'');
    else txt.textContent=this.url?'未连接':'本地模式';
  },
  hm(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())},

  /* ===== 推送队列（本地写入 → 云端） ===== */
  q:new Map(),qT:null,
  queuePush(k,v,del){
    if(!this.connected)return;
    this.q.set(k,{key:k,value:del?null:v,deleted:!!del,ts:DB.mt()[k]||Date.now()});
    clearTimeout(this.qT);
    this.qT=setTimeout(()=>this.flush(),1500);
  },
  async flush(){
    if(!this.connected||!this.q.size)return;
    const rows=[...this.q.values()];this.q.clear();
    await this.upsert(rows);
  },
  async upsert(rows){
    if(!rows.length)return 0;
    let ok=0;
    for(let i=0;i<rows.length;i+=40){
      const batch=rows.slice(i,i+40).map(r=>({
        space:this.space,key:r.key,value:r.deleted?null:r.value,
        deleted:!!r.deleted,updated_at:new Date(r.ts||Date.now()).toISOString()
      }));
      try{
        const res=await fetch(this.url+'/rest/v1/eo_data?on_conflict=space,key',{
          method:'POST',
          headers:this.hdr({'Prefer':'resolution=merge-duplicates,return=minimal'}),
          body:JSON.stringify(batch)
        });
        if(res.ok)ok+=batch.length;
        else this.lastErr='上传 HTTP '+res.status;
      }catch(e){this.lastErr='上传失败'}
    }
    return ok;
  },

  /* ===== 双向同步 ===== */
  async sync(silent){
    if(!this.connected||this.busy)return;
    this.busy=true;this.updateUI();
    let down=0,up=0;
    try{
      // 1. 拉取云端全量索引
      const res=await fetch(this.url+'/rest/v1/eo_data?space=eq.'+encodeURIComponent(this.space)+'&select=key,value,deleted,updated_at&limit=5000',{headers:this.hdr()});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const rows=await res.json();
      const cloud={};
      const mt=DB.mt();
      for(const r of rows){
        const cts=new Date(r.updated_at).getTime();
        cloud[r.key]=cts;
        const lts=mt[r.key]||0;
        if(cts>lts+500){                       // 云端更新 → 覆盖本地
          if(r.deleted)DB.removeLocal(r.key);
          else DB.setLocal(r.key,r.value);
          mt[r.key]=cts;down++;
        }
      }
      // 2. 本地更新的推上去
      const push=[];
      for(const k of DB.keys()){
        if(this.isSkip(k))continue;
        const lts=mt[k]||0;
        if(!lts){DB.touch(k);}                 // 老数据补时间戳
        if(!(k in cloud)||lts>(cloud[k]||0)+500)push.push({key:k,value:DB.get(k),deleted:false,ts:mt[k]||Date.now()});
      }
      up=await this.upsert(push);
      try{localStorage.setItem('eo:_mt',JSON.stringify(mt))}catch(e){}
      this.lastSync=Date.now();DB.setLocal('supabase_last',this.lastSync);
      this.lastErr='';
      if(down>0){
        if(!silent)toast('已从云端更新 '+down+' 项 ☁️');
        setTimeout(()=>{if(RENDER[App.cur])RENDER[App.cur]()},100);
      }
      if(!silent&&!down)toast('已同步（上传 '+up+' 项）☁️');
    }catch(e){
      this.lastErr=String(e.message||e);
      if(!silent)toast('同步失败：'+this.lastErr,'err');
    }
    this.busy=false;this.updateUI();
  },
  /* 用本地数据整体覆盖云端 */
  async forcePush(){
    if(!this.connected)return toast('未连接','err');
    this.busy=true;this.updateUI();
    const now=Date.now(),mt=DB.mt(),rows=[];
    for(const k of DB.keys()){
      if(this.isSkip(k))continue;
      mt[k]=now;rows.push({key:k,value:DB.get(k),deleted:false,ts:now});
    }
    try{localStorage.setItem('eo:_mt',JSON.stringify(mt))}catch(e){}
    const n=await this.upsert(rows);
    this.busy=false;this.lastSync=Date.now();this.updateUI();
    toast('已上传 '+n+' 项到云端 ⬆️');
  },
  /* 用云端数据整体覆盖本地 */
  async forcePull(){
    if(!this.connected)return toast('未连接','err');
    this.busy=true;this.updateUI();
    try{
      const res=await fetch(this.url+'/rest/v1/eo_data?space=eq.'+encodeURIComponent(this.space)+'&select=key,value,deleted,updated_at&limit=5000',{headers:this.hdr()});
      const rows=await res.json();
      const mt=DB.mt();let n=0;
      for(const r of rows){
        if(r.deleted)DB.removeLocal(r.key);else DB.setLocal(r.key,r.value);
        mt[r.key]=new Date(r.updated_at).getTime();n++;
      }
      try{localStorage.setItem('eo:_mt',JSON.stringify(mt))}catch(e){}
      toast('已下载 '+n+' 项，正在刷新 ⬇️');
      setTimeout(()=>location.reload(),800);
    }catch(e){toast('下载失败','err')}
    this.busy=false;this.updateUI();
  },

  showSQL(){
    App.modal({
      title:'还差一步：创建数据表',emo:'🗄️',noFoot:true,
      html:'<p style="margin:0 0 8px;font-size:13px;line-height:1.7">打开 Supabase 后台 → 左侧 <b>SQL Editor</b> → 新建查询 → 把下面这段粘进去 → 点 <b>Run</b>。只需做一次。</p>'+
        '<textarea class="ta" id="sbSql" readonly style="height:190px;font-family:ui-monospace,Menlo,monospace;font-size:11px">'+esc(SB_SQL)+'</textarea>'+
        '<div class="mf" style="padding:10px 0 0"><div class="btn" onclick="App.close()">关闭</div>'+
        '<div class="btn pri" onclick="Supabase.copySQL()">📋 复制 SQL</div>'+
        '<div class="btn pri" onclick="App.close();Supabase.connect()">✅ 已执行，重新连接</div></div>'
    });
  },
  copySQL(){
    const t=$('#sbSql');if(!t)return;
    t.select();
    try{navigator.clipboard?navigator.clipboard.writeText(SB_SQL):document.execCommand('copy');toast('已复制 📋')}
    catch(e){document.execCommand('copy');toast('已复制 📋')}
  },
  config(){
    App.modal({
      title:'云同步设置',emo:'☁️',
      html:'<p style="margin:0 0 10px;font-size:12px;line-height:1.7;opacity:.8">在 Supabase 后台 → <b>Project Settings → API</b> 里复制 URL 和 anon public key。<br><b>同步码</b>自己起一个（如 <code>siumamani-2026</code>），电脑和手机填<b>完全一样</b>才能互通。</p>',
      fields:[
        {k:'url',label:'Project URL',value:this.url,ph:'https://xxxxx.supabase.co'},
        {k:'key',label:'anon public key',value:this.key,ph:'eyJhbGciOi...'},
        {k:'space',label:'同步码（两台设备必须一致）',value:this.space||'',ph:'my-space-2026'}
      ],
      okText:'保存并连接',
      onOk:v=>{
        if(!v.url||!v.key||!v.space){toast('三项都要填','err');return false}
        this.url=v.url.replace(/\/+$/,'');this.key=v.key;this.space=v.space;
        DB.setLocal('supabase_url',this.url);
        DB.setLocal('supabase_key',this.key);
        DB.setLocal('supabase_space',this.space);
        toast('正在连接…');
        setTimeout(()=>this.connect(false),200);
      }
    });
  },
  toggleAuto(){
    this.auto=!this.auto;DB.setLocal('supabase_auto',this.auto);
    toast(this.auto?'已开启自动同步':'已关闭自动同步');
    this.panel();
  },
  disconnect(){
    App.confirm('断开云同步？本地数据不会丢失，云端数据也会保留。',()=>{
      this.connected=false;DB.setLocal('supabase_url','');this.url='';
      this.updateUI();toast('已断开');App.close();
    });
  },
  /* 点击侧边栏状态条弹出的控制面板 */
  panel(){
    const st=this.connected?'<span style="color:#8B9A7D">● 已连接</span>':'<span style="color:#C49494">● 未连接'+(this.lastErr?'（'+esc(this.lastErr)+'）':'')+'</span>';
    const info=this.connected
      ? '<div style="font-size:12px;line-height:1.9;opacity:.85">同步码：<b>'+esc(this.space)+'</b><br>最后同步：'+(this.lastSync?new Date(this.lastSync).toLocaleString('zh-CN'):'—')+'<br>自动同步：'+(this.auto?'开启（每分钟 + 切回页面时）':'关闭')+'</div>'
      : '<div style="font-size:12px;line-height:1.8;opacity:.85">还没连接云端。连接后，电脑和手机填相同的<b>同步码</b>即可自动互通。<br>图片不参与云同步（体积大，仍存本地）。</div>';
    const btns=this.connected
      ? '<div class="btn pri" onclick="Supabase.sync(false)">🔄 立即同步</div>'+
        '<div class="btn" onclick="Supabase.toggleAuto()">'+(this.auto?'⏸ 关闭自动':'▶️ 开启自动')+'</div>'+
        '<div class="btn" onclick="Supabase.config()">⚙️ 修改配置</div>'+
        '<div class="btn" onclick="App.confirm(\'用本机数据覆盖云端？云端同名数据会被替换。\',()=>Supabase.forcePush())">⬆️ 本机覆盖云端</div>'+
        '<div class="btn" onclick="App.confirm(\'用云端数据覆盖本机？本机同名数据会被替换。\',()=>Supabase.forcePull())">⬇️ 云端覆盖本机</div>'+
        '<div class="btn gh" onclick="Supabase.disconnect()">断开</div>'
      : '<div class="btn pri" onclick="Supabase.config()">☁️ 连接 Supabase</div>'+
        '<div class="btn" onclick="Supabase.showSQL()">🗄️ 查看建表 SQL</div>';
    App.modal({
      title:'云同步',emo:'☁️',noFoot:true,
      html:'<div style="font-size:13px;margin:0 0 8px">'+st+'</div>'+info+
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">'+btns+'</div>'
    });
  },
  toggleConnect(){this.panel()}

/* ---------- 工具函数 ---------- */
/* 轻量 jQuery 风格包装：支持 parent / find / siblings / toggleClass / addClass / removeClass / toggle */
function _jq(el){
  if(!el)return el;
  if(el._jqWrapped)return el;
  el._jqWrapped=true;
  el.toggleClass=function(c){this.classList.toggle(c);return this};
  el.addClass=function(c){this.classList.add(c);return this};
  el.removeClass=function(c){this.classList.remove(c);return this};
  el.parent=function(){return _jq(this.parentElement)};
  el.find=function(sel){return _jq(this.querySelector(sel))};
  el.toggle=function(){const d=this.style.display;this.style.display=d==='none'?'':'none';return this};
  el.siblings=function(){const arr=[...this.parentElement.children].filter(c=>c!==this);
    arr.removeClass=function(c){this.forEach(x=>x.classList.remove(c));return this};
    arr.addClass=function(c){this.forEach(x=>x.classList.add(c));return this};
    return arr};
  return el;
}
const $=s=>typeof s==='string'?(s?_jq(document.querySelector(s)):null):_jq(s);
const $$=s=>[...document.querySelectorAll(s)].map(_jq);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2])};
const WK=['日','一','二','三','四','五','六'];
const fmtCN=s=>{const d=parseD(s);return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+WK[d.getDay()]};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);

function toast(msg,type){
  const t=document.createElement('div');
  t.className='tst '+(type||'ok');
  t.textContent=msg;
  $('#toast').appendChild(t);
  setTimeout(()=>{
    t.style.opacity='0';
    t.style.transform='translateY(-8px)';
    t.style.transition='.3s';
    setTimeout(()=>t.remove(),300)
  },2200)
}

function copy(txt){
  txt=(txt==null)?'':String(txt);
  const ok=()=>toast('已复制 ✨');
  const fail=()=>toast('复制失败，请长按选择','err');
  /* 移动端兜底：离屏 textarea + setSelectionRange + execCommand（iOS/安卓兼容） */
  const legacy=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=txt;
      ta.setAttribute('readonly','');
      ta.style.position='absolute';
      ta.style.left='-9999px';
      ta.style.top='0';
      ta.style.fontSize='16px'; /* 防止 iOS 自动缩放 */
      ta.style.opacity='1';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try{ta.setSelectionRange(0,ta.value.length);}catch(e){}
      let done=false;
      try{done=document.execCommand('copy');}catch(e){done=false;}
      document.body.removeChild(ta);
      done?ok():fail();
    }catch(e){fail();}
  };
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(ok).catch(legacy);
  }else{
    legacy();
  }
}

  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;

  speechSynthesis.speak(u);
}

/* 图片灯箱预览（全局） */
function lightbox(src,cap){
  if(!src)return;
  const old=document.querySelector('.lbx');if(old)old.remove();
  const d=document.createElement('div');d.className='lbx';
  d.innerHTML='<div class="cls">✕</div><img src="'+src+'" alt="">'+(cap?'<div class="cap">'+cap+'</div>':'');
  d.onclick=e=>{if(e.target===d||e.target.className==='cls')d.remove()};
  document.body.appendChild(d);
  const onKey=e=>{if(e.key==='Escape'){d.remove();document.removeEventListener('keydown',onKey)}};
  document.addEventListener('keydown',onKey);
}

/* 语音输入 */
function startVoiceInput(inputId,callback){
  if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){
    toast('浏览器不支持语音输入','err');return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const r=new SR();
  r.continuous=false;
  r.interimResults=false;
  r.lang='zh-CN';
  r.onresult=e=>{
    const txt=e.results[0][0].transcript;
    const input=$(inputId);
    if(input){input.value=txt;input.dispatchEvent(new Event('input'))}
    if(callback)callback(txt);
  };
  r.onerror=()=>toast('语音识别失败','err');
  r.onend=()=>{};
  r.start();
}

/* ---------- 饼状图 ---------- */
function pieChart(rows,opt){
  opt=opt||{};const size=opt.size||180;
  if(!rows||!rows.length)return emptyBox('暂无数据','📊');
  const total=rows.reduce((a,b)=>a+(b.v||0),0);
  if(total===0)return emptyBox('暂无数据','📊');
  let svg='<svg class="pie-svg" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">';
  const cx=size/2,cy=size/2,r=Math.max(size/2-20,10),ir=opt.innerR||(r*0.45);
  let acc=-Math.PI/2;
  rows.forEach((row,i)=>{
    const v=row.v||0;if(v<=0)return;
    const pct=v/total;
    const sweep=pct*Math.PI*2;
    const ex=cx+r*Math.cos(acc+sweep),ey=cy+r*Math.sin(acc+sweep);
    const ix=cx+ir*Math.cos(acc+sweep),iy=cy+ir*Math.sin(acc+sweep);
    const sx=cx+r*Math.cos(acc),sy=cy+r*Math.sin(acc);
    const largeArc=sweep>Math.PI?1:0;
    const color=row.c||'var(--nerv)';
    const d='M'+cx+','+cy+' L'+sx.toFixed(2)+','+sy.toFixed(2)+
      ' A'+r+','+r+' 0 '+largeArc+',1 '+ex.toFixed(2)+','+ey.toFixed(2)+
      ' L'+ix.toFixed(2)+','+iy.toFixed(2)+
      ' A'+ir+','+ir+' 0 '+largeArc+',0 '+(cx+ir*Math.cos(acc)).toFixed(2)+','+(cy+ir*Math.sin(acc)).toFixed(2)+' Z';
    svg+='<path d="'+d+'" fill="'+color+'" stroke="var(--panel)" stroke-width="1"/>';
    const midAngle=acc+sweep/2;
    const labelR=(r+ir)/2;
    const lx=cx+labelR*Math.cos(midAngle),ly=cy+labelR*Math.sin(midAngle);
    if(pct>=0.06){
      svg+='<text class="pie-pct-label" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'">'+Math.round(pct*100)+'%</text>';
    }
    acc+=sweep;
  });
  if(opt.centerText){
    svg+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:800;fill:var(--nerv)">'+esc(opt.centerText)+'</text>';
  }
  svg+='</svg>';
  let legend='<div class="pie-legend">';
  rows.forEach(row=>{
    const v=row.v||0;if(v<=0)return;
    const pct=v/total;
    legend+='<span class="pl-item"><i class="pl-dot" style="background:'+(row.c||'var(--nerv)')+'"></i>'+
      '<span>'+esc(row.k)+'</span> <span class="pl-pct">'+Math.round(pct*100)+'%</span></span>';
  });
  legend+='</div>';
  return '<div class="pie-wrap">'+svg+legend+'</div>';
}

function barChart(rows,opt){
  opt=opt||{};const unit=opt.unit||'h', W=opt.w||14;
  const max=Math.max(...rows.map(r=>r.v),0.0001), sum=rows.reduce((a,b)=>a+b.v,0)||1;
  return '<div class="bar-txt">'+rows.map(r=>{
    const n=Math.max(r.v>0?1:0,Math.round(r.v/max*W));
    const lab=(r.k+'　　　　').slice(0,opt.lab||5);
    return '<div><span style="color:'+(r.c||'var(--nerv)')+'">'+esc(lab)+' '+'█'.repeat(n)+'<span style="color:var(--tx-3)">'+'░'.repeat(W-n)+'</span></span>'+
      ' <b style="color:var(--tx)">'+(Math.round(r.v*10)/10)+unit+'</b> <span style="color:var(--tx-3)">'+Math.round(r.v/sum*100)+'%</span></div>'}).join('')+'</div>';
}

function kpi(list){

    '<div class="kpi"><span class="emo">'+(k.emo||'✦')+'</span><div class="v">'+k.v+'</div><div class="k">'+k.k+'</div></div>'

}

function emptyBox(t,emo){
  return '<div class="empty"><span class="emo">'+(emo||'🌸')+'</span><div>'+t+'</div></div>'
}

function monthsGrid(year,hasFn,onPick,selDate){
  let h='<div class="cal" style="grid-template-columns:repeat(7,1fr)">';
  WK.forEach(w=>h+='<div class="h">'+w+'</div>');
  const d1=new Date(year,0,1),start=d1.getDay();
  for(let i=0;i<start;i++)h+='<div class="d o"></div>';
  const dys=new Date(year,12,0).getDate();
  for(let d=1;d<=dys;d++){const dt=new Date(year,0,d);const k=ymd(dt);
    const cls='d'+(hasFn(k)?' has':'')+(k===ymd(new Date())?' today':'')+(k===selDate?' sel':'');
    h+='<div class="'+cls+'" onclick="'+onPick+'(\''+k+'\')">'+d+'</div>';
  }
  return h+'</div>';
}

    {jp:"美しく最後を飾りつける暇があるなら、最後まで美しく生きようじゃねーか",cn:"有闲心给结局化妆，不如漂亮地活到最后。——银时"},
    {jp:"俺のこの剣が届くとこが、俺の国だ",cn:"我的剑能触及之处，就是我的国家。——银时"},
    {jp:"ヅラじゃない、桂だ",cn:"不是假发，是桂。"},
    {jp:"バカのくせに難しい事考えてんじゃねーよ。てめーはてめーらしく生きてりゃいいんだ",cn:"蠢货就别装深沉，活出你自己的风格就行。——土方"},
    {jp:"好きなもんを幸せにしたいだけだ",cn:"我只是想让心爱的东西得到幸福而已。——土方"},
    {jp:"汚れた手で守らなきゃいけないものがある",cn:"这世上有哪怕弄脏双手也要守护的东西。——总悟"}
  ],
  shuffled:null,mi:0,ci:0,deleting:false,_enterShown:false,
  init(){
    const el=$('#splash');if(!el)return;
    this.createParticles();
    this.tick();
    setInterval(()=>this.tick(),1000);
    this.shuffled=this.msgs.slice();
    for(let i=this.shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.shuffled[i],this.shuffled[j]]=[this.shuffled[j],this.shuffled[i]];}
    this.typeLoop();
    el.addEventListener('click',()=>this.enter(),{once:true});
  },
  tick(){
    const d=new Date();
    const t=pad(d.getHours())+':'+pad(d.getMinutes());
    const WK=['日','一','二','三','四','五','六'];
    const dt=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WK[d.getDay()];
    const c=$('#spClock'),tm=$('#spTime'),dt2=$('#spDate');
    if(c)c.textContent=t;
    if(tm)tm.textContent=t;
    if(dt2)dt2.textContent=dt;
  },
  createParticles(){
    const bg=$('#spBg');if(!bg)return;
    for(let i=0;i<24;i++){
      const p=document.createElement('div');p.className='particle';
      p.style.left=Math.random()*100+'%';
      p.style.animationDuration=(4+Math.random()*6)+'s';
      p.style.animationDelay=(Math.random()*5)+'s';
      p.style.width=p.style.height=(2+Math.random()*3)+'px';
      bg.appendChild(p);
    }
  },
  renderProgress(full,cur,isObj){
    const el=$('#spText');if(!el)return;
    const lines=full.slice(0,cur).split('\n');
    let html='';
    lines.forEach((ln,i)=>{
      const cls=isObj?(i===0?' sp-jp':' sp-cn'):'';
      html+='<span class="'+cls.trim()+'">'+esc(ln)+'</span>'+(i<lines.length-1?'<br>':'');
    });
    html+='<span class="cursor"></span>';
    el.innerHTML=html;
  },
  typeLoop(){
    const el=$('#spText');if(!el||!this.shuffled)return;
    const item=this.shuffled[this.mi];
    const isObj=typeof item!=='string';
    const full=isObj?(item.jp+'\n'+item.cn):item;
    if(!this.deleting){
      this.ci++;
      if(this.ci>=full.length){
        this.renderProgress(full,this.ci,isObj);
        if(!this._enterShown){this._enterShown=true;const e=$('#spEnter');if(e)e.classList.add('ready');}
        this.deleting=true;
        setTimeout(()=>this.typeLoop(),1700);
        return;
      }
      this.renderProgress(full,this.ci,isObj);
      setTimeout(()=>this.typeLoop(),52);
    }else{
      this.ci--;
      if(this.ci<=0){
        this.deleting=false;
        this.mi=(this.mi+1)%this.shuffled.length;
        setTimeout(()=>this.typeLoop(),350);
        return;
      }
      this.renderProgress(full,this.ci,isObj);
      setTimeout(()=>this.typeLoop(),24);
    }
  },
  enter(){
    const el=$('#splash');if(!el)return;
    el.classList.add('hide');
    setTimeout(()=>{el.remove()},900);
  }
};

/* ---------- PWA图标 ---------- */
let _iconImg=null;
function loadIconImg(){
  return new Promise(r=>{
    if(_iconImg){r(_iconImg);return}
    const img=new Image();img.crossOrigin='anonymous';
    let done=false;const fin=v=>{if(done)return;done=true;_iconImg=v;r(v)};
    img.onload=()=>fin(img);
    img.onerror=()=>fin(null);
    img.src='data:image/jpeg;base64,'+APP_ICON_B64;
    setTimeout(()=>fin(null),500);
  });
}
function makeIconUrl(size){
  return 'data:image/jpeg;base64,'+APP_ICON_B64;
}
function makeIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const img=_iconImg;
  if(img){
    x.beginPath();x.arc(size/2,size/2,size/2-1,0,Math.PI*2);x.clip();
    x.drawImage(img,0,0,size,size);
  }else{
    const g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#F0F3ED');g.addColorStop(1,'#D4D9CC');
    x.fillStyle=g;x.fillRect(0,0,size,size);
    x.fillStyle='#8B9A7D';x.font='bold '+Math.floor(size*.35)+'px sans-serif';
    x.textAlign='center';x.textBaseline='middle';x.fillText('🌍',size/2,size/2);
  }
  return c.toDataURL('image/png');
}
async function initIcons(){
  await loadIconImg();
  const av=$('#navAvatar');
  if(av){
    av.innerHTML='<img src="'+makeIconUrl(80)+'" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
  }
  try{
    const i192=makeIcon(192),i512=makeIcon(512);
    const mf={
      name:'地球Online 工作台',
      short_name:'地球Online',
      start_url:'.',
      display:'standalone',
      background_color:'#FAFAF6',
      theme_color:'#FAFAF6',
      orientation:'portrait',
      icons:[
        {src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
        {src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}
      ]
    };
    const l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
    [180,152,120].forEach(s=>{
      const t=document.createElement('link');
      t.rel='apple-touch-icon';t.sizes=s+'x'+s;t.href=makeIcon(s);
      document.head.appendChild(t)
    });
  }catch(e){}
}

function boot(){
  /* 启动页优先初始化：保证一进页面即可点击进入，不依赖图标/PWA/云同步等后续加载 */
  Splash.init();

  /* 恢复左侧功能栏折叠状态（手机/电脑通用） */
  try{ if(localStorage.getItem('eo_nav_collapsed')==='1'){const a=document.querySelector('.app');if(a)a.classList.add('nav-collapsed')} }catch(e){}

  /* 加载模块配置 */
  const config=DB.get('modules_config',null);
  if(config){
    config.forEach(mc=>{
      const m=MODULES.find(x=>x.id===mc.id);
      if(m)m.visible=mc.visible;
    });
  }

  App.renderNav();
  try{ Supabase.init(); }catch(e){}

  const last=DB.get('lastView','home');
  App.go(last);

  setInterval(App.clock,1000);App.clock();

  const tb=$('#tabbar');
  if(tb)tb.innerHTML=TABS.map(t=>{
    const m=MODULES.find(x=>x.id===t);
    return '<div class="tb'+(App.cur===t?' on':'')+'" data-id="'+t+'" onclick="App.go(\''+t+'\')">'+
      '<span class="emo">'+(m?m.emoji:'')+'</span><span>'+(m?m.name:t)+'</span></div>';
  }).join('');

  /* 图标/PWA 异步加载，失败不影响主流程（不阻塞启动页交互） */
  initIcons().catch(()=>{});
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot)
}else{
  boot()
}

  tlCatColors(){return DB.get('daily_tl_colors',{'日常':'#9CAF88','英语':'#7BA3A0','日语':'#C49494','剪辑学习':'#A89BBF','运动':'#D4AA82','读书':'#7BAFA0','漫画':'#B08A8A','目标':'#9E93BF'})},
  catColor(c){const m=this.tlCatColors();return m[c]||'#9CAF88'},
  addTLCat(){

  delTLCat(cat){

    App.confirm('删除分类「'+cat+'」？已记录在该分类下的时间段不会被删除，仅分类标签保留为「'+cat+'」。',()=>{
      const cats=this.tlCats().filter(c=>c!==cat);DB.set('daily_tl_cats',cats);
      this.renderDay();toast('已删除分类');

  editTL(id){
    const items=this.getTimeItems();const it=items.find(x=>x.id===id);if(!it)return;
    App.modal({title:'编辑时间段',emo:'⏱️',fields:[
      {k:'from',label:'开始',type:'time',value:it.from},
      {k:'to',label:'结束',type:'time',value:it.to},
      {k:'content',label:'内容',value:it.content},
      {k:'cat',label:'分类',type:'select',opts:this.tlCats(),value:it.cat}
    ],onOk:v=>{
      const dur=this.calcDur(v.from,v.to);
      const content=(v.content||'').trim()||it.content;
      let effCat=this.resolveSyncCat(v.cat, content); if(!effCat)effCat=v.cat;
      const ni={from:v.from,to:v.to,content,cat:effCat,dur,id:it.id};
      if(it.src&&it.ref){
        this.updateModuleRecordFromTL(it.src,it.ref,content,v.from,v.to);
        ni.src=it.src;ni.ref=it.ref;
      }else if(this.isSyncCat(effCat)){
        /* 编辑时把普通条目升级为同步条目（内容识别到学习类型则自动联动模块） */
        const rec=this.createModuleRecord(effCat,{content,date:this.date,mins:Math.round(dur/60),from:v.from,to:v.to});
        if(rec){ni.src=this.catToSrc(effCat);ni.ref=rec.id;}
      }
