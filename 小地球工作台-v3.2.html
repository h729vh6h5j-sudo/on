  analyzeIELTS(){
    const topicSel=$('#ieltsTopic');
    const topic=topicSel.options[topicSel.selectedIndex]?.text||'';
    const answer=$('#ieltsAnswer').value.trim();
    if(!answer.length){toast('请先输入回答','err');return}

    const words=answer.split(/\s+/).length;
    const sentences=answer.split(/[.!?]+/).filter(s=>s.trim()).length;
    const avgSentLen=sentences?Math.round(words/sentences):0;

    /* 多维度评分 */
    const connectors=[
      {kw:/\b(however|nevertheless|nonetheless)\b/gi,name:'转折'},
      {kw:/\b(moreover|furthermore|in addition|besides|also)\b/gi,name:'递进'},
      {kw:/\b(therefore|consequently|as a result|thus|so)\b/gi,name:'因果'},
      {kw:/\b(although|though|even though|while|whereas)\b/gi,name:'让步'},
      {kw:/\b(for example|for instance|such as|like)\b/gi,name:'举例'}
    ];
    const usedConnectors=connectors.filter(c=>(answer.match(c.kw)||[]).length>0);
    const connectorScore=Math.min(usedConnectors.length,3);

    const complexMarkers=/\b(which|that|who|whom|whose|where|when|while|because|since|as|if|unless|although)\b/gi;
    const complexCount=(answer.match(complexMarkers)||[]).length;
    const complexScore=complexCount>=4?2:(complexCount>=2?1:0);

    const pastTense=/\b(was|were|had|did|went|came|saw|took|made|got|found|felt|thought|said|told|knew|began|gave|came|became|spent|left|kept|brought|bought|sold|sent|built|wrote|read|ate|drank|drove|ran|spoke|swam|flew|chose|drew|grew|knew|lay|lost|meant|met|paid|put|sat|slept|spoke|stood|taught|told|won|wrote)\b/gi;
    const pastCount=(answer.match(pastTense)||[]).length;

    const fillerWords=/\b(um|uh|erm|like you know|sort of|kind of|maybe|maybe)\b/gi;
    const fillerCount=(answer.match(fillerWords)||[]).length;

    let score=4;
    if(words>=120)score+=1;
    if(words>=220)score+=1;
    if(sentences>=6)score+=1;
    if(connectorScore>=2)score+=1;
    if(complexScore>=1)score+=1;
    if(avgSentLen>=12&&avgSentLen<=22)score+=1;
    if(fillerCount<=2)score+=1;
    score=Math.min(Math.max(score,1),9);

    /* 生成具体建议 */
    const tips=[];
    if(words<120)tips.push('📏 长度偏短，尝试补充 1–2 个具体例子或感受。');
    else if(words>300)tips.push('📏 内容很丰富，注意控制语速，避免超时。');
    if(usedConnectors.length<2)tips.push('🔗 多使用连接词（however, moreover, for example）让逻辑更清晰。');
    if(complexCount<2)tips.push('🧩 尝试加入 1–2 个从句（which / because / when）提升语法复杂度。');
    if(avgSentLen<8)tips.push('✂️ 句子偏短，可尝试用从句或连接词合并句子。');
    if(avgSentLen>25)tips.push('✂️ 句子偏长，适当拆分会让表达更清楚。');
    if(fillerCount>3)tips.push('🗣 口头禅略多，练习时可有意识地停顿代替 um/uh。');
    if(pastCount<2 && /\b(memorable|experience|event|childhood|once|last|yesterday|ago)\b/i.test(answer))tips.push('⏰ 话题涉及过去经历，注意使用过去时态。');
    if(tips.length===0)tips.push('🌟 整体表现不错，继续保持流利度和自信心！');

    const records=DB.get('eng_ielts_records',[]);
    records.push({topic,answer,score,date:today()});
    DB.set('eng_ielts_records',records.slice(-20));

    $('#ieltsResult').innerHTML=
      '<div style="margin-top:14px;padding:14px;background:var(--nerv-light);border-radius:14px">'+
        '<div style="font-size:24px;font-weight:800;text-align:center;color:var(--nerv)">'+score+' / 9</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:12px">'+
          '<div>📝 字数: <b>'+words+'</b></div>'+
          '<div>💬 句子: <b>'+sentences+'</b></div>'+
          '<div>📐 均句长: <b>'+avgSentLen+'</b></div>'+
          '<div>🔗 连接词: <b>'+usedConnectors.length+'</b> 类</div>'+
          '<div>🧩 从句: <b>'+complexCount+'</b></div>'+
          '<div>🗣 填充词: <b>'+fillerCount+'</b></div>'+
        '</div>'+
        '<div style="margin-top:12px;font-size:12px;color:var(--tx-2);line-height:1.8">'+
          '<b>AI 建议：</b><br>'+tips.map(t=>'<div style="margin-top:4px">'+t+'</div>').join('')+
        '</div>'+
      '</div>';
    toast('分析完成！');
  },

  posTag(lw){
    if(ENG_POS[lw])return ENG_POS[lw];
    if(IRR_PAST[lw])return IRR_PAST[lw];
    if(/ly$/i.test(lw)&&lw.length>4)return '副词';
    if(/(tion|ment|ness|ity|ship|ance|ence|er|or|ist|dom|hood)$/i.test(lw))return '名词';
    if(/(ful|ous|ive|al|able|ible|less|ic|ish|ese|ian|an)$/i.test(lw))return '形容词';
    if(/ing$/i.test(lw))return '动词(现在分词)';
    if(/ed$/i.test(lw)&&lw.length>3)return '动词(过去式)';
    if(/s$/i.test(lw)&&!/^(ss|us|is|os|ch|sh)/i.test(lw)){
      let stem=lw.replace(/ies$/i,'y').replace(/es$/i,'');
      if(stem===lw) stem=lw.slice(0,-1);
      const pv=ENG_POS[stem];
      if(pv==='动词'||pv==='系动词'||pv==='助动词'||pv==='情态动词') return '动词(三单)';
      return '名词(复数)';
    }
    return '名词';
  },
  clauseNote(sc){
    const m={
      'because':'原因状语从句：说明动作发生的原因','although':'让步状语从句：表示"虽然……"','though':'让步状语从句',
      'if':'条件状语从句：表示"如果……"','when':'时间状语从句：表示"当……时候"','while':'时间 / 让步状语从句','where':'地点状语从句',
      'since':'原因 / 时间状语从句','unless':'条件状语从句：除非……','after':'时间状语从句','before':'时间状语从句','until':'时间状语从句','than':'比较状语从句','as':'原因 / 方式 / 时间状语从句'
    };
    return m[sc]||'状语从句';
  },

  /* 核心解析引擎 - 专业级英语句子结构分析（英语教师视角） */
  parseSentencePro(text){
    const self=this;
    const rawTokens=(text.match(/[A-Za-z']+|[.,!?;:'"()\[\]{}]/g)||[]);
    const toks=rawTokens.map(w=>({word:w,lower:w.toLowerCase(),pos:'',fn:'',color:'',note:'',inClause:false}));
    toks.forEach(t=>{ t.pos=(/^[a-z']+$/i.test(t.lower)? self.posTag(t.lower):'标点'); });
    toks.forEach(t=>{ t.fn='其他'; t.color=COL.other; });

    const isVerb=(t)=> t && t.pos!=='标点' && (t.pos==='动词'||t.pos==='系动词'||/动词/.test(t.pos));
    const isAux=(t)=> t && (t.pos==='助动词'||t.pos==='情态动词');
    const isNoun=(t)=> t && t.pos!=='标点' && (t.pos==='名词'||t.pos==='代词'||/名词/.test(t.pos)||t.pos==='限定词'||t.pos==='冠词'||t.pos==='数词');
    const isAdj=(t)=> t && t.pos!=='标点' && (t.pos==='形容词'||/形容词/.test(t.pos));
    const isPoss=(t)=> t && ['my','your','his','her','its','our','their'].includes(t.lower);

    /* 1. 从句识别（定语从句 / 状语从句） */
    const relPron=['who','whom','whose','which','that'];
    const subConj=['because','although','though','if','when','where','while','since','unless','after','before','until','than','as'];
    const clauses=[];
    for(let i=0;i<toks.length;i++){
      if(relPron.includes(toks[i].lower)){
        let v=-1; for(let j=i+1;j<toks.length;j++){ if(isVerb(toks[j])||isAux(toks[j])){v=j;break;} }
        if(v>=0){
          let end=toks.length;
          for(let k=i+1;k<toks.length;k++){ if(relPron.includes(toks[k].lower)||subConj.includes(toks[k].lower)||toks[k].pos==='标点'){end=k;break;} }
          for(let k=i;k<end;k++) toks[k].inClause=true;
          clauses.push({type:'定语从句',text:toks.slice(i,end).map(t=>t.word).join(' '),note:'由关系代词引导，修饰前面的名词'});
        }
      }
    }
    for(let i=0;i<toks.length;i++){
      if(subConj.includes(toks[i].lower)){
        let end=toks.length;
        for(let k=i+1;k<toks.length;k++){ if(subConj.includes(toks[k].lower)||relPron.includes(toks[k].lower)||toks[k].pos==='标点'){end=k;break;} }
        for(let k=i;k<end;k++) toks[k].inClause=true;
        clauses.push({type:'状语从句',text:toks.slice(i,end).map(t=>t.word).join(' '),note:self.clauseNote(toks[i].lower)});
      }
    }

    /* 2. 找谓语动词（跳过从句与助动词） */
    let mainIdx=-1;
    const verbIdxs=[];
    toks.forEach((t,i)=>{ if(isVerb(t)||isAux(t)) verbIdxs.push(i); });
    if(verbIdxs.length){
      for(const i of verbIdxs){
        if(toks[i].inClause) continue;
        const lw=toks[i].lower, next=toks[i+1];
        if(['is','are','was','were','am','be','been','being'].includes(lw) && next && /ing$/.test(next.lower) && isVerb(next)) continue;
        if(isAux(toks[i]) && next && isVerb(next)) continue;
        mainIdx=i; break;
      }
      if(mainIdx<0) mainIdx=verbIdxs[verbIdxs.length-1];
    }
    /* 3. 谓语 */
    if(mainIdx>=0){ toks[mainIdx].fn='谓语'; toks[mainIdx].color=COL.pred; }

    /* 4. 主语 */
    if(mainIdx>0){
      let subjEnd=mainIdx;
      while(subjEnd>0 && (isVerb(toks[subjEnd-1])||isAux(toks[subjEnd-1]))) subjEnd--;
      let lead=0;
      while(lead<subjEnd && toks[lead].pos==='副词') lead++;
      for(let i=0;i<lead;i++){ toks[i].fn='状语'; toks[i].color=COL.adv; }
      for(let i=lead;i<subjEnd;i++){ if(toks[i].fn==='其他' && !toks[i].inClause){ toks[i].fn='主语'; toks[i].color=COL.subj; } }
    }

    /* 5. 介词短语 */
    const phrases=[];
    for(let i=0;i<toks.length;i++){
      if(toks[i].pos==='介词'){
        const prevFn=(i>0?toks[i-1].fn:'');
        let j=i+1;
        while(j<toks.length && (isNoun(toks[j])||isAdj(toks[j])||toks[j].lower==='of'||/ing$/.test(toks[j].lower))) j++;
        const txt=toks.slice(i,j).map(t=>t.word).join(' ');
        const isAttr=(prevFn==='主语'||prevFn==='宾语'||prevFn==='表语'||prevFn==='间接宾语'||prevFn==='直接宾语');
        phrases.push({type:'介词短语',text:txt,note:isAttr?'定语（修饰前面的名词）':'状语（方式 / 地点 / 时间 / 原因）'});
        for(let k=i;k<j;k++){ toks[k].fn='介词短语'; toks[k].color=COL.prep; }
        i=j-1;
      }
    }

    /* 6. 基本句型 + 宾语 / 表语 / 补语 */
    const linkVerbs=['is','are','was','were','am','be','been','being','seem','look','sound','smell','taste','feel','become','appear','grow','turn','remain','prove'];
    const ditrans=['give','send','show','bring','teach','tell','offer','buy','make','find','leave','ask','answer','pay','read','write','save','cook','sing','lend','owe','refuse','promise','hand','pass','wish','reach'];
    const complex=['make','let','have','keep','get','find','leave','call','consider','name','think','believe','see','hear','watch','feel','paint','drive','push','force','cause','allow','help','want','need','expect','ask','tell','order','remind','prove'];
    let pattern={key:'?',name:'无法判定',formula:'—',tip:'未能识别到谓语动词，请检查句子是否完整。'};

    if(mainIdx<0){
      /* 保持默认 */
    } else if(linkVerbs.includes(vbase(toks[mainIdx].lower)) && !/ing$/.test(toks[mainIdx].lower)){
      pattern={key:'SVC',name:'主系表',formula:'主语 + 系动词 + 表语',tip:'系动词（be / 感官动词 / 表变化或状态的词）后接表语，用来说明主语的身份、状态或特征。'};
      for(let i=mainIdx+1;i<toks.length;i++){
        if(!toks[i].inClause && toks[i].pos!=='标点' && toks[i].fn!=='介词短语'){ toks[i].fn='表语'; toks[i].color=COL.comp; }
      }
    } else {
        const npEnd=(i)=>{
          let j=i;
          while(j<toks.length && (toks[j].pos==='限定词'||toks[j].pos==='冠词'||isAdj(toks[j])||isPoss(toks[j]))) j++;
          if(j<toks.length && isNoun(toks[j])) j++;
          return j;
        };
      const objs=[];
      let i=mainIdx+1;
      while(i<toks.length){
        if(toks[i].inClause){ i++; continue; }
        if(toks[i].pos==='介词'){ i++; continue; }
        if(toks[i].fn==='介词短语'){ i++; continue; }
        if(isNoun(toks[i])||isAdj(toks[i])){ const e=npEnd(i); objs.push({start:i,end:e}); i=e; continue; }
        i++;
      }
      const verb=vbase(toks[mainIdx].lower);
      if(objs.length===0){
        pattern={key:'SV',name:'主谓',formula:'主语 + 谓语',tip:'主语 + 不及物动词，后面没有直接宾语。'};
      } else if(objs.length>=2){
        if(complex.includes(verb)){
          pattern={key:'SVOC',name:'主谓宾宾补',formula:'主语 + 谓语 + 宾语 + 宾语补足语',tip:'谓语动词使宾语产生某种状态或成为某身份；宾语与宾补之间存在逻辑上的"主谓"关系。'};
          for(let k=objs[0].start;k<objs[0].end;k++){ toks[k].fn='宾语'; toks[k].color=COL.obj; }
          for(let k=objs[1].start;k<objs[1].end;k++){ toks[k].fn='宾补'; toks[k].color=COL.comp2; }
        } else {
          pattern={key:'SVOO',name:'主谓双宾',formula:'主语 + 谓语 + 间接宾语 + 直接宾语',tip:'双宾语动词后接"人（间接宾语）+ 物（直接宾语）"两个宾语。'};
          for(let k=objs[0].start;k<objs[0].end;k++){ toks[k].fn='间接宾语'; toks[k].color=COL.obj; }
          for(let k=objs[1].start;k<objs[1].end;k++){ toks[k].fn='直接宾语'; toks[k].color=COL.obj2; }
        }
      } else {
        pattern={key:'SVO',name:'主谓宾',formula:'主语 + 谓语 + 宾语',tip:'最常见的句型：主语 + 及物动词 + 宾语。'};
        for(let k=objs[0].start;k<objs[0].end;k++){ toks[k].fn='宾语'; toks[k].color=COL.obj; }
      }
    }

    /* 7. 句子结构 */
    const hasCoord=toks.some(t=>['and','but','or','so','yet'].includes(t.lower) && t.pos==='连词');
    let structure='简单句';
    if(clauses.length) structure='复合句（含 '+clauses.map(c=>c.type).join('、')+'）';
    else if(hasCoord) structure='并列句';

    /* 8. 标注 HTML */
    const taggedHtml=toks.map(t=>{
      if(t.color && t.fn && t.fn!=='其他'){
        return '<span title="'+esc(t.fn)+' · '+esc(t.pos)+'" style="background:'+t.color+'22;color:'+t.color+';padding:2px 6px;border-radius:6px;font-weight:600;margin:0 2px;display:inline-block">'+esc(t.word)+'</span>';
      }
      return '<span style="margin:0 1px">'+esc(t.word)+'</span>';
    }).join(' ');

    return {tokens:toks,structure,pattern,clauses,phrases,taggedHtml};
  },

  /* ============ 句子库（分类可自定义删减） ============ */
  renderSentences(){
    let cats=DB.get('sent_cats',['日常对话','学术写作','商务邮件','雅思高频','托福词汇']);
    let sentences=DB.get('sentences',[
      {cat:'日常对话',en:'How\'s it going?',zh:'最近怎么样？',tags:['问候']},
      {cat:'日常对话',en:'Long time no see!',zh:'好久不见！',tags:['问候']},
      {cat:'雅思高频',en:'From my perspective,...',zh:'在我看来……',tags:['观点表达']},
      {cat:'雅思高频',en:'There is no denying that...',zh:'不可否认的是……',tags:['论证']},
      {cat:'学术写作',en:'This study aims to investigate...',zh:'本研究旨在调查……',tags:['论文']},
      {cat:'商务邮件',en:'Please find attached...',zh:'请查收附件……',tags:['邮件']}
    ]);

    const curCat=$('#sentCatFilter')?.value||'';

    let fl=sentences;
    if(curCat)fl=fl.filter(s=>s.cat===curCat);

    const q=$('#sentSearch')?.value||'';
    if(q){const ql=q.toLowerCase();fl=fl.filter(s=>(s.en+s.zh+s.cat).toLowerCase().includes(ql))}

    $('#engBody').innerHTML=
      '<div class="idea-search"><input class="ipt" id="sentSearch" placeholder="🔎 搜句子..." oninput="Eng.renderSentences()"><span class="btn sm pri" onclick="Eng.renderSentences()">搜</span></div>'+
      '<div class="idea-tags">'+
        '<span class="chip'+(!curCat?' on':'')+'" onclick="$(\'#sentCatFilter\').value=\'\';Eng.renderSentences()">全部</span>'+
        cats.map(c=>'<span class="chip'+(curCat===c?' on':'')+'" onclick="$(\'#sentCatFilter\').value=\''+c+'\';Eng.renderSentences()">'+esc(c)+'</span>').join('')+
        '<span class="chip" onclick="const n=prompt(\'新分类名\');if(n){cats.push(n);DB.set(\'sent_cats\',cats);Eng.renderSentences()}">+ 分类</span>'+
      '</div>'+
      '<input type="hidden" id="sentCatFilter" value="'+esc(curCat)+'">'+
      '<div class="grid" style="gap:10px">'+
        fl.map(s=>
          '<div class="item" style="padding:12px">'+
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
              '<span class="chip" style="font-size:9px">'+esc(s.cat)+'</span>'+
              '<div>'+
                '<button class="tts-btn" onclick="speak(\''+s.en.replace(/'/g,"\\'")+'\',\'en-US\')" title="发音">🔊</button>'+
                '<button class="btn sm" style="margin-left:4px;color:#FF8A9D" onclick="Eng.delSent(\''+s.id+'\')">✕</button>'+
              '</div>'+
            '</div>'+
            '<div style="font-weight:700;color:var(--nerv);margin-bottom:4px">'+esc(s.en)+'</div>'+
            '<div style="font-size:12px;color:var(--tx-2)">'+esc(s.zh)+'</div>'+
            (s.tags?s.tags.map(t=>'<span class="pill" style="margin-right:4px">'+esc(t)+'</span>').join(''):'')+
          '</div>'
        ).join('')||
        emptyBox('还没有句子，去场景对话里收藏吧','📝')
      '</div>';

    /* 新增按钮 */
    $('#engBody').innerHTML+=
      '<div style="margin-top:14px;text-align:center">'+
        '<div class="btn pri" onclick="Eng.addSent()">➕ 新增句子</div>'+
      '</div>';
  },
  addSent(){
    const cats=DB.get('sent_cats',['默认']);
    App.modal({
      title:'新增句子',emo:'📝',
      fields:[
        {k:'en',label:'英文句子',ph:'English sentence here'},
        {k:'zh',label:'中文翻译',ph:'中文意思'},
        {k:'cat',label:'分类',type:'select',opts:cats},
        {k:'tags',label:'标签（逗号分隔）',ph:'问候,正式'}
      ],
      okText:'保存',
      onOk:v=>{
        if(!v.en)return toast('写个英文句子吧','err'),false;
        const sentences=DB.get('sentences',[]);
        sentences.unshift({id:uid(),en:v.en,zh:v.zh,cat:v.cat,tags:(v.tags||'').split(',').map(t=>t.trim()).filter(Boolean),date:today()});
        DB.set('sentences',sentences);
        this.renderSentences();
        toast('已添加 📝');
      }
    });
  },
  delSent(id){
    DB.set('sentences',DB.get('sentences',[]).filter(s=>s.id!==id));
    this.renderSentences();
  }
};

RENDER.english=()=>Eng.render();
</script>

    const l=this.logs();const x=l.find(r=>r.id===id);if(!x)return;
    const ts=x.types&&x.types.length?x.types:([x.type].filter(Boolean));

      {k:'date',label:'日期',type:'date',value:x.date},
      {k:'startT',label:'开始时间',type:'time',value:x.startT||'15:30'},
      {k:'endT',label:'结束时间',type:'time',value:x.endT||'16:30'},
      {k:'types',label:'学习板块（逗号分隔）',value:ts.join('，')},
      {k:'content',label:'内容',type:'textarea',value:x.content||''},
      {k:'note',label:'备注',value:x.note||''}
    ],onOk:v=>{
      if(!v.content||!v.content.trim())return false;
      const tarr=(v.types||'').split(/[，,]/).map(t=>t.trim()).filter(Boolean);
      if(!tarr.length)return false;
      const startT=v.startT||'';const endT=v.endT||'';

      x.date=v.date||x.date;x.startT=startT;x.endT=endT;x.min=min;

  minsBetween(s,e){

      return a+recs.reduce((s,x)=>s+(+x.min||0),0);
    },0);
    const stage=Math.min(5,1+Math.floor(total/600));
    $('#jpRoad').innerHTML=
      '<div class="mut" style="margin-bottom:12px">路线图帮你从 N5 一路走到 N2。你累计学习了 <b>'+total+'</b> 分钟，当前处于第 <b>'+stage+'</b> 阶段。</div>'+
      JP_ROAD.map((r,i)=>
      '<div class="row" style="margin-bottom:12px;align-items:flex-start">'+
      '<div style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;'+
      'background:'+(i<stage?'var(--nerv)':'var(--panel-2)')+';color:'+(i<stage?'#fff':'var(--tx-3)')+';border:1px solid var(--line);box-shadow:'+(i<stage?'0 0 0 3px var(--nerv-dim)':'none')+'">'+(i+1)+'</div>'+
      '<div style="flex:1"><div style="font-size:14px;font-weight:700'+(i<stage?'color:var(--nerv)':'')+'">'+r.s+'</div>'+
      '<div class="mut" style="font-size:12px;line-height:1.7">'+r.t+'</div></div></div>').join('')+
      '<div class="mut" style="margin-top:8px">💡 建议：每个阶段至少投入 600 分钟（约 10 小时）再进入下一阶段，基础会更扎实。</div>';
  },
  /* ---- 常用词（发音 + AI 词卡助手 + 我的词库 + 文件上传 + 背诵/测试） ---- */
  renderWordsTab(){
    $('#jpBody').innerHTML=
      '<div class="greet"><b>🎴 常用词卡片</b> · 共 '+JP_WORDS.length+' 组内置词 + 你的「我的词库」· 点击🔊发音，📤上传文件分解</div>'+
      '<div class="panel" style="margin-bottom:14px"><div class="hd"><i class="dot"></i><h3><span class="emo">📤</span>文件上传 / 分解</h3><span class="tag">UPLOAD</span></div>'+
      '<div class="bd"><div class="mut" style="margin-bottom:8px">上传文本文件（.txt），自动按行分解为词汇条目，支持背诵模式和测试模式。</div>'+
      '<div class="row">'+
        '<label class="btn sm" style="cursor:pointer">📤 选择文件<input type="file" id="jpFileUpload" accept=".txt,.csv" style="display:none" onchange="Jp.uploadFile(event)"></label>'+
        '<div class="btn sm" onclick="Jp.startMemorize()">🧠 开始背诵</div>'+
        '<div class="btn sm" onclick="Jp.startQuiz()">🎯 开始测试</div>'+
      '</div>'+
      '<div id="jpUploadResult" style="margin-top:8px"></div></div></div>'+
      '<div class="panel" style="margin-bottom:14px"><div class="hd"><i class="dot"></i><h3><span class="emo">🤖</span>AI 词卡助手</h3><span class="tag">AI</span></div>'+
      '<div class="bd"><div class="mut" style="margin-bottom:8px">想学哪类词？输入主题（如「情绪 / 职场 / 动物 / 旅行」），AI 帮你挑最相关的词卡；词库没有的，AI 会生成一份初稿放进「我的词库」供你补充。</div>'+
      '<div class="row"><input class="ipt f" id="jpAiQ" placeholder="输入你想要的词汇主题…" onkeydown="if(event.key===\'Enter\')Jp.aiAsk()">'+
      '<div class="btn pri" onclick="Jp.aiAsk()">🤖 让 AI 生成</div></div>'+
      '<div id="jpAiBox" style="margin-top:10px"></div></div></div>'+
      '<div id="jpWordGrid" class="fun-grid"></div>'+
      '<div id="jpMyWords" class="fun-grid" style="margin-top:6px"></div>';
    this.renderWords();this.renderMyWords();
  },
  renderWords(){
    $('#jpWordGrid').innerHTML=JP_WORDS.map((w,i)=>
      '<div class="fun-card" id="jpw_card_'+i+'" onclick="Jp.flipWord('+i+')">'+
      '<div class="e">🎴</div><b>'+esc(w.t)+'</b><p>点击查看 '+w.items.length+' 个词汇 · 🔊可发音</p>'+
      '<div id="jpw_'+i+'" style="display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px">'+w.items.map(it=>
        '<div class="mut" style="font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px">'+
        '<b style="min-width:60px">'+esc(it[0])+'</b> · '+esc(it[1])+
        ' <button class="tts-btn" style="padding:2px 6px;font-size:11px" onclick="event.stopPropagation();speak(\''+esc(it[0])+'\',\'ja-JP\')" title="日语发音">🔊</button>'+
        '</div>').join('')+'</div>'+
      '<div class="row" style="margin-top:8px"><div class="btn sm" onclick="event.stopPropagation();Jp.quiz('+i+')">🤖 抽测</div></div>'+
      '</div>').join('');
  },
  flipWord(i){const el=$('#jpw_'+i);if(el.style.display==='none'||el.style.display===''){el.style.display='block';}else{el.style.display='none';}},
  /* AI 词卡匹配 / 生成 */
  aiAsk(){
    const q=($('#jpAiQ').value||'').trim();
    if(!q){toast('先输入想学的主题','err');return}
    const ql=q.toLowerCase();
    let best=null,bestScore=0;
    JP_WORDS.forEach((w,i)=>{
      const idx=(w._idx)||(w._idx=(w.t+' '+w.items.map(x=>x[1]).join(' ')).toLowerCase());
      let s=0;
      if(idx.includes(ql))s+=100;            // 整串命中（最准）
      if(w.t.toLowerCase().includes(ql))s+=40; // 标题命中
      let ov=0;for(const ch of ql){if(ch.trim()&&idx.includes(ch))ov++;} // 字符弱兜底
      s+=ov;
      if(s>bestScore){bestScore=s;best={w,i};}
    });
    if(best&&bestScore>=100){
      $('#jpAiBox').innerHTML='<div class="panel" style="padding:12px"><div class="mut">🤖 AI 已为你找到最相关的词卡：</div><b style="color:var(--nerv)">'+esc(best.w.t)+'</b><div class="mut" style="margin-top:4px">共 '+best.w.items.length+' 个词汇，去下面卡片点开复习～</div></div>';
      const card=document.getElementById('jpw_card_'+best.i);
      if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.style.boxShadow='0 0 0 3px var(--nerv)';setTimeout(()=>card.style.boxShadow='',1800);}
      const mw=document.getElementById('jpMyWords');if(mw)mw.scrollIntoView({behavior:'smooth',block:'nearest'});
      return;
    }
    /* 词库没有 → 生成初稿 */
    const starter=[['これ','这个'],['それ','那个'],['あれ','那个(远)'],['です','是(礼貌)'],['ます','做(礼貌)'],['ありがとう','谢谢'],['すみません','抱歉'],['はい','是'],['いいえ','不是'],['おねがいします','拜托了']];
    const g={t:'AI·'+q+'（初稿）',items:starter,ai:true};
    const my=this.myWords();my.unshift(g);this.saveMyWords(my);
    $('#jpAiQ').value='';
    $('#jpAiBox').innerHTML='<div class="panel" style="padding:12px"><div class="mut">🤖 词库暂时没有「'+esc(q)+'」的完整词表，我已生成一份初稿（10 个通用高频词）放进「我的词库」。点开卡片可继续补充专属单词。</div></div>';
    this.renderMyWords();toast('AI 已生成初稿 🤖');
  },
  renderMyWords(){
    const box=$('#jpMyWords');if(!box)return;
    const my=this.myWords();
    box.innerHTML=my.length?
      '<div class="mut" style="grid-column:1/-1;font-weight:700;color:var(--nerv);margin:6px 0">📁 我的词库（AI 生成 / 自建，可补充）</div>'+
      my.map((w,i)=>
        '<div class="fun-card" onclick="Jp.openMyGroup('+i+')">'+
        '<div class="e">📁</div><b>'+esc(w.t)+'</b><p>'+w.items.length+' 个词汇 · 点击补充</p>'+
        '<div class="acts" style="position:static;margin-top:6px;opacity:1;justify-content:flex-start"><div class="btn sm" onclick="event.stopPropagation();Jp.delMyGroup('+i+')">🗑 删</div></div>'+
        '</div>').join('')
      :'<div class="mut" style="grid-column:1/-1;margin-top:8px">还没有「我的词库」，让 AI 生成一份试试～</div>';
  },
  openMyGroup(i){
    const w=this.myWords()[i];
    App.modal({title:'补充词卡：'+w.t,emo:'📁',fields:[
      {k:'words',label:'每行一个：假名,中文',type:'textarea',style:'min-height:120px',ph:'ka,中文\nexample,示例\nsakura,樱花'}
    ],onOk:v=>{if(!v.words)return true;
      const add=v.words.split(/\n/).map(s=>s.trim()).filter(Boolean).map(l=>{const p=l.split(/[,，]/);return [p[0]||'',p.slice(1).join(',').trim()||p[0]];}).filter(x=>x[0]);
      if(!add.length)return true;
      const my=this.myWords();my[i].items=my[i].items.concat(add);this.saveMyWords(my);this.renderMyWords();toast('已补充 '+add.length+' 词');return true;
    }});
  },
  delMyGroup(i){const my=this.myWords();my.splice(i,1);this.saveMyWords(my);this.renderMyWords();},
  /* ---- 文件上传分解 ---- */
  uploadFile(ev){
    const f=ev.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const text=r.result;
      const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      /* 尝试智能分解：支持 "假名,中文" / "假名 中文" / 纯假名行 */
      const items=lines.map(l=>{
        const m=l.match(/^([^,，\s]+)[,，\s]+(.+)$/);
        return m?[m[1],m[2]]:[l,''];
      }).filter(x=>x[0]);
      if(!items.length){toast('文件内容为空或格式无法识别','err');return}
      const g={t:'📤 '+f.name.slice(0,20),items,uploaded:true,date:today()};
      const my=this.myWords();my.unshift(g);this.saveMyWords(my);
      $('#jpUploadResult').innerHTML='<div class="mut" style="color:var(--nerv)">✅ 已导入 '+items.length+' 条词汇 →「我的词库」</div>';
      this.renderMyWords();
      toast('文件已分解为 '+items+' 条词汇 ✅');
    };
    r.readAsText(f);
    ev.target.value='';
  },
  /* ---- 背诵模式（显示日语，遮住中文） ---- */
  startMemorize(){
    const allItems=[];
    JP_WORDS.forEach(w=>w.items.forEach(it=>allItems.push({jp:it[0],zh:it[1],cat:w.t})));
    this.myWords().forEach(w=>(w.items||[]).forEach(it=>allItems.push({jp:it[0],zh:it[1],cat:w.t})));
    if(!allItems.length){toast('没有可背诵的词汇','err');return}
    /* 随机打乱 */
    for(let i=allItems.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[allItems[i],allItems[j]]=[allItems[j],allItems[i]];}
    this._memoIdx=0;this._memoItems=allItems;
    this.renderMemorize();
  },
  renderMemorize(){
    const idx=this._memoIdx||0;
    const items=this._memoItems||[];
    if(idx>=items.length){
      const ov=document.getElementById('jpMemoOverlay');
      if(ov)ov.remove();
      toast('背诵完成！🎉');return;
    }
    const it=items[idx];
    let ov=document.getElementById('jpMemoOverlay');
    if(!ov){
      ov=document.createElement('div');ov.id='jpMemoOverlay';
      ov.style.cssText='position:fixed;inset:0;background:rgba(139,154,125,.15);z-index:9999;display:grid;place-items:center;padding:18px';
      document.body.appendChild(ov);
    }
    ov.innerHTML=
      '<div class="panel" style="max-width:380px;width:100%;padding:24px;text-align:center">'+
        '<div class="mut" style="font-size:11px;letter-spacing:1px;margin-bottom:8px">🧠 背诵模式 · '+(idx+1)+' / '+items.length+'</div>'+
        '<div style="font-size:28px;font-weight:800;color:var(--nerv);margin:12px 0">'+esc(it.jp)+'</div>'+
        '<button class="tts-btn" style="margin:8px auto;padding:10px 20px;font-size:14px" onclick="speak(\''+esc(it.jp)+'\',\'ja-JP\')">🔊 发音</button>'+
        '<div id="memoZh" style="display:none;margin-top:12px;padding:12px;background:var(--panel-2);border-radius:12px;font-size:16px;color:var(--tx)">'+esc(it.zh)+'</div>'+
        '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center">'+
          '<div class="btn" onclick="document.getElementById(\'memoZh\').style.display=\'block\'">👁 显示中文</div>'+
          '<div class="btn pri" onclick="Jp.memoNext()">下一个 →</div>'+
          '<div class="btn sm" onclick="document.getElementById(\'jpMemoOverlay\').remove()">退出</div>'+
        '</div></div>';
  },
  memoNext(){this._memoIdx=(this._memoIdx||0)+1;this.renderMemorize();},
  /* ---- 测试模式（看中文猜日语） ---- */
  startQuiz(){
    const allItems=[];
    JP_WORDS.forEach(w=>w.items.forEach(it=>allItems.push({jp:it[0],zh:it[1],cat:w.t})));
    this.myWords().forEach(w=>(w.items||[]).forEach(it=>allItems.push({jp:it[0],zh:it[1],cat:w.t})));
    if(!allItems.length){toast('没有可测试的词汇','err');return}
    for(let i=allItems.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[allItems[i],allItems[j]]=[allItems[j],allItems[i]];}
    this._quizIdx=0;this._quizItems=allItems.slice(0,Math.min(20,allItems.length));
    this._quizScore=0;
    this.renderQuiz();
  },
  renderQuiz(){
    const idx=this._quizIdx||0;
    const items=this._quizItems||[];
    if(idx>=items.length){
      const ov=document.getElementById('jpQuizOverlay');
      if(ov){
        ov.innerHTML='<div class="panel" style="max-width:380px;width:100%;padding:24px;text-align:center">'+
          '<h3 style="margin:0 0 8px">🎯 测试完成！</h3>'+
          '<div style="font-size:48px;font-weight:800;color:var(--nerv)">'+this._quizScore+' / '+items.length+'</div>'+
          '<p class="mut" style="margin:8px 0">'+(this._quizScore>=items.length*0.8?'优秀！':'继续加油！')+'</p>'+
          '<div class="btn pri" style="width:100%;justify-content:center" onclick="document.getElementById(\'jpQuizOverlay\').remove()">关闭</div></div>';
      }
      return;
    }
    const it=items[idx];
    let ov=document.getElementById('jpQuizOverlay');
    if(!ov){
      ov=document.createElement('div');ov.id='jpQuizOverlay';
      ov.style.cssText='position:fixed;inset:0;background:rgba(139,154,125,.15);z-index:9999;display:grid;place-items:center;padding:18px';
      document.body.appendChild(ov);
    }
    ov.innerHTML=
      '<div class="panel" style="max-width:380px;width:100%;padding:24px;text-align:center">'+
        '<div class="mut" style="font-size:11px;letter-spacing:1px;margin-bottom:8px">🎯 测试模式 · '+(idx+1)+' / '+items.length+' · 得分:'+this._quizScore+'</div>'+
        '<div style="font-size:14px;color:var(--tx-2);margin-bottom:6px">这个用日语怎么说？</div>'+
        '<div style="font-size:24px;font-weight:800;color:var(--nerv);margin:12px 0">'+esc(it.zh)+'</div>'+
        '<input class="ipt f" id="quizInput" placeholder="输入日语读音..." style="text-align:center;font-size:18px" onkeydown="if(event.key===\'Enter\')Jp.quizCheck()">'+
        '<div id="quizFeedback" style="margin-top:10px"></div>'+
        '<div style="margin-top:14px;display:flex;gap:8px;justify-content:center">'+
          '<div class="btn" onclick="Jp.quizSkip()">跳过</div>'+
          '<div class="btn pri" onclick="Jp.quizCheck()">提交答案</div>'+
          '<div class="btn sm" onclick="document.getElementById(\'jpQuizOverlay\').remove()">退出</div>'+
        '</div></div>';
    setTimeout(()=>{const el=document.getElementById('quizInput');if(el)el.focus();},100);
  },
  quizCheck(){
    const it=(this._quizItems||[])[this._quizIdx||0];
    if(!it)return;
    const ans=($('#quizInput')?.value||'').trim().toLowerCase();
    const correct=it.jp.toLowerCase();
    const fb=$('#quizFeedback');
    if(!ans){fb.innerHTML='<span style="color:#FF8A9D">请先填写答案</span>';return}
    /* 模糊匹配：完全正确或去掉空格后一致 */
    const isCorrect=ans===correct||ans.replace(/\s/g,'')===correct.replace(/\s/g,'');
    if(isCorrect){
      this._quizScore++;
      fb.innerHTML='<span style="color:#4CAF50;font-weight:700">✅ 正确！'+esc(it.jp)+'</span>';
    }else{
      fb.innerHTML='<span style="color:#FF8A9D;font-weight:700">❌ 正确答案：'+esc(it.jp)+'</span>';
    }
    setTimeout(()=>{this._quizIdx++;this.renderQuiz();},1200);
  },
  quizSkip(){this._quizIdx++;this.renderQuiz();},
  /* AI 闪卡抽测 */
  quiz(i){
    const w=JP_WORDS[i];
    let items=w.items.slice();
    for(let k=items.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[items[k],items[j]]=[items[j],items[k]];}
    items=items.slice(0,Math.min(8,items.length));
    const ov=document.createElement('div');ov.id='jpQuizOverlay';
    ov.style.cssText='position:fixed;inset:0;background:rgba(20,12,30,.62);z-index:9999;display:grid;place-items:center;padding:18px';
    const panel=document.createElement('div');panel.className='panel';panel.style.cssText='max-width:340px;width:100%;padding:22px';
    ov.appendChild(panel);
    let cur=0;
    const draw=()=>{
      if(cur>=items.length){
        panel.innerHTML='<div style="text-align:center"><h3 style="margin:0 0 8px">🤖 抽测完成！</h3><p class="mut" style="margin:0 0 14px">'+esc(w.t)+' · 共 '+items.length+' 词</p><div class="btn pri" style="width:100%;justify-content:center" onclick="Jp.quizClose()">关闭</div></div>';
        return;
      }
      const it=items[cur];
      panel.innerHTML='<div class="mut" style="font-size:11px;letter-spacing:1px">AI 智能抽测 · '+(cur+1)+' / '+items.length+'</div>'+
        '<div style="font-size:24px;font-weight:800;margin:10px 0 4px">'+esc(it[1])+'</div>'+
        '<div id="qaBox" class="mut" style="margin-bottom:14px;min-height:20px">— 点击「显示」看日语读音 —</div>'+
        '<div class="row"><div class="btn" onclick="document.getElementById(\'qaBox\').textContent=\''+esc(it[0]).replace(/'/g,"\\'")+'\'">显示读音</div>'+
        '<div class="btn pri" onclick="Jp.quizNext()">答对了，下一个 →</div></div>';
    };
    ov.onclick=e=>{if(e.target===ov)Jp.quizClose()};
    Jp.quizClose=()=>{const o=document.getElementById('jpQuizOverlay');if(o)o.remove();};
    Jp.quizNext=()=>{cur++;draw();};
    document.body.appendChild(ov);draw();
  }
};
RENDER.japanese=()=>Jp.render();
</script>

<script>
/* ==================================================================

   links:[['B站·剪辑入门30分钟','https://search.bilibili.com/all?keyword=剪映入门'],['Premiere 基础教程','https://search.bilibili.com/all?keyword=PR教程'],['达芬奇调色入门','https://search.bilibili.com/all?keyword=达芬奇入门']],
   insp:[['影视飓风','专业设备与思路，涨见识'],['老蒋巨靠谱','接地气的剪辑技巧'],['拉小登','叙事节奏讲解清晰']],three:['装好软件，导入一段素材','剪出 15 秒成片','导出看效果']},

      {emo:'🏋️',v:r.length,k:'训练次数'},{emo:'⏱️',v:mins,k:'总分钟'},{emo:'🔥',v:this.streak(),k:'连续天数'},{emo:'📅',v:wm,k:'本周分钟'}
    ]);
  },
  weekKeys(){const ks=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-d.getDay()+i);ks.push(ymd(d))}return ks},
  streak(){let s=0;for(let i=0;i<400;i++){const dt=new Date();dt.setDate(dt.getDate()-i);const k=ymd(dt);if(this.recs().some(x=>x.date===k))s++;else if(i>0)break}return s},
  add(){
    const date=$('#spDate').value||today();const parts=this.selectedParts();
    const startT=$('#spStart')?.value||'';const endT=$('#spEnd')?.value||'';
    const min=this.minsBetween(startT,endT);const lv=$('#spLv').value;
    const blogger=$('#spBlogger').value;const note=$('#spNote').value.trim();
    if(!parts.length){toast('至少选一个部位','err');return}
    if(!min){toast('选择开始和结束时间','err');return}
    const files=this._files||[];
    const imgs=[];
    const save=()=>{const r=this.recs();r.push({id:uid(),date,parts,min,startT,endT,lv,blogger,note,imgs});this._files=[];this._imgs=[];this.save(r);
      if(typeof Daily!=='undefined')Daily.notifySync('运动');
      $('#spStart').value='18:00';$('#spEnd').value='19:00';$('#spNote').value='';$('#spBlogger').value='';$('#spImg').value='';$('#spImgPrev').innerHTML='';
      this.kpi();this.renderList();this.renderChart();this.renderHeat();toast('练了一波 💪');};
    if(files.length>0){
      let done=0;
      files.forEach(f=>{
        const id=uid();
        imgs.push('sp_'+id);
        IDB.put('sp_'+id,f).then(()=>{done++;if(done===files.length)save();});
      });
    }else{save();}
  },
  renderList(){const r=this.recs().slice().reverse();$('#spTotal').textContent='共 '+r.length+' 次';
    $('#spList').innerHTML=r.length?r.map(x=>{
      const bg=this.bloggers().find(b=>b.id===x.blogger);
      return '<div class="item"><div class="acts"><div class="btn sm" onclick="Sport.edit(\''+x.id+'\')">编辑</div><div class="btn sm" onclick="Sport.del(\''+x.id+'\')">删</div></div>'+
      '<h4><span class="pill" style="background:var(--nerv-dim);color:var(--nerv)">'+esc(x.parts.join(' · '))+'</span> <span class="mut">'+(x.startT&&x.endT?'🕐 '+x.startT+'–'+x.endT+' · ':'')+x.date+' · '+x.min+'分 · '+x.lv+'</span></h4>'+
      (x.imgs&&x.imgs.length?'<div id="spimg_'+x.id+'" style="margin:6px 0;display:flex;flex-wrap:wrap;gap:4px"></div>':'')+
      (bg?'<p>'+bg.emoji+' 跟练：'+esc(bg.name)+'</p>':'')+
      (x.note?'<p class="mut">'+esc(x.note)+'</p>':'')+'</div>';
    }).join(''):emptyBox('还没有训练记录，选个部位开练吧','🏋️');
    r.forEach(x=>{if(x.imgs&&x.imgs.length){const el=$('#spimg_'+x.id);if(el){let h='';x.imgs.forEach(imgId=>{IDB.get(imgId).then(d=>{if(d)h+='<a href="'+d+'" target="_blank" rel="noopener"><img src="'+d+'" style="max-width:100px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer"></a>';if(h&&el)el.innerHTML=h;});});}}});
  },
  renderChart(){const r=this.recs();const ym=today().slice(0,7);
    const by={};r.filter(x=>x.date.slice(0,7)===ym).forEach(x=>{x.parts.forEach(p=>by[p]=(by[p]||0)+(+x.min||0))});
    const rows=Object.keys(by).map(k=>({k,v:by[k],c:'var(--nerv)'}));
    $('#spChart').innerHTML=rows.length?pieChart(rows,{centerText:'分钟'})+'<div class="mut" style="margin-top:6px">'+ym+' 各部位训练分钟数</div>':emptyBox('本月还没有训练','📊');
  },
  renderHeat(){const r=this.recs();const map={};r.forEach(x=>map[x.date]=(map[x.date]||0)+(+x.min||0));
    let h='<div class="heat" style="grid-template-columns:repeat(7,1fr)">';
    for(let i=34;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const k=ymd(dt);const m=map[k]||0;const lv=m===0?0:m<30?1:m<60?2:3;
      h+='<div class="x lv'+lv+(k===today()?' today':'')+'" title="'+k+' · '+m+'分"></div>';}
    h+='</div>';$('#spHeat').innerHTML=h+'<div class="mut" style="margin-top:8px">深=练得久。最近 5 周。</div>';
  },
  del(id){App.confirm('删除这条训练记录？',()=>{const x=this.recs().find(y=>y.id===id);if(x){if(x.img)IDB.del(x.img);if(x.imgs&&x.imgs.length)x.imgs.forEach(i=>IDB.del(i));}DB.set('spRecs',this.recs().filter(y=>y.id!==id));this.render();toast('已删除');});},
  edit(id){
    const r=this.recs();const x=r.find(y=>y.id===id);if(!x)return;
    App.modal({title:'编辑训练记录',emo:'🏋️',fields:[
      {k:'date',label:'日期',type:'date',value:x.date},
      {k:'startT',label:'开始时间',type:'time',value:x.startT||'18:00'},
      {k:'endT',label:'结束时间',type:'time',value:x.endT||'19:00'},
      {k:'lv',label:'强度',type:'select',opts:['轻松','适中','力竭'],value:x.lv||'适中'},
      {k:'parts',label:'部位（逗号分隔）',value:(x.parts||[]).join('，')},
      {k:'blogger',label:'跟练博主',value:x.blogger||''},
      {k:'note',label:'备注',value:x.note||''}
    ],onOk:v=>{
      const parts=(v.parts||'').split(/[，,]/).map(s=>s.trim()).filter(Boolean);
      if(!parts.length)return false;
      const startT=v.startT||'';const endT=v.endT||'';
      const min=this.minsBetween(startT,endT)||(+x.min||0);
      x.date=v.date||x.date;x.startT=startT;x.endT=endT;x.min=min;x.lv=v.lv||x.lv;
      x.parts=parts;x.blogger=v.blogger||'';x.note=v.note||'';
      this.save(r);this.kpi();this.renderList();this.renderChart();this.renderHeat();toast('已保存');
    }});
  },
  minsBetween(s,e){
    if(!s||!e)return 0;
    const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
    let d=(eh*60+em)-(sh*60+sm);if(d<0)d+=1440;return d;
  },
  /* ---- 选部位 ---- */
  renderParts(){
    $('#spBody').innerHTML=
      '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">💪</span>管理训练部位</h3><span class="tag">PARTS</span><div class="sp"></div><div class="btn sm pri" onclick="Sport.addPart()">+ 添加</div></div>'+
      '<div class="bd"><div class="msel">'+this.parts().map(p=>'<span class="m on">'+p+' <span style="cursor:pointer" onclick="Sport.rmPart(\''+p.replace(/'/g,"\\'")+'\')">✕</span></span>').join('')+'</div></div></div>';
  },
  addPart(){const n=prompt('新部位名称');if(n&&n.trim()){const p=this.parts();p.push(n.trim());DB.set('spParts',p);this.renderParts();}},
  rmPart(p){DB.set('spParts',this.parts().filter(x=>x!==p));this.renderParts();},
  /* ---- 周计划 ---- */
  renderWeek(){
    const w=this.week();const days=['周一','周二','周三','周四','周五','周六','周日'];
    $('#spBody').innerHTML=
      '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">📅</span>本周训练计划</h3><span class="tag">WEEKLY</span><div class="sp"></div><div class="btn sm" onclick="Sport.clearWeek()">清空</div></div>'+
      '<div class="bd">'+days.map((d,i)=>'<div class="item" style="margin-bottom:8px"><div class="acts"><div class="btn sm" onclick="Sport.editWeek('+i+')">编辑</div></div>'+
        '<h4>'+d+'</h4><p>'+(w[i]&&w[i].parts?esc(w[i].parts.join(' · ')):'休息日')+'</p>'+(w[i]&&w[i].note?'<p class="mut">'+esc(w[i].note)+'</p>':'')+'</div>').join('')+'</div></div>';
  },
  editWeek(i){
    const w=this.week();const cur=w[i]||{parts:[],note:''};
    App.modal({title:'编辑 '+['周一','周二','周三','周四','周五','周六','周日'][i]+' 计划',emo:'📅',fields:[
      {k:'parts',label:'部位（逗号分隔）',value:cur.parts?cur.parts.join('，'):''},
      {k:'note',label:'备注',value:cur.note}
    ],onOk:v=>{const parts=(v.parts||'').split(/[，,]/).map(s=>s.trim()).filter(Boolean);w[i]={parts,note:v.note};DB.set('spWeek',w);this.renderWeek();}});
  },
  clearWeek(){DB.set('spWeek',{});this.renderWeek();},
  /* ---- 博主 ---- */
  renderBloggers(){
    $('#spBody').innerHTML=
      '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">⭐</span>明星跟练博主</h3><span class="tag">BLOGGERS</span><div class="sp"></div><div class="btn sm pri" onclick="Sport.addBlogger()">+ 添加</div></div>'+
      '<div class="bd"><div class="blogger-grid">'+this.bloggers().map(b=>
      '<div class="blogger" onclick="Sport.bloggerLog(\''+b.id+'\')">'+
      '<div class="del" onclick="event.stopPropagation();Sport.rmBlogger(\''+b.id+'\')">✕</div>'+
      '<div class="av">'+b.emoji+'</div><div class="nm">'+esc(b.name)+'</div></div>').join('')+
      '<div class="blogger blogger-add" onclick="Sport.addBlogger()"><div class="av">+</div><div class="nm">添加</div></div></div></div></div>';
  },
  addBlogger(){App.modal({title:'添加博主',emo:'⭐',fields:[{k:'name',label:'博主名'},{k:'emoji',label:'emoji',value:'🌟'}],

  rmBlogger(id){const b=this.bloggers();const x=b.find(y=>y.id===id);if(!x)return;

  bloggerLog(bid){
    const b=this.bloggers().find(x=>x.id===bid);if(!b)return;
    const recs=this.recs().filter(x=>x.blogger===bid).slice().reverse();
    App.modal({title:b.name+' 的跟练记录',emo:b.emoji,noFoot:true,html:
      '<div>'+(recs.length?recs.map(x=>'<div class="mut" style="padding:6px 0;border-bottom:1px solid var(--line)">'+x.date+' · '+x.parts.join(' · ')+' · '+x.min+'分</div>').join(''):'还没有跟练记录')+'</div>'});
  },
  /* ---- AI教练 ---- */
  renderAI(){
    $('#spBody').innerHTML=
      '<div class="panel accent"><div class="hd"><i class="dot"></i><h3><span class="emo">🤖</span>AI 教练</h3><span class="tag">COACH</span></div>'+
      '<div class="bd"><div class="mut" style="margin-bottom:10px">告诉我今天想练什么、有多少时间，AI 给你安排。</div>'+
      '<div class="row" style="margin-bottom:10px"><div style="flex:1"><label class="lbl">今天想练</label><input class="ipt" id="aiParts" placeholder="肩背、腹部、有氧"></div>'+
      '<div style="width:110px"><label class="lbl">时长(分)</label><input type="number" class="ipt" id="aiMin" value="30"></div></div>'+
      '<div class="row"><div class="sp"></div><div class="btn pri" onclick="Sport.aiPlan()">生成计划</div></div>'+
      '<div id="aiResult" style="margin-top:14px"></div></div></div>';
  },
  aiPlan(){
    const parts=$('#aiParts').value.trim()||'全身';const min=+$('#aiMin').value||30;
    const recs=this.recs();const last=recs.slice().reverse().find(x=>x.parts.some(p=>parts.includes(p)));
    let suggest='';
    if(min<=15)suggest='时间紧张，建议做一组 HIIT 或局部塑形，激活身体即可。';
    else if(min<=40)suggest='适合跟练 1-2 个博主视频，先热身 5 分钟，再进入主训练。';
    else suggest='时间充裕，可以做组合训练：有氧+无氧+拉伸，每个部位都照顾到。';
    const lines=[
      '今日计划：'+parts+'，约 '+min+' 分钟',
      '💡 建议：'+suggest,
      '🔥 热身：5 分钟关节活动',
      '💪 主训练：'+parts+' 针对性动作 '+Math.max(10,min-10)+' 分钟',
      '🧘 拉伸：5 分钟静态拉伸'
    ];
    if(last)lines.push('📌 你上一次练 '+last.parts.join('、')+' 是在 '+last.date+'，今天可以换部位或加重量。');
    $('#aiResult').innerHTML='<div style="border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2)">'+lines.map(l=>'<div style="font-size:12.5px;line-height:1.9">'+esc(l)+'</div>').join('')+'</div>';
  }
};
RENDER.sport=()=>Sport.render();
</script>

/* 每日精选·全文素材（自包含多段正文，点开卡片弹窗看全文）
   说明：静态单文件网页没有后端，无法在运行时去外部网站爬取，这里由助手预先整理成可读长文写进文件；
   带 u 的真实要闻仍保留外链，点标题跳转原文。 */
const MT_ARTICLES=[
  {t:'高校辅导员"陪伴式成长"工作法',cat:'辅导员队伍建设',src:'高校思政网',body:`辅导员的威信从来不来自职位，而来自"在场"。当学生遇到困惑，第一个想到的不是制度流程，而是那个愿意听他说话的人。\n\n所谓陪伴式成长，不是时刻盯着学生，而是建立稳定的可预期感：每周固定时间开放谈心、在班级群里温度地出现、关键时刻站得出。当学生确信"有事能找到你"，很多危机就在萌芽期被接住了。\n\n具体做法上，可以把学生动态浏览写进每日固定动作：看一眼出勤、翻一下班级群、留意朋友圈异常。这种轻量在场，比期末突击谈心更有效。\n\n最后要提醒的是，陪伴不是越界。保持专业边界、及时转介心理危机、记录关键谈话，才能让陪伴既有温度又有尺度。`},
  {t:'"一站式"学生社区：把服务沉到宿舍楼下',cat:'日常管理·一站式社区',src:'教育部',body:`"一站式"学生社区的核心，是让学生的需求在"生活现场"被解决，而不是在行政楼之间被转圈。教育部近年多次强调，要把思想政治工作、学业指导、心理疏导、就业服务前移到学生身边。\n\n空间上的一站式，只是第一步。更重要的是流程上的一次办结：学生报修、请假、咨询、预约，最好在一个窗口、一个系统里完成。辅导员下沉社区、学业导师驻点、心理与就业服务轮值，都是为了让"跑一趟"变成"就地解决"。\n\n落地关键在"人"而不在"墙"。再漂亮的社区中心，如果没有老师定期在场、没有明确的响应机制，也只是空壳。建议制定社区值班表、问题流转单和限时反馈制度，先让服务真正沉下来，再谈文化建设。\n\n从实践看，成效明显的社区往往有三个共同点：学生在社区里能办成事、能找得到人、能感受到被关心。把这三件事做实，一站式社区才真正有生命力。`},
  {t:'大思政课怎样讲进学生心里',cat:'学生思政·大思政课',src:'中国教育报',body:`大思政课之"大"，不在课时长，而在把道理接上学生的生活地气。学生不缺大词，缺的是"这和我有啥关系"。\n\n要把思政课讲进心里，第一步是换话语体系。少念文件腔，多用学生熟悉的网络语言和身边案例。把家国叙事连接到他的专业、就业与成长困惑，理想才落地；用一堂班会讨论一个社会热点，比照本宣科更入心。\n\n第二步是换场景。最好的思政教育常常发生在具体场景里：一次志愿服务后的复盘、一场危机后的公共讨论、一次企业参观后的交流。把课堂延伸到生活，课才真正上完。\n\n第三步是换主体。让学生从"听众"变成"主讲人"，从"被教育者"变成"价值共创者"。当学生自己讲清楚"我为什么信"，思政教育才算真正发生。`},
  {t:'从"无手机课堂"到主动专注：学风建设新路径',cat:'学风建设',src:'学工观察',body:`"无手机课堂"常被误解为管纪律，其实它管的是注意力。在信息碎片化的环境里，深度专注已经成为一种需要练习的能力。\n\n当手机被请出课堂，学生才有机会体验到"沉浸两小时"的甜头。这种正向体验，比任何通报批评都更能驱动自发学习。但制度只是第一步，配套要做的是让课堂本身值得专注：增加互动设计、提供即时反馈、展示可见的成长曲线。\n\n学风建设不能只有约束，更要有吸引力。比如组织学霸笔记共享、建立学习小组、公开表彰进步者，用同伴示范带动整体氛围。正向反馈是最便宜的驱动力。\n\n当然，也要避免一刀切。部分课程需要手机查资料、做问卷，完全禁用并不现实。关键是和学生共同约定使用规则，让"专注"从被要求变成自主选择。`},
  {t:'辅导员谈心谈话：先听三分钟',cat:'谈心谈话',src:'辅导员实务',body:`带着结论去谈话，往往谈不下去。学生带着情绪来，先给空间把话说完，倾听本身就是疗愈。\n\n开场很重要。"你最近怎么样"比"你又迟到了"更管用。以关心开场能建立安全感，学生才愿意说真话。谈话过程中少讲"你应该"，多问"你怎么想"，把判断换成好奇。\n\n识别信号比给答案更重要。学生说"活着没意思""最近总睡不着""不想见人"，这些都不是矫情，而是需要被认真对待的信号。发现异常不急着给结论，先陪伴，再转介。\n\n谈话结束前，留一句"随时可以来找我"，比任何承诺都实在。可预期的被支持感，是信任的起点。把一次谈话变成长期关系，辅导工作才算做到位。`},
  {t:'心理危机识别的六个信号与守门人机制',cat:'心理健康',src:'高校心理中心',body:`心理危机很少突然降临，多数有迹可循。高校心理中心总结出的六个常见信号包括：睡眠骤变、社交退缩、成绩断崖式下滑、言语消极、突然赠送贵重物品、情绪反常平静。出现多项时务必重视。\n\n宿舍长、班长、室友是离信号最近的人。训练这些同伴成为"守门人"，往往比老师更早发现问题。守门人不是咨询师，他们的任务是观察、陪伴和及时上报，而不是自己解决所有问题。\n\n发现异常后，第一步是稳定现场，不评判、不质问；第二步是联系学校心理中心或辅导员；第三步是做好记录和后续关注。\n\n危机平息不是终点。两周、一个月的回访，才是真正的安全网。把"关注"做成机制，而非一时热情，才能让学生在低谷时被接住。`},
  {t:'就业指导：简历要写的是价值，不是经历',cat:'职业规划',src:'就业指导',body:`很多学生把简历写成"我干了啥"的流水账，但用人单位真正想看的是"你能解决什么问题"。简历的本质，是一份价值说明书。\n\n表达上要用"动作+结果"。不是"负责公众号运营"，而是"独立运营公众号6个月，粉丝增长3000人，平均阅读提升两倍"。价值先于职责，数字优于形容词。\n\n内容上要匹配岗位。同一段实习经历，应聘运营岗和应聘产品岗，应该突出不同的能力点。教学生根据岗位描述调整简历重点，是就业指导的核心技能之一。\n\n面对慢就业的学生，催促往往无效。更有效的是帮他梳理空窗期的成长：学了什么技能、做了什么项目、有哪些可迁移能力。给焦虑一点缓冲，同时把缓冲变成有计划的成长，比单纯催投递更治本。`},
  {t:'班级管理：让学生自己定班规，执行成本最低',cat:'班级管理',src:'班级管理',body:`参与制定的规则，学生更愿意遵守。把"要我守"变成"我要守"，管理就从对抗走向共建。开学第一次班会，最该做的一件事就是和学生共同商定班规。\n\n班规内容不必多，重点明确即可：课堂纪律、请假流程、班级群规则、考试诚信、宿舍相处。每一条都让学生发言、讨论、表决，最终形成书面公约。这个过程本身就是一次生动的公民教育。\n\n班委换届也是关键节点。交权也要交方法，新手班委最缺的是流程和授权。一份交接清单加一个月陪跑，比直接换人更稳。\n\n日常管理中，规则前置能大幅减少纠纷。班级群规则开学就要立：不发负能量、不刷屏、重要通知要@。当班级自己能转起来，辅导员才能把精力投入到真正需要个别关注的学生身上。`},
  {t:'主题班会设计：开场30秒如何抓住学生',cat:'主题班会',src:'班会设计',body:`班会一开场就决定了学生接下来的参与状态。用真实故事或冲突开场，比"今天讲三件事"更能抓住注意力。开场的前30秒，往往决定整场班会的温度。\n\n好的开场通常具备三个特点：具体、相关、有情绪。具体是指用一个真实案例或场景，而不是抽象概念；相关是指这个话题和学生当下生活有关；有情绪是指能引发共鸣，而不是平淡说教。\n\n班会形式也可以多样化。把班会交给学生主持一次，轮换中每个人都能成为主角；反诈班会要"演"不要"念"，模拟一次诈骗电话，记忆深度远超读PPT；心理主题班会可以用情景剧呈现，让学生在角色中体验。\n\n活动不在多，在被记住。一年做透两三件有仪式感的事，胜过十场走过场的会。一次成功的班会，会在学生心里留下一个锚点，多年后他们也许还记得。`}
];

const MT_FEED=MT_ARTICLES.concat(MAT_NEWS_SEED);
/* 日期种子随机：同一天结果稳定，不同天结果不同 */
function mtSeedRand(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function mtDailySeed(dateStr){const r=mtSeedRand(dateStr);const pool=MT_FEED.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}let n=6+Math.floor(r()*5);if(n>pool.length)n=pool.length;return pool.slice(0,n)}

  {name:'麦可思研究',icon:'📊',desc:'高教数据智库 · 辅导员/学风',links:[{t:'麦可思官网',u:'http://www.mycos.com.cn/'},{t:'麦可思研究文章合集',u:'https://www.163.com/dy/media/KEU0HBQN05218435.html'}]}
];
const Mat={
  tab:'news', cat:'',
  lib(){return DB.get('mtLib',[])},
  news(){let n=DB.get('mtNews',null);if(!n){n=[];DB.set('mtNews',n)}return n},
  check(){return DB.get('mtCheck',{})},
  topics(){return DB.get('mtTopicPool',MAT_TOPICS.slice())},
  render(){
    subnav('#mtSubnav',[['news','📰','每日精选'],['lib','✨','素材库'],['media','🔥','官媒直通车']],this.tab,'Mat.tabTo');
    if(this.tab==='news')this.renderNews();
    if(this.tab==='lib')this.renderLib();
    if(this.tab==='media')this.renderMedia();
  },
  tabTo(t){this.tab=t;this.render();},
  /* ---- 每日精选（金句捕手 · 每天自动生成 6-10 篇不同文章，可刷新 / 返回今日） ---- */
  mtSig(x){return (x.t||'')+'|'+(x.src||'')},
  mtFeed(dateStr){
    const k='mt_feed_v3_'+dateStr;let f=DB.get(k,null);
    if(!f){f=mtDailySeed(dateStr);DB.set(k,f)}return f;
  },
  mtRefreshFeed(dateStr){
    const cur=this.mtFeed(dateStr).map(x=>this.mtSig(x)).join('|');
    const pool=MT_FEED.slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
    let n=6+Math.floor(Math.random()*5);if(n>pool.length)n=pool.length;
    let pick=pool.slice(0,n);
    const sig=pick.map(x=>this.mtSig(x)).join('|');
    if(sig===cur&&MT_FEED.length>n)pick=pool.slice(n,Math.min(2*n,pool.length));
    DB.set('mt_feed_v3_'+dateStr,pick);return pick;
  },
  mtBackToToday(dateStr){DB.set('mt_feed_v3_'+dateStr,mtDailySeed(dateStr))},
  mtFeedDone(){return DB.get('mt_feed_done',{})},
  toggleFeedItem(sig){
    const m=this.mtFeedDone();if(m[sig])delete m[sig];else m[sig]=1;
    DB.set('mt_feed_done',m);this.renderNewsList();
    const f=this.mtFeed(today());const done=f.filter(x=>m[this.mtSig(x)]).length;
    if(done===f.length)toast('今日文章读完啦 🎉 可点「今日读完了」打卡');
  },
  readFeed(i){
    const f=this.mtFeed(today());const x=f[i];if(!x)return;
    if(x.u){window.open(x.u,'_blank','noopener');return}
    App.modal({title:x.t||'每日精选',emo:'📄',noFoot:true,html:
      '<div style="line-height:1.7">'+
      (x.cat?'<span class="pill" style="background:var(--nerv-dim);color:var(--nerv)">'+esc(x.cat)+'</span>':'')+
      (x.body?'<p style="margin-top:12px">'+esc(x.body).replace(/\n/g,'<br>')+'</p>':'')+
      (x.u?'<p style="margin-top:12px"><a href="'+esc(x.u)+'" target="_blank" rel="noopener" style="color:var(--nerv);font-weight:600">↗ 查看原文 / 跳转来源</a></p>':'')+
      '<p class="mut" style="margin-top:10px">来源：'+esc(x.src||'')+'</p>'+
      '</div>'});
  },
  renderNews(){
    const c=this.check();const streak=this.newsStreak();
    const f=this.mtFeed(today());const dm=this.mtFeedDone();
    const readN=f.filter(x=>dm[this.mtSig(x)]).length;
    const todayDone=!!c[today()];const mode=DB.get('mt_news_mode','list');
    $('#mtBody').innerHTML=
      '<div class="greet"><b>📰 金句捕手 · 每日精选</b> · 每天 6-10 篇：↗ 真实要闻跳转原文，📄 全文素材点开即读</div>'+
      '<div class="grid g-main"><div class="grid" style="gap:14px;align-content:start">'+
        '<div class="panel accent"><div class="hd"><i class="dot"></i><h3><span class="emo">📅</span>'+fmtCN(today())+'</h3><span class="tag">TODAY</span><div class="sp"></div><div class="kpi" style="display:inline-flex;gap:4px;padding:4px 8px;min-width:auto"><span class="emo">🔥</span><div class="v" style="font-size:14px">'+streak+'</div><div class="k" style="font-size:9px">连续读报天</div></div></div>'+
        '<div class="bd"><div class="mut" style="margin-bottom:10px">今日为你精选了 <b>'+f.length+'</b> 篇，花 10 分钟读一读、记一记吧</div>'+
        '<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">'+
          '<div class="btn pri" style="flex:1;min-width:110px;justify-content:center" onclick="Mat.checkIn()">'+(todayDone?'✓ 今日读完了':'📖 今日读完了，打卡！')+'</div>'+
          '<div class="btn" style="justify-content:center" onclick="Mat.mtRefresh()">🔄 换一批</div>'+
          '<div class="btn" style="justify-content:center" onclick="Mat.mtBackToTodayClicked()">📅 返回今日</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;margin-bottom:10px"><span class="mut" style="font-size:11px">已读 '+readN+' / '+f.length+' 篇（每篇右上角可勾选）</span><div style="flex:1"></div>'+
        '<div class="vw-toggle"><span class="'+(mode==='list'?'on':'')+'" onclick="Mat.setNewsMode(\'list\')">☰ 列表</span><span class="'+(mode==='grid'?'on':'')+'" onclick="Mat.setNewsMode(\'grid\')">⊞ 网格</span></div></div>'+
        '<div id="mtNewsList"></div></div></div>'+
      '</div>'+
      '<div class="grid" style="gap:14px;align-content:start">'+
        '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">✍️</span>要闻摘记</h3><span class="tag">NOTE</span><div class="sp"></div><div class="btn sm pri" onclick="Mat.addNews()">+ 摘记</div></div>'+
        '<div class="bd"><div id="mtNotes"></div></div></div>'+
      '</div></div>';
    this.renderNewsList();this.renderNotes();
  },
  mtRefresh(){this.mtRefreshFeed(today());this.renderNews();toast('已为你换一批新文章 🔄');},
  mtBackToTodayClicked(){this.mtBackToToday(today());this.renderNews();toast('已返回今日生成的文章 📅');},
  newsStreak(){const c=this.check();let s=0;for(let i=0;i<400;i++){const dt=new Date();dt.setDate(dt.getDate()-i);const k=ymd(dt);if(c[k])s++;else if(i>0)break}return s},
  checkIn(){const c=this.check();c[today()]=true;DB.set('mtCheck',c);this.renderNews();toast('打卡成功 🔥');},
  setNewsMode(m){DB.set('mt_news_mode',m);this.renderNews();},
  renderNewsList(){
    const f=this.mtFeed(today());const mode=DB.get('mt_news_mode','list');const dm=this.mtFeedDone();
    if(!f.length){$('#mtNewsList').innerHTML='<div class="mut">暂无文章。</div>';return;}
    if(mode==='grid'){
      $('#mtNewsList').innerHTML='<div class="news-grid">'+f.map((x,i)=>{
        const sig=this.mtSig(x);const done=!!dm[sig];
        const cb='<div class="cb'+(done?' on':'')+'" style="position:absolute;top:8px;right:8px" onclick="event.preventDefault();event.stopPropagation();Mat.toggleFeedItem(\''+esc(sig).replace(/'/g,"\\'")+'\')"></div>';
        const ct='<span class="ct">'+esc(x.cat)+'</span>';
        const title='<div class="tt" style="margin-top:2px">'+esc(x.t)+(x.u?' <span style="color:var(--nerv)">↗</span>':' <span style="color:var(--tx-3)">📄</span>')+'</div>';
        const body=x.body?'<div style="line-height:1.6;margin-top:6px;color:var(--tx);font-size:12.5px">'+esc(x.body.length>70?x.body.slice(0,70)+'…':x.body)+'</div>':'';
        const src='<div class="sc">📎 '+esc(x.src)+'</div>';
        const inner=cb+ct+title+body+src;
        return '<div class="news-card'+(done?' done':'')+'" onclick="Mat.readFeed('+i+')" style="cursor:pointer">'+inner+'</div>';
      }).join('')+'</div>';
      return;
    }
    $('#mtNewsList').innerHTML=f.map((x,i)=>{
      const sig=this.mtSig(x);const done=!!dm[sig];
      return '<div class="item" style="margin-bottom:8px;padding:10px 12px"><div style="display:flex;gap:8px;align-items:flex-start">'+
      '<div class="cb'+(done?' on':'')+'" style="flex:none;margin-top:2px" onclick="event.preventDefault();event.stopPropagation();Mat.toggleFeedItem(\''+esc(sig).replace(/'/g,"\\'")+'\')"></div>'+
      '<span class="pill" style="background:var(--nerv-dim);color:var(--nerv);flex:none">'+esc(x.cat)+'</span>'+
      '<span onclick="Mat.readFeed('+i+')" style="flex:1;color:var(--tx);font-weight:600;line-height:1.5;cursor:pointer">'+esc(x.t)+' '+(x.u?'<span style="color:var(--nerv)">↗</span>':'<span style="color:var(--tx-3)">📄</span>')+'</span>'+
      '</div>'+
      (x.body?'<div onclick="Mat.readFeed('+i+')" style="margin-top:4px;line-height:1.6;cursor:pointer">'+esc(x.body.length>70?x.body.slice(0,70)+'…':x.body)+'</div>':'')+
      '<div class="mut" style="margin-top:4px">来源：'+esc(x.src)+'</div></div>';
    }).join('');
  },
  renderNotes(){
    const n=this.news().filter(x=>x.isNote);
    $('#mtNotes').innerHTML=n.length?n.slice().reverse().map(x=>
      '<div class="item" style="padding:9px 11px;margin-bottom:6px"><div class="acts"><div class="btn sm" onclick="Mat.delNews(\''+x.id+'\')">删</div></div>'+
      '<p style="font-size:12px">'+esc(x.text)+'</p>'+(x.src?'<p class="mut">📎 <a href="'+esc(x.src)+'" target="_blank" rel="noopener" style="color:var(--nerv)">'+esc(x.src)+'</a></p>':'')+'</div>').join('')
      :emptyBox('看到好句子/好观点，记一条要闻摘记','✍️');
  },
  addNews(){
    App.modal({title:'添加要闻/摘记',emo:'📰',fields:[
      {k:'text',label:'内容',type:'textarea',style:'min-height:80px',ph:'一句话概括今天看到的新闻或好观点'},
      {k:'src',label:'来源/链接',ph:'如：央视新闻、或粘贴一个可点开的网址 https://'}
    ],onOk:v=>{if(!v.text)return false;const n=this.news();n.unshift({id:uid(),text:v.text.trim(),src:v.src.trim(),done:false,doneDate:'',isNote:true});DB.set('mtNews',n);this.renderNews();toast('已添加');}});
  },
  delNews(id){DB.set('mtNews',this.news().filter(x=>x.id!==id));this.renderNews();},
  /* ---- 素材库（分类可选“其他”并自定义） ---- */
  renderLib(){
    $('#mtBody').innerHTML=
      '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">✨</span>捕获素材 / 金句</h3><span class="tag">CAPTURE</span></div>'+
      '<div class="bd"><div class="fld"><label class="lbl">内容 / 金句</label><textarea class="ta" id="mtText" placeholder="粘贴一段金句、案例、好文…"></textarea></div>'+
        '<div class="row" style="margin-bottom:9px"><div style="flex:1;min-width:120px"><label class="lbl">分类</label><select class="sel" id="mtCat" onchange="Mat.catChanged()">'+MAT_CATS.map(c=>'<option'+(c==='其他'?' data-other="1"':'')+'>'+c+'</option>').join('')+'</select></div>'+
        '<div style="flex:1;min-width:120px" id="mtCatCustomWrap" style="display:none"><label class="lbl">自定义分类</label><input class="ipt" id="mtCatCustom" placeholder="输入自定义分类"></div>'+
        '<div style="flex:1;min-width:120px"><label class="lbl">出处</label><input class="ipt" id="mtSrc" placeholder="来源/作者，或粘贴可点开链接"></div></div>'+
        '<div class="row"><input class="ipt f" id="mtTag" placeholder="标签，逗号分隔" onkeydown="if(event.key===\'Enter\')Mat.add()">'+
        '<div class="btn pri" onclick="Mat.add()">收入素材库</div></div>'+
      '</div></div>'+
      '<div class="panel" style="margin-top:14px"><div class="hd"><i class="dot"></i><h3><span class="emo">📚</span>素材库（按日期回看）</h3><span class="tag" id="mtCount"></span><div class="sp"></div>'+
        '<input type="date" class="ipt" id="mtReview" style="width:150px;padding:4px 8px" onchange="Mat.renderLibList()"></div>'+
      '<div class="bd"><div class="row" style="margin-bottom:9px"><input class="ipt f" id="mtSearch" placeholder="搜索内容 / 标签 / 出处" oninput="Mat.renderLibList()"></div>'+
        '<div class="row" id="mtChips" style="margin-bottom:11px"></div>'+
        '<div id="mtList" class="sc" style="max-height:520px"></div></div></div>'+
      '<div class="panel" style="margin-top:14px"><div class="hd"><i class="dot"></i><h3><span class="emo">🎲</span>选题灵感 · 高校学工</h3><span class="tag">TOPIC BANK</span><div class="sp"></div><div class="btn sm" onclick="Mat.roll()">换一批</div></div>'+
      '<div class="bd" id="mtTopics"></div></div>';
    this.catChanged();this.renderLibList();this.renderTopics();
  },
  catChanged(){
    const sel=$('#mtCat');if(!sel)return;const opt=sel.options[sel.selectedIndex];
    const isOther=opt&&opt.dataset&&opt.dataset.other==='1';
    const wrap=$('#mtCatCustomWrap');if(wrap)wrap.style.display=isOther?'block':'none';
  },
  add(){const text=$('#mtText').value.trim();if(!text){toast('先写点内容','err');return}
    let cat=$('#mtCat').value;
    if(cat==='其他'){cat=($('#mtCatCustom').value.trim())||'其他';}
    const src=$('#mtSrc').value.trim(),tag=$('#mtTag').value.trim();
    const l=this.lib();l.push({id:uid(),date:today(),text,cat,src,tags:tag?tag.split(/[,，]/).map(s=>s.trim()).filter(Boolean):[],fav:false});
    DB.set('mtLib',l);$('#mtText').value='';$('#mtSrc').value='';$('#mtTag').value='';this.renderLibList();toast('已收入素材库 📚');
  },
  renderLibList(){
    const q=$('#mtSearch')?$('#mtSearch').value.trim().toLowerCase():'';const rev=$('#mtReview')?$('#mtReview').value:'';
    let l=this.lib().slice().reverse();
    const cats=['全部'].concat(MAT_CATS, [...new Set(l.map(x=>x.cat).filter(c=>!MAT_CATS.includes(c)))]);
    $('#mtChips').innerHTML=cats.map(c=>'<span class="chip'+(this.cat===c||(c==='全部'&&!this.cat)?' on':'')+'" onclick="Mat.pick(\''+esc(c).replace(/'/g,"\\'")+'\')">'+esc(c)+'</span>').join('');
    if(this.cat&&this.cat!=='全部')l=l.filter(x=>x.cat===this.cat);
    if(rev)l=l.filter(x=>x.date===rev);
    if(q)l=l.filter(x=>(x.text+x.src+(x.tags||[]).join(' ')).toLowerCase().includes(q));
    $('#mtCount').textContent=l.length+' 条';
    $('#mtList').innerHTML=l.length?l.map(x=>
      '<div class="item"><div class="acts"><div class="btn sm" onclick="Mat.fav(\''+x.id+'\')">'+(x.fav?'★':'☆')+'</div><div class="btn sm" onclick="Mat.copy1(\''+x.id+'\')">复</div><div class="btn sm" onclick="Mat.del(\''+x.id+'\')">删</div></div>'+
      '<h4><span class="pill" style="background:var(--nerv-dim);color:var(--nerv)">'+esc(x.cat)+'</span> <span class="mut">'+x.date+(x.fav?' · 收藏':'')+'</span></h4>'+
      '<p>'+esc(x.text)+'</p>'+(x.src?('<p class="mut">📎 '+(/^https?:\/\//i.test(x.src)?'<a href="'+esc(x.src)+'" target="_blank" rel="noopener" style="color:var(--nerv);text-decoration:underline">'+esc(x.src)+'</a>':esc(x.src))+'</p>'):'')+(x.tags&&x.tags.length?'<p class="mut">#'+x.tags.join(' #')+'</p>':'')+'</div>').join('')
      :emptyBox(rev?'这一天没有收藏的素材，换个日期看看':'还没有素材，上面捕获一条吧','📚');
  },
  pick(c){this.cat=c==='全部'?'':c;this.renderLibList();},
  fav(id){const l=this.lib();const x=l.find(y=>y.id===id);x.fav=!x.fav;DB.set('mtLib',l);this.renderLibList();},
  copy1(id){const x=this.lib().find(y=>y.id===id);copy(x.text);},
  del(id){DB.set('mtLib',this.lib().filter(x=>x.id!==id));this.renderLibList();},
  renderTopics(){const pool=this.topics();const pick=[];const copy=pool.slice();for(let i=0;i<4&&copy.length;i++){pick.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0])}
    $('#mtTopics').innerHTML=pick.map(t=>'<div class="item" style="padding:9px 11px"><p style="font-size:12.5px;color:var(--tx)">'+esc(t)+'</p>'+
      '<div class="acts" style="position:static;margin-top:6px;opacity:1"><div class="btn sm gh" onclick="Mat.useTopic(\''+esc(t).replace(/'/g,"\\'")+'\')">用作素材</div></div></div>').join('');
  },
  useTopic(t){if($('#mtText')){$('#mtText').value=t;$('#mtCat').value='主题班会';this.catChanged();toast('已填入捕获框');}},
  roll(){this.renderTopics();},
  /* ---- 官媒直通车 ---- */
  renderMedia(){
    $('#mtBody').innerHTML=
      '<div class="greet"><b>🔥 权威官媒直通车</b> · 点击直达官网，读完后回「每日要闻」打卡</div>'+
      '<div class="grid g2">'+MAT_MEDIA.map(m=>
      '<div class="panel"><div class="bd">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:26px">'+m.icon+'</span><div><b>'+m.name+'</b><div class="mut">'+m.desc+'</div></div></div>'+
      '<div class="row">'+m.links.map(lk=>'<a class="btn sm" href="'+lk.u+'" target="_blank" rel="noopener">↗ '+esc(lk.t)+'</a>').join('')+'</div>'+
      '</div></div>').join('')+'</div>';
  }
};
RENDER.material=()=>Mat.render();
</script>
