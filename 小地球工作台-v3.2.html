  {q:"Describe a time when you tried to do something but you were not successful",title:"Part 2 范文",answer:"I’m always willing to try something new and I’m always curious about things that I’ve never tried before, but there is one experience that I’ll never forget because I really tried my best but failed at the end. It was about five years ago t hat I watched a travel show on TV, which introduced the sport of skydiving in New Zealand. Wearing professional skydiving equipment to jump hundreds or even thousands of meters high, like an eagle soar into the sky, that kind of feeling is great, even to think about it. Well, I did a lot of preliminary preparations. I contacted a professional skydiving coach in China, and he suggested that I should do some exercise first to reduce the excess body fat, so that it would be much easier for the practice in the future. So I started my painful diet, for example, drinking soy milk only, an apple and two slices of bread every morning, having chicken breast for lunch and salad for dinner, which required a lot of resistance when seeing people around me eating those mo uth-watering dishes. After two months of dieting, I finally succeeded in losing 15 kilograms, believe it or not, I just did it. Apart from that, I attended some offline training courses, during which the teachers taught me some theoretical knowledge and safety matters about skydiving. Finally, the day came for real practice. However, I just couldn’t breathe when I looked down. The coach encouraged me a lot, like taking a deep breath, but somehow I just couldn’t overcome my fear. I kept telling myself not to be afraid, but I couldn’t stop thinking about death. I stood up, but my whole legs were shaking, heart racing, gasping and sweat pouring, then my mind went blank and I passed out on the plane. Yeah obviously, I didn’t make it. Now I still regret it, and I hope that I can do it again in the future.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a time when you were not allowed to use your mobile phone",title:"Part 2 范文",answer:"Alright, talking about an experience that I was not allowed to use my phone, I wanna tell you about my last final exam. It was last June and the exam was taken place in my university. We took the exam in the great hall and every student was asked to put their bags in the back or side area of the room. Students were required to turn off their mobile phones in order to keep the venue quiet. Before the exam, several examiners double checked if any student held a phone in their pocket. There was a student who only muted his phone and he was told to switch it off and put it back to the bag. The reason why phones were forbidden in an exam was very obvious. First and foremost, some students may use their phones to cheat. Since phones are almost almighty nowadays, it will be way too easy to google an answer and look it up in the dictionaries via the phone. Thus, it is absolutely reasonable to ban mobile phones in an exam. Furthermore, the ringtones and notifications will disturb all the exam candidates if the phones are brought to the venue. Imagine a phone kept ringing during a writing exam, all the students would feel annoyed for sure. So yeah personally I’m in favor of banning phones in exam venues. I think it helps to prevent cheating and to build a nice environment for all the candidates.\n\nPART 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an exciting book that you enjoy reading",title:"Part 2 范文",answer:"I want to talk about the Steve Jobs Biography that I have read several time s. This is a book about the Steve Jobs legend written by Walter Isaacson. The writing is very truthful and sincere. It has written many shortcomings of Steve Jobs, some aspects that are intolerable, and of course more aspects are admirable. The last time I read this book was last month, so my memory is still new. What excites me most in the book is that Jobs is very eloquent. He played a vital role in persuading others, gaining an advantage in negotiations, and stimulating the potential of the team. Jobs ma stered the skill of using gaze and silence to conquer others. One of his tricks is to stare at the person who is talking to him. He will keep looking into the other person's eyes, and then ask a question, asking the other person to answer without avoiding his gaze. In addition, his extraordinary speech ability was obvious to all at the press conference. Jobs' success largely comes from his passion. He does everything possible to make perfect products and pursue details. In the book, he said that we made the iPod for ourselves, because he really likes music to make this product successful. When you really do something for yourself, for your good friends or family, you will not give up easily. But if you don't love it, then you won't take one step further, and you won't be willing to work overtime on weekends, and will only settle for the status quo. This enlightenment to me is that only by doing one thing without utilitarianism can you concentrate on it and achieve the ultimate. By reading his autobiography again and again, I can understand the qualities that a person and an industry need to succeed, and learn from the experience he has learned from successful people. Although I may not be as successful as him in my life, learning more experience is still very helpful for my own growth.\n\nPart 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a habit your friends has and you want to develop",title:"Part 2 范文",answer:"A good habit I hope I can develop is to keep recording life, which is a habit my roommate has. When she goes out, she always brings a small camera. Even if she doesn't bring the camera, she will use her mobile phone to record every interesting and warm moment when we study, play, eat or go shopping together. From the first day I knew her, I found that she is a person who likes to record life. When she meets cute kittens and beautiful scenery, she always takes pictures with her mobile phone. After a period of time, she will systematically sort out the videos and photos she has taken, and clip the short video into a vlog. I think this is a good habit worth learning for me. First of all, our pace of life is becoming faster and faster. We spend a lot of time in a hurry. Happy and sad moments have no chance to be preserved. When we want to recall in the future, we can only regret that there was no record at the beginning. Secondly, recording life is also recording our own growth. The videos and photos can help us better reflect on our problems in order to correct them. They can also let us see what we have done well and continue to strive to do better. Finally, videos and photos bearing traces of life can also be sent to family and friends who are not companying with us, which can become a good way to let them know our life state and reassure them. So I am considering and choosing to buy a suitable camera to learn from my roommate and form a good habit of recording life.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an activity you usually do that wastes your time",title:"Part 2 范文",answer:"I would like to talk about an activity that I frequently do but actually takes a lot of time. The thing that I wanna say is playing games and surfing online. However, those are beneficial to us should be admitted. Owing to the reason that I’m a student right now, therefore it’s overt that I have to do some entertainments to mitigate the academic pressure and then I could be engrossed in my daily study. As for me, I choose to play games , I can not only alleviate the stress trough playing it, but have a sense of complication after winning the game. When it comes to the frequency of playing, during weekends I will definitely turn on my computer to play games. I feel totally free when staying at home and playing those electric games. It’s palpable that it’s much better to enjoy indoor rather play outdoor. Regarding to the reason why I reckon that playing games will takes much time, one persuasive explanation is that I will be obsessed with games rather than be concentrated on my main mission study. Additionally, it’s undoubtedly that we won’t enrich ourselves by playing some futile games, instead, we ought to read books to enrich our spiritual life or do exercises to build robust body. Hence, I deem that we all have to find a more meaningful activity that can improve ourselves in any aspects rather than have a waste of time.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a good service you received",title:"Part 2 范文",answer:"Last month I bought a small gift for a friend at Alexander McQueen’s flagship store in Shanghai. The sales associate was extremely polite and patient as I took a long long time to chose the present. I bought a cardholder which is one of the least expensive items in a shop where a handbag cost 2000 US dollars on average. The great service, polite conversation and helpful attitude were exactly what you would expect from a top designer store in big cities such as Shanghai, London, New York o r Paris. However, it is the follow -up email from the sales consultant which I received the week after my purchase that took me by surprise. The subject of the email was \"Thank you\". In the email, the sales consultant wrote: It was very nice speaking with you. I hope your friend loved her gift. I am sure she will be very touched by your kindness. Please let me know if I can help with anything. I hope you had the opportunity to check out the store for yourself! I have never experienced this level of personalized service from any designer store. In the past, I have been added to numerous mailing lists for upcoming sales or promotions, but I thought this email shows exceptional service and hard work. I believe it is an amazing example of how to keep customers ha ppy and loyal. She had to memorize and take the time to write down what was the purpose of my purchase. I was deeply moved by her email, and I started to have a very good impression on Alexander McQueen. You might call it \"customer management\", \"loyalty bu ilding\" or simply \"good salesmanship\". But to me it's a good example of why service matters and how there are simple ways to build brand love and loyalty through superb customer service - making customers feel heard, loved, and valued.\n\nPart 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a difficult decision that you once made",title:"Part 2 范文",answer:"I'd like to talk about a hard decision that I made last year. It's about whether I should study abroad in England or further my study here in China. I had to make this decision in my last summer vacation when I was a sophomore student, and I was about to begin my graduate program the next year. I made this decision mainly by asking opinions from lots of people; for example, I asked some of my friends who plan to go abroad to study and some of the seniors who have already been abroad about their feelings about studying an d living in England. And I also asked some of my friends who applied for graduate programs here in china about their experience as well. And I had made my decision based on their answers. The result is that I decide to go abroad to study. Because firstly, I want to become more independent. Here in China, my parents take care of me in every aspect. But in England, I have to take care of myself, like doing the laundry and cooking. And secondly, if I were to study in England, my English would become very fluent. And it's very important for my future career development. Besides, I really enjoy English culture, and my favorite British drama is Downton Abby, so I hope to have this opportunity to experience the British lifestyle and culture. The decision was very difficult to make because, as you know, studying abroad is a huge financial commitment, but my parents are not very rich, but they are willing to support me with that. In addition, as I said, I need to be very independent to study abroad and have to take care of myself. About that, I was not very confident of my own independence. The idea of getting everything arranged in perfect order makes me feel very scary. But I think I will figure it out.\n\nPart 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an item on which you spent more than expected",title:"Part 2 范文",answer:"I would like to tell you the story that I paid 200 Chinese Yuan on an empty paper box. When I was 8, I was in the car with my parents, heading back home from our holiday in another city. I had saved up my pocket money for a year and a bit of money I had got for my birthday, which was about 200 Chinese Yuan in total, hoping to find something good to buy. On the way back, we stopped in a mall for lunch, where happened to have a toy shop. Eagerly I went inside, and looked around. And then I saw it, a beautiful barbie doll. There were a couple of boxes under the demons tration model, on a table. The price of this gorgeous barbie was 199 Yuan each. A lot of money for an eight year old, but this was quite a vivid doll. So, I made the decision. I grabbed the nearest box and hurried to the counter, and gave the shop owner al most all my savings. I can still remember how excited I was, hurrying back to the car, showing the box to my parents. I put off opening the box, as I didn't want to lose any small parts of the doll in the car. After a long drive, we finally arrived home. I couldn't bear to wait any longer. I tore off the tape, and opened the box. It was empty. Ihad grabbed the box of the display model by mistake. My Dad didn't want to drive back, as apparently the store was too far away. He was just saying something to me t hrough my tears about learning to check things properly before leaving. Therefore, I never got my barbie, and I just spent a huge amount of money on an empty box.\n\nPart 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a skill that is difficult for you",title:"Part 2 范文",answer:"I'd like to talk about the driving skill that I mastered last year. Driving has become a survival skill for young people, and almost every friend of mine wants to learn it when they come to a certain age. So I joined a driving school to learn it and wondered if I could drive by myself when traveling to another city. I learned this skill at a driving school near to my home in my hometown last summer holiday. I remember it was in late July when it was the hottest season in my hometown. I spent about a month learning this skill, passe d four exams, and finally got my driving license. I had a very impatient and strict coach with us, but he was very experienced and knew how to train us efficiently. He always sited alongside me to coach and provided me advice to improve my driving abilitie s and teach me different techniques or tips to help enhance my skills. My classmates and I had to practice for at least three hours under the sun every day. And I needed to stand by and wait for my turn for practice for a long time. It wasn't easy because driving skills include strong knowledge of traffic laws, maintenance knowledge, and problemsolving skills. And a good driver needs to have an intense concentration when driving and should be attentive and alert in case unexpected hazards are found on the road or to avoid any other cars from crashing into the vehicle. But I'm easy to be distracted by other things and always feel sleepy. I know it's dangerous, and I'm working on it. I try to listen to music and have a good sleep before driving for a long time.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a puzzle that you enjoyed doing (e.g. Jigsaw, crossword, sudoku）",title:"Part 2 范文",answer:"Room-escaping games have become increasingly popular among young people. it’s a game involving searching for clues to solve a series of puzzles and finding hidden objects so that you could escape from the locked rooms. Several weeks ago, some of my friends and I went to a studio to play this adventure game together. I must say it’s challenging to solve the puzzles within a short time, but it's also worth playing with a group of friends since it has so much fun. In the beginning, the doorkeeper collected our phones away and led us to a mysterious house, then he locked the door and told us the timer was on. Everyone felt a bit nervous and terrified since that was the first time we played this. A few minutes later, one of us said we must move and find those clues since the timer was ticking down quickly. We were all trying to examine the room, then we found different scenery paintings on the wall. I found a map from a cabinet drawer that says we needed to find six similarities among these paintings. To save us more time, we decided to form two te ams and searched for clues separately. Since it was a live interactive game, there’s a warning sound every other 20 minutes; At that moment, we were like racing against time. Up until the last 5 minute, we still only found five clues and missed out on the most important one. We were almost despaired and ready to give up. Finally, I realized when we combined the five clues we have, we could get a new clue which was the key to the puzzle. We won the bonus and opened the door by ourselves. everyone felt so lucky that we could stick to the end.\n\nPart3 Do Chinese people like puzzles？ I think Chinese people like to play intelligence games. In ancient times, there were tangram, chess and so on. These are classic games that have been handed down to the present day. Nowadays many young people are keen on playing Lego, building blocks and other various kinds of games. In recent years, there are also some new games to exercise our thinking ability, such as script killing, werewolf killing etc. We also have some traditional festivals that integrate intelligence games. For example, during the Lantern Festival, we have a unique folk cultural activity to guess lantern riddles, which is pretty interesting.\n\nWhy parents let their children play puzzles？ Undoubtedly, first of all puzzles can act as an ideal channel and platform to release children's stress and kill the boring time. in addition, the puzzles give their kids a golden chance to step away from electronic devices, which is an absolute blessing. secondly, puzzles can lighten up one’s mood. Meanwhile, the puzzles do a great job in stimulating children’s imagination, creativity and eager for study.\n\n- 77 - Which kinds of puzzle can improve intelligence？ Most of puzzles can improve people's intelligence especially for the young. To be more specific, d ifferent puzzles can foster different abilities such as observing objects, coordinating hands and eyes, solving the problem and reading as well as spelling. In fact, many experiments have proved that doing puzzles can sharpen their minds and improve their intelligence. For example, building blocks can exercise people's spatial imagination, while Sudoku and other digital games can exercise people's logical thinking and quick reaction ability.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a leisure activity on/near the sea that you want to try",title:"Part 2 范文",answer:"Whenever I go to seaside places, I would often see people playing beach volleyball there, and I always want to join them; although I’ve been playing volleyball in my school for like three years, I’ve never played this on the beach. My other three best friends and I had made the deal to do this in the upcoming summer vacation. Compared to indoor volleyball, it seems to be more relaxing and entertaining. It must be so different. First, the ball is much lighter and softer; someone told me they could even float in the air, and It might take some time to get used to it for skilled- players. I guess it would be a bit challenging for us to control the ball at first, but that’s going to be even more fun. When we played indoor volleyball, we had to stand in specialized positions to either hit, dig or block the ball. But it sets almost no limit in a beach volleyball game; that means we could hit the ball from anywhere, which excites us most. Plus, I heard that it’s also much more tiring when moving on the sand rapidly; my friend Emma said we might do sand fighting there. At that moment, we all burst into huge laughter when thinking of those funny moments. We even planned other things as well. After playing beach volleyball, we’re going to lie on the chair, having the mint chocolate ice cream and getting tanned under the beautiful sunshine; it must be terrific for all of us to escape from endless test and homework.\n\nPart3 what are the advantages and disadvantages of vacations to the seaside? The advantage of vacations to the seaside is that we can get close to nature. The air is fresh, and there are many sports that can exercise, relax, and more important ly, we can eat delicious seafood. The disadvantage is that we need to prevent sunburn, and in the peak tourist season, the rent and consumption will be more expensive.\n\nWhy do people like spending time on the sea？ I guess the main reason is that water has a kind of calming effect on people. This gives them the opportunity to escape from the hustle and bustle of city life, breathe some fresh air and let their hair down a bit. And when you consider all the stress that people are under these days, I think it's easy to understand why people gravitate to places near water.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a street market or an outdoor market you've been to",title:"Part 2 范文",answer:"I’m fascinated with open-air market cuz I can always find a lot of unexpected good things, and at the same time, bargaining with the stall owner is also a very interesting experience. The summer before last year, my friends and I went to Phuket island for an independent travel. The most enjoyable part of the trip was that we could buy many novel things and eat many tasty foods we had never tried before. One night, after a bonfire party, we were starving and decided to grab something to eat, so we went to a famous night market nearby called Patpong Night Market. We wandered around the fair, which was the size of two football fields. There were people selling clothes, local products, crafts, tattooing and performing street magic. Then, a very vibrant uncle who could speak Chinese pulled us over. We looked around and found it was a stall selling fried insects. It was the first time I saw fried insects, there were fried grasshoppers, fried spiders, fried geckos, fried frogs, and I was really scared at first, thinking how could anyone eat these stuff. I tried to sneak out my phone to take pictures of those bizarre food, but the boss said in perfectly cropped Chinese, “Welcome to take photos.” The insects looked so disgusting, and the boss noticed our embarrassment and gave us a bunch of fried cockroaches to taste. At first, I refused, but the boss was so enthusiastic. My peers also tried it one after another, and they all said it was delicious. I held my nose and mustered the courage to take my first bite. To my surprise, it tasted good, like eating sticky gummy candies. So I decided to try more and bought every kinds. I think it’s a wonderful experience I will never forget, and I wonder when I can try it again.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a law to help the environment which you think your country should have",title:"Part 2 范文",answer:"I’d like to describe a regulation t hat protects the environment in the city, which is a ban on firecrackers and fireworks in the central area of Shanghai. The regulation stipulates that residents are not allowed to set off firecrackers or fireworks at any time of year, and those who violate the regulation will be fined or even face jail time. I first learned about it around 10 years ago when I just came to Shanghai and spent my very first Spring Festival there. As a tradition, Chinese people celebrate the Spring Festival by buying and setting off firecrackers or fireworks. However, at that time, I couldn’t find any place in Shanghai that sold these explosive devices. Later, I learned about this regulation, and frustrated as I was, I knew I was going to have a different Chinese New Year this time. Well, obviously anyone living in the city benefits from this ban since firecrackers and fireworks produce smoke and lots of harmful particles that can pollute the air and cause respiratory diseases. This is especially true in Shanghai with a high population density. Just imagine how much worse the environment would become if every family were allowed to engage in this age-old tradition. I do have mixed feelings about this regulation. On the one hand, I know it’s sensible to carry out this ban for the sake of city environment and people’s health. But on the other hand, I’ll really miss the festive atmosphere brought about by setting off firecrackers and fireworks during Spring Festival. But I guess the possible benefits of this ban far outweigh the envi ronmental damages setting off firecrackers and fireworks entails. So this is a good regulation.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a natural talent you want to improve, (like sports, music etc)",title:"Part 2 范文",answer:"I do believe that most people are born with certain natural talents like those for music, sports or arts. Such natural “abilities” allow their owners to learn more quickly and better and become excellent musicians, sports athletes or artists. As for me, I think I do have a natural talent for learning languages. I first discovered it probably when I was in middle school. At that time, I got really interested in Cantonese songs. So, in order to sing them, I had to be able to learn to pronounce Cantonese words. Actually, many youngsters had the same interest too back then. But what I found out was that I could do much better than most of the peers I met or knew. I mean my Cantonese sounded more authentic to others. But what I really benefitted form this talent in was my learning English. As with Cantonese songs, I found I made quick er and better progress in my language acquisition. And right now, I’m preparing for my IELTS test, and I really need to better my English so as to get a good score in the IELTS test. To be honest, I don’t know whether one’s talent can be improved or not, b ut at least I have come up with some ways to improve my language proficiency with the help of this natural talent. First, I am planning to expose myself more to English by listening to English broadcast and watching English TV shows. This way, I hope I can pick up more useful words and phrases that I can use in my speaking and writing. And I will also try to create situations where I can compete with my classmates at school because I find competitions do force me to tap into this innate ability, thus leading to better performance. I feel pretty confident about it, truth be told.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a piece of local news that people in your town or city were interested in",title:"Part 2 范文",answer:"In this age of information and media, we are bo mbarded with all kinds of news every day even though they just might not have the news value as we would have preferred. But, the news here, I’m about to share, is certainly interesting as far as its news value is concerned. In a fine morning a few weeks ago, I turned on the TV, like any other usual day, this news was aired on one of our local TV channels and it really caught my eyes. The news was related to the tough life of an old man, in his early 70’s, who earns his living by selling plastic bottles in Shanghai. The news also mentioned that he remains unmarried all his life and he has no children to look after him. Ironically enough though, he never seeks any help from anybody to survive. Of course, a lot of people had tried to help him, but he refused t o accept their help, apparently because he thought it was a disgrace to accept other peoples’ help and that he was very happy living like that for over the last 30 years. What moved me most was that it is he who has helped many helpless and poor people with the very insignificant amount of money that he earns by selling plastic bottles. As for why people were interested in this piece of news. Well, first of all, his steel -strong determination and the spirit of never giving up deeply inspired us, and I have realized that those people who we perceive as worthless because of their purposeless life seem to have a greater sense of self-respect. On top of that, the news also taught people that it doesn’t really take much money to heal and help others, but it is th e heart of a person, which is needed the most.\n\nPart3 Do people read newspaper where you live I don't think most of them still read newspapers, instead they usually read news on the Internet, sometimes they will download news apps or just view the news on Weibo or even on webpages. I myself haven’t seen people reading newspaper for a long time, but maybe there are still seniors reading newspaper at home.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a company or organization where you live that employs a lot of people",title:"Part 2 范文",answer:"I’d like to describe a company called Lianjia which offers real estate brokerage services like buying, selling and renting for the clients. In Shanghai, there are Lianjia branches in almost every residential area. I think Lianjia is the biggest of its kind in Shanghai. Due to its size, I believe it employs lots of people most of whom are real estate agents who help their clients buy, sell and rent houses and get a commission for every deal. Well, I don’t know the exact number of agents Lianjia has under its employ, but I think it must thousands. And as far as I’m concerned, anyone can work for this company. In other words, this kind of job has a very low threshold, which doesn’t require high academic degrees. As long as you can speak properly and are willing to serve, you can work there. I find Lianjia pretty reliable and the people there are friendly and trustworthy. I’ve been living in Shanghai for over ten years, and been living in rented apartments. Every time I’m looking for a new apartment, the first agency I think of is Lianjia because unlike those agents from other agencies, people there don’t try to rip you off. Over these years, I’ve learned that the price they offer is the lowest in the market, and the after-sale service is satisfactory. And that explains why Lianjia has the greatest market share in Shanghai.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an art of craft activity (e.g. painting, woodwork, etc.) you did when you were at school",title:"Part 2 范文",answer:"When it comes to an art or craft activity that I had at schoo l, I’d like to talk about a thing that I did as a young elementary school student. Back then, my school often organized lots of extracurricular activities to help us learn something out of books. There was an activity to help homeless cats near our distric t and we were all excited to participate in. As a prerequisite for attending this activity, we were required to build a paperboard house for those cats. So our teacher in art class led us to accomplish this meaningful task.In order to make this “house”, I used some hard cardboard, some magnet papers, a hole puncher, and a couple of heavy binding cords. For starters, I cut strong cardboard into two sheets in the same size, and I cut as many sheets of magnet papers as I wanted to the same dimensions. Then, I just attached those magnet papers with the cardboard in order to stack them in a layer on top of another. After that, I punched two holes along one side of the stacked layers in order to tie them together with the cord binders by threading through the punched holes. In the end, I painted the house into pink as I thought it would attract cats to come in. Anyway, I felt really great about this particular art and craft activity as I could actually see the result of my hard work with my own eyes. Besides, this special activity also allowed me to share some good laughs and quality time with some of my other fellow students. On top of that, I could contribute something to those homeless cats, which was really meaningful and it could often remind me of cherishing those little lives.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a piece of equipment which is important to you in your home",title:"Part 2 范文",answer:"I’d like to describe an important piece of equipment in my home which is a Wi -Fi router whose brand is TP Link, a domestic brand. Wi-Fi routers nowadays are common and essential electronic equipment for every household in China because they allow people to have access to the internet wirelessly. TP Link routers are one of the most commonly used in China due to their high performance and low prices. The one I have in my home is a black one with six antennas that can give you fast internet connection with your electronic devices like mobile phones, laptops and home appliances. I bought it around three years ago when I moved to a new apartment. The new house was so big with three bedrooms that my old Wi -Fi router could not cover the whole house; sometimes, I got very weak or even no signal in my bedroom. So, I decided to buy a new router that had better coverage. I asked a friend who was a tech- savvy guy and recommended me this model. I trusted my friend and bought it on Taobao. Having used it for a few days, I found that it was really good and I began to have strong signals in my bedroom. This Wi-Fi router is a very important piece of equipment in my home. I mean isn’t that obvious? Nowadays, we can’t live without internet, and we desperately rely on this small device to have our mobile devices wirelessly connected to it so that we can do things like playing online games, watching shows, chatting with friends and even having classes. So, there is no doubt that a Wi-Fi router is the most basic equipment every household needs.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an activity you often enjoy doing when your work or school day ends",title:"Part 2 范文",answer:"I’d like to describe an activity that I do after work which is jogging. Actually, jogging is quite a popular exercise among Chinese people, and nowadays more and more young people have taken up this activity as a hobby and a way to keep fit. For me, it is definitely a way to stay healthy and release stress. Well, I usually go jogging in our community after dinner. My routine is run ten laps, which usually takes me about one and half hours. In fact, I’ve been doing this activity for three years now. I still remember how hard it was when I first started it. I couldn’t ke ep it up for even 30 minutes. But over time, I got better at it; I guess my body had adapted to this physical task. And now, I can keep running much faster and cover a longer distance compared with when just started. Finally, let me talk about how I feel about this activity. I feel absolutely great about this activity. It’s easy and cheap. all I need is just a pair of shoes and I can run anywhere I find suitable. I don’t need to buy any membership or expensive gear. I guess the only catch is the persistence it takes. I also feel that this activity has made me a happy person. I mean life is hard. Your work keeps you busy and you’re constantly under a lot of stress. When you get kids, all of a sudden you have more responsibilities, like cooking for them, rea ding to them and worrying about their studies. Often, you wish you could rid yourself of all the worries and concerns even if just momentarily. And this is where running comes in. after this activity, I feel refreshed and ready to face everything in a positive manner.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe an article you read from the internet about health lifestyle",title:"Part 2 范文",answer:"Well, an article about health that I read on the internet was about “How to live a healthy life”. A few years ago, I attempted to live a healthier lifestyle and to get in better shape. This meant improving diet, exercising more frequently and trying to make healthier choices in my daily life. However, I was not an expert in this field, so I read this article on a website called www.people’s health.com, which was set up by Henry, a really well-known medical doctor in China, in 2014. I clearly remember that it talked about 3 key issues to have a healthy life. The first thing I learned from the article was to maintain a balanced diet. Let’s say, eating 2-3 different kinds of veggies and fruits every day could insure the vitamin and fiber intake of human body. Also, the article suggeste d that people should do some aerobic exercise for about 40 minutes daily to burn extra calories. On top of that, having enough sleep, like 7 or 8 hours at least, was quite essential for people’s physical health. In the past, I used to stay up late very often to play online games, and I didn’t think too much about what it would do to my body. After I read this article on the website, I saw pictures of the changes before and after a person stayed up late, which scared me a lot. From then on, I decided to follow this article and change my habits. And, you know what, I succeeded in losing 30 pounds. Now I have a very well- built figure that almost everyone dreams of, so I’m very glad that I read the article. I changed some of my lifestyle after I read this article and I feel very fit and healthy and have rarely fallen sick since I made these small changes. I have bookmarked this article and read it often to remind myself keeping health lifestyle. And I also shared it with many of my friends and relatives.\n\nPART 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a cafe you like to visit",title:"Part 2 范文",answer:"I was very impressed by a cafe I recently went to. It was located on the Bank of Nanxi Riv er. I accidentally found it during my summer vacation when traveling with my family. The decoration style of this cafe is pretty modern and simple, and the overall color is mainly black-and-white and gray. There is a large French window in this coffee shop on the side of the Nanxi River. Sitting by the window for coffee, you can see the beautiful scenery, clear river water, dense green trees and even birds can be heard when quiet. This cafe does not supply many goods, only conventional coffee, such as latt e, espresso, American coffee, cappuccino, etc. at the same time, it also provides some tea products, mainly green tea and black tea, without snack products. We ordered four cups of vanilla lattes and a pot of black tea. We can feel that the quality of coffee beans is good and the taste is really strong. All of us like it very much. Because the weather was extremely hot that day, we didn't go to other scenic spots. Instead, we chose to rest in this cafe, played card games with our brothers and sisters for a while, and we spent a very leisurely and relaxed afternoon there. I usually like to drink coffee and I have been to many cafes, but there are few like this one. The reason why I am very impressed is that the location of this cafe is pretty good. At the same time, the interior decoration is also very popular with young people. I think it will be better if more kinds of goods can be provided in the future, and I will go there with my friends again.\n\nPart 3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a place you visited on vacation",title:"Part 2 范文",answer:"I'd like to talk about Mogan Mountain, where I went with my friends last year. The mountain is located in Zhejiang province in the east of China. It took me about three hours' drive to go there. The mountain is famous for its green sea. Bamboos can be seen everywhere in Mogan Mountain. Hundreds of springs and waterfalls make this mountain the best place to escape the summer heat. So, it has been listed as one of the 'Four Best Summer Resorts in China.' If I remember correctly, it was in the first week of October on my National Holiday. All of my friends had day -offs, and we gathered together from different cities in China. And we stayed there for four days. It was in autumn, so some leaves turn yellow and red, and the whole mountain was colorful and very impressive. What I did there, well, unfortunately, it was raining all the time, and it was very cold on the top of the mountain, and all of us didn't bring enough warm clothes. So we almost stay in the villa all the time. We rent a beautiful villa, which was decorated in Japanese style. There were many entertainment facilities, such as a swimming pool, board games, Mahjong, and karaoke. We chatted a lot, shared our recent life, complained about our work, and we took lots of selfie. We had a great time together to get rid of the hustle and rustle from cities. My friend Esther introduced this mountain to me about one year ago. She said it was a nice getaway from the big city life, where we can enjoy lovely views and the greenery. And, there are some outdoor activities we can do there, for example, drifting, riding, and even farming. I hope to go there again with my friends where the weather is good.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a town or city where you would like to live in the future",title:"Part 2 范文",answer:"Well, I would definitely choose Lhasa, which is located in the middle part of Tibet, nearly 4000 kilometers from my hometown. I got to know this city from a travel show on TV when I was probably 7 or 8 years old. It has been the provincial capital of Tibet Autonomous Region for more than 1,300 years, and it is the political, cultural, economic, and religious center of Tibet as well as a sacred place of Tibetan Buddhism. It is known to all that Lhasa is renowned for its spectacular landscapes and historical sites and cultural relics, so it has captivated countless visitors from all over the world for decades. As for why I’d like to live there, well, there are a lot of culturally significant Tibetan Buddhist sites such as the Potala Palace, which is a place I’ve been dreaming of for a long time, and I’m really cur ious how it became a divine place for Tibetan Buddhism. Another reason is that the air quality in Lhasa is much better than most cities in China, so smog condition will be my least concern. You know what, I would be able to see the crystal-clear sky in the daytime and the shinning stars at night if I lived in Lhasa. On top of it, I’m a fanatic of natural scenery. I mean, I can see different wild animals, limpid water and the unbroken mountain ranges. It is in Lhasa that I can fully enjoy those eye-catching landscapes. I gotta say that Lhasa is one of my favorite places I’ve ever been, a real feast for the eyes. Of course, the cost of living is one of my considerations. I’m fed up with the high cost of living in big cities, and I really can’t stand the fast pace of my current lifestyle. So I’m really looking forward to living there in the near future, for the sake my health and longevity.\n\nPart3 Why do more and more people live in the city? / What are some factors that attract people to settle down in certain places? There are many reasons why an increasing number of people choose to settle down in the city. First of all, the living standard tends to be much higher because residents can have an easier access to the advanced healthcare system and well -equipped h ospitals. Besides, it is more likely for people to find favourable employment in cities, metropolises in particular, in which a large number of multinational businesses would set up their on -the-ground presence there.",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a tall building in your city/town you like or dislike",title:"Part 2 范文",answer:"A tall building I’d like to describe is the Oriental Pearl TV Tower, which is locat ed in Lujiazui in Pudong district of Shanghai. I visited it 12 years ago when I came to Shanghai for the first time with my wife. We went there mainly because it was such a famous local tourist attraction that we just felt that it was worth paying a visit to. We went to the top by a very fast elevator where we had a panoramic view of the whole city. Th e experience was quite amazing. Well, the tower has quite a few functions. The name suggests that it is used for TV transmissions, but it can also be seen as a place for sightseeing, shopping, having meals and entertainment. Next, I’d like to talk about its appearance. Seen from a distance, the tower has two huge spheres, but actually there are altogether 11 of them, big and small. The Oriental Pearl TV Tower also consists of three big columns at the bottom that prevent this structure from falling down. At 468 meters, it used to be the tallest building in China until it was surpassed by others like the Shanghai World Financial Center. I can’t say I have strong feelings about this structure, but it is seen as the most distinctive landmark in Shanghai. That means the locals people regard it as their pride. I guess one should not miss it travelling in this city. There is also an observation platform high above with a glass floor. Last time, I was standing on it and my legs were trembling!\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a place you like going to that is quiet",title:"Part 2 范文",answer:"When it comes to this topic, the first place that jumps into my mind is the Jing’an Temple, which is located at West Nanjing Road, Jing’an District, the flourishing downtown area of Shanghai. As far as I know, the history of the temple can be traced back to 780 years ago. I mean, it was built in the Southern Song Dynasty, and a famous calligrapher r enamed it as Jing’an Temple in 1945 and is still named as such today. Actually, it’s one of the quietest places in Shanghai and I go there twice a month, on the first and 15 th of every month. The temple has been the most sacred place in Shanghai since it w as opened to the public in 1990. It consists of three main halls: The Mahavira Hall, the Hall of Heavenly Kings and the Three Sage Hall. The most impressive part is the Jade Buddha in Mahavira Hall, which is the biggest pure jade portrait of Sakyamuni in Mainland China. Every time when I go to burn incense and worship the Buddha, I can see monks chanting sutras, the faithful could be seen praying, which is a terrific way for me to get rid of stress and worries and find some inner peace. Jing’an Temple is a great place to escape the hustle and bustle of crowds in downtown, cuz everyone who enters the temple speaks in a low voice, even children would whisper. I tend to go there with some devout Buddhists during some traditional festivals and special events, like the Temple Fair during the Spring Festival, we would go to lectures and then sit in meditation for hours, which can definitely help me loosen up and purify my soul. I’m fascinated with this place not only because of the tranquil atmosphere, but also the venerability and auspiciousness the Buddha radiates. Even at this moment, I seemed to be able to smell the sandalwood incense in the temple.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,
  {q:"Describe a place (not your home) where you are able to relax",title:"Part 2 范文",answer:"I want to say something about Disneyland theme park, which is located in Pudong new district of Shanghai. It is very far from where I live, so everytime I go there, I have to spend almost 2 hours to go there by subway. But as it is a place of joy, I never think it is too long for me to get there, so every month I will pay a visit to it. The most special part that I am astounded is that the park never loses to focus on every detail. Their spirit of craftsman is reflected not only in the design of entertainment facilities like merry -go-round, roller coaster, flying swing, but also in the broadcast of the park, not to mention their delicious dishes which have the shape of Disney characters. This is so curing and adorable, and every time I go there, I would buy souvenirs and gifts for my friends and myself. The process of shopping is also really relaxing! I also want to praise their staff’s friendly and comprehensive service. When I was 10, I went there for the first time and wherever I went, there were always warm-hearted and kind characters walking around, who left me with deep impression. I have also heard many news of their staff sparing every effort to help those visitors who need help. The reason I think it relaxing is: It is not only a theme park for me, instead, It is more like a place of joy and dream. In the park you can imagine yourself to be anyone you wish and no one will laugh at you even though you are no longer a child and you still want to be a princess. It is not built for children, but for everyone.\n\nPart3",tips:"💡 Part 2 话题卡：按 You should say 四点逐一展开；用具体人名/地点/事例支撑细节；注意时态一致，多用连接词(however / for example / therefore)串联。"} ,

  {q:"Is it good for children to learn arts?",title:"Part 3 范文",answer:"Personally, I think it's a good thing for children to learn art, but parents and teachers need to cultivate them according to their own interests, not compulsively. Art can effectively improve children's aesthetics and cultivate their sentiment. Although the process of learning art may not be comfortable, when children grow up, they wi ll have an additional skill that can relax and delight their body and mind. In conclusion, Art can help us better find the beauty in life.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Do you think leaders need to have creative ability?",title:"Part 3 范文",answer:"Of course, I think a good leader needs to be creative, because leaders have the resp onsibility to see the possible problems in the enterprise or team in advance and put forward innovative ideas from a strategic perspective, so as to correct the previous problems or avoid some mistakes. In addition, Creative leaders can lead enterprises an d teams to continuously develop new products and services, and even drive economic development.\n\n- 23 - 机智解决问题的人 Describe a person who offer a clever solution to a problem You should say: Who this person is What the problem was How he/she solved it And explain why you think he/she did it in a smart way",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Why do people always miss their childhood?",title:"Part 3 范文",answer:"I think it's because people were carefree in childhood, and we always have all kinds of troubles when we grow up. When people miss the past, they always beautify the past, and the troubles we have experienced are not important anymore. In short, most of what we remember is beautiful, troubles have not brought too much influence, and those beautiful things really remain in our hearts.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Are kids happier than adults? Why?",title:"Part 3 范文",answer:"Yes, I think so. in my opinion, kids' happiness is simple because, most of the time, they know exactly what they want and so they often end up having it. Besides, parents are always caring for their children's childhood. But when they grow up and become adults, they may have more complicated desires, and cannot always be fullfilled, therefore, adults may find the life is harder comparing to the one when they were kids.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do people still remember many of their friends from primary school?",title:"Part 3 范文",answer:"I think the friendship in primary school is very pure, and because there is no heavy homework and the pressure of entering higher education, friends will have more time to play together. People often miss their childhood, and\n\n- 30 - primary school friends are a big part of the childhood, so people will always remember their friends from primary school.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of primary school teachers will impress students?",title:"Part 3 范文",answer:"I think teachers who can lay a solid academic foundation for children and make the lessons interesting are the most influential teachers. Primary school is the place where children start to learn systematically. The teacher's teaching level and style often affect students' attitudes towards learning. Teachers who can make students correct their learning attitudes will impress a lot on students.\n\n- 31 - Part2&3 人物类（保留题） 喜欢的歌手或演员 Describe a person whose music or singing you like You should say: Who the person is How you knew about this person What music does he/she make or sing And explain why do you like his/her music or singing",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why kind old music do people like at different ages?",title:"Part 3 范文",answer:"For teenagers, they may favour intense music such as rock, heavy metal and electro music. This is mainly because people at this age tend to pursue excitement and music with strong beats helps them relieve stress. While for the old, they may prefer the music with gentle rhythm like jazz, soul and country music.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kind of music is popular in china now and what kind will be in the future?",title:"Part 3 范文",answer:"Well, I'm not quite sure about that but as far as I know, pop music seems to be the most popular genre in China among various age groups. In addition, folk music with simple lyrics and strong beats is favoured by middle -aged Chinese as the background music in square dancing. However, in recent years, TV shows about rappers have received much attention, so that rap songs might be increasingly popular in the future, especially among the young generation.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do Chinese parents require their children to learn to play musical instruments?",title:"Part 3 范文",answer:"Well, it's hard to say but as far as I know, from the people around me, many Chinese parents do require their children to have music classes to practice with musical instruments such as piano and violin and they tend to spend a large sum of money cultivating their children in this regard. For one, they may want to train their kids in music to help brain development as children's abilities to stay focused can be improved by playing musical instruments. For\n\n- 32 - another, some Chinese parents may wish that their kids can enter a contest and win prizes which mean certificates and medals, and these awards might benefit them later on.\n\nWhy do some people like to listen to live music while others prefer CDs？ Some people, youngsters in particular, may regard listening to live music as an important way to entertain themselves because they enjoy the live atmosphere, which is really stimulating.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is rap music accepted in your country?",title:"Part 3 范文",answer:"Yes, it's quite popular in China. In recent years, reality shows such as The Rap in China have gained increasingly attention among Chinese youngsters. They love rap music because the lyrics can be very engaging and can be spoken in a very common and young -oriented language. While for other age groups, especially the elderly, they may find it hard to appreciate this genre of music.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think holding international music events has value? Why?",title:"Part 3 范文",answer:"Yes, I do think so. There are many reasons for that. First of all, holding major music events can raise the profile of a city or a country, which can further result in economic benefits. On top of that, it can help broaden local people's mind as they would be expos ed to exotic cultures through music. Moreover, it can be regarded as long- term investment as holding such international events can boost local tourism and create more job opportunities.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What do you think making Chinese music not widely known?",title:"Part 3 范文",answer:"I think the most important factor lies in the language barrier, which makes Chinese music with Chinese lyrics harder to connect with international audience. On the other hand, some people may have misunderstandings about China and assume that Cpop is not cool or swag at all. Furthermore, Kpop is more popular because Korea exported the pop culture much earlier than other countries do. I do believe that in the near future, Chinese music will be widely known in the international arena.\n\n- 33 - 尊敬的老人 Describe someone who is older than you that you admire You should say: Who this person is How you know this person What he or she is like And explain why you respect this person\n\nI would like to talk about one old security guard in our neighborhood, who is really nice to everyone and has earned respect from us. One cold rainy day in winter holiday, I received a phone call which asked me to go do",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What qualities does a person need to take care of old people?",title:"Part 3 范文",answer:"One of the most important traits is patience, since some old people, especially those with poor memories or low level of mobility, need special care almost 24 hours a day. And I think carefulness also matters, since they need to notice old people’s condition changes and offer help as soon as possible.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think that old people should be taken care of at home?",title:"Part 3 范文",answer:"I think it depends. Some people are too busy to take good care of their parents so they have to send them to nursing home and let those professional workers to nurse them. However, there are also people who do not trust nursing homes and take good care of their own parents at home. In my opinion, parents are the ones who raised us when we were little, and when they became old, it is the time for us to repay.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How can people in the neighborhood help the elderly during the epidemic?",title:"Part 3 范文",answer:"First we can bring them necessities like food and common medicine since the priority is to ensure they get out as less as possible. And we can also help them buy masks to protect them from the epidemic since their immune system is weaker than us so they are easier to be sick. In addition, it is also a good method to give them our phone numbers so they can contact us if they need help.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Do you know anyone who likes to get up early?",title:"Part 3 范文",answer:"Someone in our family gets up very early. My grandparents wake up early every day because they only need six hours of sleep and they never stay up late. They usually get up at six o'clock every day, and then prepare breakfast for me before going for a walk in the park.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of occasions need people to arrive early?",title:"Part 3 范文",answer:"Well, there are lots of occasions need people to arrive early. In daily life, young people go to school or work very early every day. There are also many special circumstances such as catching an early flight, preparing for an exam and so on. In general, people will arrive early for occasions that they consider important.\n\n- 36 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do people get up early?",title:"Part 3 范文",answer:"I think this needs to be discussed on a case -by-case basis. The most common reason for young people to get up early is because they have to go to school or work. In a big city like Shanghai, people live in various parts of the city. It is very common for people to commute fo r an hour. So young people get up early to make sure they won't be late after commute for a long time. The elderly need shorter sleep time. For example, my grandparents can wake up naturally after only six hours of sleep a day, and since they never stay up late, they get up early too.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do people prefer to have meetings in the morning?",title:"Part 3 范文",answer:"In the morning before all work starts, people's brains will not feel particularly tired, so during the meeting is very suitable for brainstorming and come up with new idea s. If this is a problem -solving meeting, the proposed improvement methods can be implemented in one day's work. For those who work in multinational companies, morning meetings can allow them and colleagues far away on the other side of the earth to be in the daytime at the same time, which can achieve the purpose of remote collaboration.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of people like to stay up late?",title:"Part 3 范文",answer:"My mother often tells me that staying up late is because some people don’t have a fulfilling day, hoping to stay up late at night to take back the lost time. I agree with her. For people with insomnia, they are forced to stay up late because it is difficult for them to fall asleep before exhaustion. In addition, for those night owls, the time at night allows them to study or work more efficiently, and these people usually choose to stay up late as well.\n\n- 37 - 善待不喜欢的人 Describe a time you were friendly to someone you didn’t like. You should say: When and where it happened Who he/she was Why you didn’t like this person And explain why you were friendly to him/her on that occasion",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Do you think air pollution comes mostly from mobile vehicles?",title:"Part 3 范文",answer:"No, I don't think so. Indeed, air pollution can come from mobile vehicles, consuming gasoline, and releasing some carbon dioxide. However, mobile vehicles are not the domain reason. Factories can also be a large source of air pollution. For example, the waste gas and particulate matter emitted from printing, electronic, or rubber factories will cause more significant air pollution, affect the weather, and directly affect people's health.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
