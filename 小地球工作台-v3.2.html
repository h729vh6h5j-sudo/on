  {movie:'肖申克的救赎',line:'Hope is a good thing, maybe the best of things, and no good thing ever dies.',zh:'希望是美好的，也许是人间至善，而美好的事物永不消逝。'},
  {movie:'阿甘正传',line:'Life is like a box of chocolates. You never know what you\'re gonna get.',zh:'生活就像一盒巧克力，你永远不知道下一颗是什么味道。'},
  {movie:'星际穿越',line:'Love is the one thing we\'re capable of perceiving that transcends time and space.',zh:'爱是我们能感知的、唯一可以超越时空维度的东西。'},
  {movie:'千与千寻',line:'曾经发生过的事情不可能忘记，只是想不起来而已。',zh:''},
  {movie:'霸王别姬',line:'不疯魔，不成活。',zh:''},
  {movie:'这个杀手不太冷',line:'Is life always this hard, or is it just when you\'re a kid?',zh:'人生总是那么痛苦吗？还是只有小时候是这样？'},
  {movie:'楚门的世界',line:'In case I don\'t see you, good afternoon, good evening, and good night.',zh:'假如再也见不到你，祝你早安、午安、晚安。'},
  {movie:'当幸福来敲门',line:'You got a dream, you gotta protect it.',zh:'如果你有梦想，就要去捍卫它。'},
  {movie:'盗梦空间',line:'You\'re waiting for a train. A train that\'ll take you far away.',zh:'你在等一列火车，一列会带你远行的火车。'},
  {movie:'海上钢琴师',line:'I was born on this ship, and the world passed me by.',zh:'我生于这艘船，世界从我身边经过。'},
  {movie:'三傻大闹宝莱坞',line:'All is well.',zh:'一切皆好。'},
  {movie:'怦然心动',line:'Some of us get dipped in flat, some in satin, some in gloss. But every once in a while you find someone who\'s iridescent.',zh:'有人住高楼，有人在深沟，有人光万丈，有人一身锈，世人万千种，浮云莫去求，斯人若彩虹，遇上方知有。'},
  {movie:'熔炉',line:'我们一路奋战，不是为了改变世界，而是为了不让世界改变我们。',zh:''},
  {movie:'无间道',line:'往往都是事情改变人，人却改变不了事情。',zh:''},
  {movie:'大话西游',line:'曾经有一份真诚的爱情放在我面前，我没有珍惜……',zh:''}
];
const Mov={
  tab:'line', _file:null, _douban:DOUBAN_SEED.slice(), _live:false,
  recs(){return DB.get('mvRecs',[])}, save(r){DB.set('mvRecs',r)},
  grad(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;const a=h%360,b=(a+45)%360;return 'linear-gradient(135deg,hsl('+a+',68%,74%),hsl('+b+',72%,60%))'},
  render(){
    subnav('#mvSubnav',[['line','🎞️','每日台词'],['movie','🎬','观影记录']],this.tab,'Mov.tabTo');
    if(this.tab==='line')this.renderLine();
    if(this.tab==='movie')this.renderMovie();
  },
  tabTo(t){this.tab=t;this.render();},
  /* ---- 每日台词 ---- */
  renderLine(){
    const idx=this.dayIndex();const line=MOV_LINES[idx];
    $('#mvBody').innerHTML=
      '<div class="grid g-main-r"><div class="grid" style="gap:14px;align-content:start">'+
        '<div class="panel accent"><div class="hd"><i class="dot"></i><h3><span class="emo">🎞️</span>今日电影台词</h3><span class="tag">'+fmtCN(today())+'</span></div>'+
        '<div class="bd"><div style="font-size:20px;font-weight:800;color:var(--nerv);line-height:1.6;margin-bottom:12px">“'+esc(line.line)+'”</div>'+
        '<div class="mut" style="font-size:14px;margin-bottom:12px">'+esc(line.zh)+'</div>'+
        '<div style="text-align:right"><span class="pill" style="background:var(--nerv-dim);color:var(--nerv)">《'+esc(line.movie)+'》</span></div></div></div>'+
        '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">🎬</span>豆瓣每日电影</h3><span class="tag">DOUBAN</span><div class="sp"></div><div class="btn sm" onclick="Mov.refreshDouban()">🔄 刷新</div><div class="btn sm" onclick="Mov.douban()">🎲 换一批</div></div>'+
        '<div class="bd" id="mvDouban"></div></div>'+
      '</div>'+
      '<div class="grid" style="gap:14px;align-content:start">'+
        '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">📊</span>本月统计</h3><span class="tag">MONTHLY</span></div>'+
        '<div class="bd" id="mvMiniStat"></div></div>'+
      '</div></div>';
    this.renderDouban();this.renderMiniStat();
  },
  dayIndex(){let n=0;for(const c of today())n=(n*31+c.charCodeAt(0))>>>0;return n%MOV_LINES.length},
  renderDouban(){
    const list=this._douban.slice(0,12);
    const head=this._live?'<span class="mut" style="font-size:11px;margin-bottom:8px">🟢 实时豆瓣榜单</span>':'<span class="mut" style="font-size:11px;margin-bottom:8px">📌 豆瓣真实高分榜（点卡片看豆瓣页）</span>';
    $('#mvDouban').innerHTML=head+'<div class="mvwall">'+
      list.map((m,i)=>'<div class="mvc" onclick="Mov.go('+i+')">'+
        '<div class="cv" style="background:'+this.grad(m.t)+'"><span class="emo">'+(i%2?'🎬':'🍿')+'</span></div>'+
        '<div class="ct"><b>'+esc(m.t)+'</b>'+
        '<div class="cm"><span class="stars">★ '+m.r+'</span><span class="chip">'+esc(m.tag)+'</span></div>'+
        '<div class="acts"><span class="btn sm" onclick="event.stopPropagation();Mov.fromDouban('+i+')">加入片单</span></div></div></div>'
      ).join('')+'</div>';
  },
  douban(){this._douban=this._douban.sort(()=>Math.random()-0.5);this._live=false;this.renderDouban();toast('换了一批 🎞️');},
  async refreshDouban(){
    toast('正在从豆瓣拉取最新榜单…');
    const tags=['热门','最新','豆瓣高分','华语','喜剧','科幻'];const pick=tags[Math.floor(Math.random()*tags.length)];
    const url='https://movie.douban.com/j/search_subjects?type=movie&tag='+encodeURIComponent(pick)+'&sort=recommend&page_limit=20&page_start=0';
    const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(url);
    try{const res=await fetch(proxy);const j=await res.json();const d=JSON.parse(j.contents);const subs=d.subjects||[];if(!subs.length)throw new Error('empty');
      this._douban=subs.map(s=>({t:s.title,r:s.rate||'',u:s.url,c:s.cover,tag:pick}));this._live=true;this.renderDouban();toast('已更新豆瓣「'+pick+'」榜单 🎬');
    }catch(e){this._live=false;toast('联网失败，显示内置真实榜单','err');}
  },
  go(i){const m=this._douban[+i];if(m&&m.u)window.open(m.u,'_blank');},
  fromDouban(i){const m=this._douban[+i];if(this.tab!=='movie')this.tabTo('movie');setTimeout(()=>{$('#mvName').value=m.t;$('#mvDate').value=today();if(m.r)$('#mvRate').value=String(Math.round(+m.r));toast('已填入观影记录');},50);},
  /* ---- 观影记录 ---- */
  renderMovie(){
    $('#mvBody').innerHTML=
      '<div class="grid g3" style="margin-bottom:14px" id="mvKpi"></div>'+
      '<div class="grid g-main-r"><div class="grid" style="gap:14px;align-content:start">'+
        '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">➕</span>添加观影记录</h3><span class="tag">NEW</span></div>'+
        '<div class="bd"><div class="row" style="margin-bottom:9px"><div style="flex:1;min-width:120px"><label class="lbl">片名</label><input class="ipt" id="mvName" placeholder="影片 / 剧集"></div>'+
        '<div style="width:140px"><label class="lbl">日期</label><input type="date" class="ipt" id="mvDate" value="'+today()+'"></div></div>'+
        '<div class="row" style="margin-bottom:9px"><div style="flex:1;min-width:100px"><label class="lbl">类别</label><select class="sel" id="mvKind">'+MV_KINDS.map(k=>'<option>'+k+'</option>').join('')+'</select></div>'+
        '<div style="flex:1;min-width:100px"><label class="lbl">题材</label><select class="sel" id="mvGenre">'+MV_GENRES.map(g=>'<option>'+g+'</option>').join('')+'</select></div>'+
        '<div style="width:90px"><label class="lbl">评分</label><select class="sel" id="mvRate"><option>5</option><option>4.5</option><option selected>4</option><option>3.5</option><option>3</option><option>2</option><option>1</option></select></div>'+
        '<div style="width:90px"><label class="lbl">时长(分)</label><input type="number" class="ipt" id="mvDur" value="90" min="1"></div></div>'+
        '<div class="fld"><label class="lbl">短评</label><textarea class="ta" id="mvNote" style="min-height:54px" placeholder="一句话观后感"></textarea></div>'+
        '<div class="row"><label class="btn" style="cursor:pointer">🖼️ 上传海报<input type="file" accept="image/*" id="mvFile" hidden onchange="Mov.pick(this)"></label><span class="mut" id="mvFileName">未选择</span><div id="mvPosterPrev"></div><div class="sp"></div><div class="btn pri" onclick="Mov.add()">保存</div></div></div></div>'+
        '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">📈</span>本月统计</h3><span class="tag">MONTHLY</span><div class="sp"></div><input type="month" class="ipt" id="mvMonth" style="width:150px;padding:4px 8px" value="'+today().slice(0,7)+'" onchange="Mov.renderMovie()"></div>'+
        '<div class="bd" id="mvStat"></div></div>'+
      '</div>'+
      '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">🎬</span>片单墙</h3><span class="tag" id="mvCount"></span><div class="sp"></div><input class="ipt" id="mvSearch" placeholder="搜索" style="width:120px;padding:4px 9px" oninput="Mov.renderGrid()">'+
        '<div class="vw-toggle" style="margin-left:6px"><span class="'+(DB.get('mv_mode','grid')==='grid'?'on':'')+'" onclick="Mov.setMode(\'grid\')">⊞ 网格</span><span class="'+(DB.get('mv_mode','grid')==='list'?'on':'')+'" onclick="Mov.setMode(\'list\')">☰ 列表</span></div></div>'+
        '<div class="bd"><div id="mvGrid"></div></div></div></div>';
    this.kpi();this.renderStat();this.renderGrid();
  },
  kpi(){
    const r=this.recs();const ym=today().slice(0,7);const m=r.filter(x=>x.date.slice(0,7)===ym);
    const mins=r.reduce((a,x)=>a+(+x.dur||0),0);
    $('#mvKpi').innerHTML=kpi([
      {emo:'🎬',v:r.length,k:'总观影'},{emo:'⏳',v:mins,k:'总分钟'},{emo:'📅',v:m.length,k:'本月'},{emo:'⭐',v:m.length?Math.round(m.reduce((a,x)=>a+x.rate,0)/m.length*10)/10:0,k:'本月均分'}
    ]);
  },
  pick(f){const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{Mov._file=rd.result;$('#mvFileName').textContent=file.name;
    const pv=$('#mvPosterPrev');if(pv)pv.innerHTML='<img src="'+rd.result+'" alt="" style="width:38px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;margin-left:6px" onclick="lightbox(this.src,\'海报预览\')">';
  };rd.readAsDataURL(file);},
  async add(){
    const name=$('#mvName').value.trim();if(!name){toast('填个片名','err');return}
    const id=uid();let poster='';
    if(Mov._file){await IDB.put('mv_'+id,Mov._file);poster='mv_'+id;Mov._file=null;$('#mvFileName').textContent='未选择'}
    const r=this.recs();r.push({id,date:$('#mvDate').value||today(),name,kind:$('#mvKind').value,genre:$('#mvGenre').value,rate:+$('#mvRate').value,dur:+$('#mvDur').value,note:$('#mvNote').value.trim(),poster});
    this.save(r);$('#mvName').value='';$('#mvNote').value='';this.kpi();this.renderStat();this.renderGrid();toast('已记录 🎬');
  },
  renderStat(){
    const ym=$('#mvMonth').value||today().slice(0,7);const r=this.recs().filter(x=>x.date.slice(0,7)===ym);
    const movie=r.filter(x=>x.kind==='电影').length, tv=r.filter(x=>x.kind==='剧集').length;
    const avg=r.length?Math.round(r.reduce((a,x)=>a+x.rate,0)/r.length*10)/10:0;
    const mins=r.reduce((a,x)=>a+(+x.dur||0),0);
    const byG={};r.forEach(x=>byG[x.genre]=(byG[x.genre]||0)+1);
    const rows=Object.keys(byG).map(k=>({k,v:byG[k],c:'var(--nerv)'}));
    $('#mvStat').innerHTML=kpi([{emo:'🎬',v:movie,k:'电影'},{emo:'📺',v:tv,k:'剧集'},{emo:'⭐',v:avg,k:'均分'},{emo:'⏳',v:mins,k:'分钟'}])+
      (rows.length?'<hr class="hr"><div class="mut" style="margin-bottom:5px">按题材</div>'+pieChart(rows):'<div class="mut" style="margin-top:8px">'+ym+' 还没有记录</div>');
  },
  setMode(m){DB.set('mv_mode',m);this.renderMovie();},
  renderGrid(){
    const q=$('#mvSearch').value.trim().toLowerCase();const r=this.recs().slice().reverse().filter(x=>!q||x.name.toLowerCase().includes(q));
    const mode=DB.get('mv_mode','grid');
    $('#mvCount').textContent=r.length+' 部';
    if(!r.length){$('#mvGrid').innerHTML=emptyBox('片单墙空空，添加你看过的片子吧','🎬');return}
    if(mode==='list'){
      $('#mvGrid').innerHTML='<div class="mv-list">'+r.map(x=>
        '<div class="mv-row" onclick="Mov.open(\''+x.id+'\')"><div class="po" id="mvph_'+x.id+'">'+(x.poster?'':'🎬')+'</div>'+
        '<div class="mi"><b>'+esc(x.name)+'</b><p>'+x.date+' · '+x.kind+' · '+x.genre+' · '+x.dur+'分'+(x.note?' · '+esc(x.note.slice(0,20)):'')+'</p></div>'+
        '<span class="stars" style="flex:none">★'+x.rate+'</span></div>').join('')+'</div>';
    }else{
      $('#mvGrid').innerHTML='<div class="cards">'+r.map(x=>
        '<div class="mv" onclick="Mov.open(\''+x.id+'\')"><div class="ph" id="mvph_'+x.id+'">'+(x.poster?'':'<span class="emo">🎬</span>')+'</div>'+
        '<div class="in"><b>'+esc(x.name)+'</b><div class="m"><span>'+x.date+'</span><span class="stars">★'+x.rate+'</span></div>'+
        '<div class="mut" style="font-size:10px">'+x.kind+' · '+x.genre+' · '+x.dur+'分</div></div></div>').join('')+'</div>';
    }
    r.filter(x=>x.poster).forEach(async x=>{const el=$('#mvph_'+x.id);if(el&&!el.querySelector('img')){const d=await IDB.get(x.poster);if(d){el.innerHTML='<img src="'+d+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px">';el.style.cursor='zoom-in';el.onclick=(ev)=>{ev.stopPropagation();lightbox(d,x.name);}}}});
  },
  open(id){const x=this.recs().find(y=>y.id===id);if(!x)return;
    App.modal({title:x.name,emo:'🎬',noFoot:true,html:
      '<div style="font-size:12.5px;color:var(--tx-2);line-height:1.8">'+
      (x.poster?'<div id="mvBigPoster" style="margin-bottom:10px"></div>':'')+
      '<div>📅 '+x.date+' · <b>'+x.kind+'</b> · '+x.genre+' · <span class="stars">★'+x.rate+'</span> · '+x.dur+'分</div>'+
      (x.note?'<div style="margin-top:8px">💬 '+esc(x.note)+'</div>':'')+
      '<div class="row" style="margin-top:12px"><div class="btn sm dgr" onclick="Mov.del(\''+x.id+'\')">删除这条</div></div></div>'});
    if(x.poster)IDB.get(x.poster).then(d=>{const el=$('#mvBigPoster');if(el&&d)el.innerHTML='<img src="'+d+'" alt="" style="width:120px;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)" onclick="lightbox(this.src,\''+esc(x.name).replace(/'/g,'')+'\')"><div class="mut" style="font-size:10px;margin-top:4px">点击海报可放大预览</div>'});
  },
  del(id){App.confirm('删除这条观影记录？',async()=>{const x=this.recs().find(y=>y.id===id);if(x&&x.poster)await IDB.del(x.poster);DB.set('mvRecs',this.recs().filter(y=>y.id!==id));this.kpi();this.renderStat();this.renderGrid();});},
  renderMiniStat(){
    const ym=today().slice(0,7);const r=this.recs().filter(x=>x.date.slice(0,7)===ym);
    $('#mvMiniStat').innerHTML=kpi([{emo:'🎬',v:r.length,k:'观影'},{emo:'⏳',v:r.reduce((a,x)=>a+(+x.dur||0),0),k:'分钟'}]);
  }
};
RENDER.movie=()=>Mov.render();
</script>

<script>
/* ==================================================================
   08 · 读书日志（参考用户截图优化版）
   含：阅读记录(时间联动) · 摘抄 · 漫画计划
   ================================================================== */

const Book={
  tab:'reading',

  init(){
    if(!DB.get('books',null)){
      DB.set('books',[]);
    }else{
      /* 自动清理旧演示数据 */
      const books=DB.get('books',[]).filter(b=>!['纳瓦尔宝典','小狗钱钱'].includes(b.title));
      DB.set('books',books);
    }
    if(!DB.get('book_records',null))DB.set('book_records',[]);
    if(!DB.get('book_excerpts',null))DB.set('book_excerpts',[]);
    if(!DB.get('book_manga',null))DB.set('book_manga',[]);
  },

  render(){
    this.init();
    subnav('#bookSubnav',[['reading','📖','正在读'],['excerpts','✏️','摘抄'],['manga','📚','漫画']],this.tab,'Book.tabTo');
    if(this.tab==='reading')this.renderReading();
    else if(this.tab==='excerpts')this.renderExcerpts();
    else if(this.tab==='manga')this.renderManga();
      },
  tabTo(t){this.tab=t;this.render();},

  /* ============ 正在读（参考图2风格） ============ */
  renderReading(){
    const books=DB.get('books',[]);
    const reading=books.filter(b=>b.status==='reading');
    const done=books.filter(b=>b.status==='done');
    const want=books.filter(b=>b.status==='want');

    /* 主统计 */
    $('#bookBody').innerHTML=
      '<div class="greet">📖 <b>阅读计划</b> · 坚持就是力量</div>'+

      /* 统计卡片（参考图2） */
      '<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">'+
        '<div style="flex:1;min-width:100px;background:var(--nerv);color:#fff;border-radius:16px;padding:16px;text-align:center">'+
          '<div style="font-size:32px;font-weight:900">'+reading.length+'</div><div style="font-size:11px;opacity:.9;margin-top:4px">阅读中</div>'+
        '</div>'+
        '<div style="flex:1;min-width:100px;background:var(--accent-mint);color:#fff;border-radius:16px;padding:16px;text-align:center">'+
          '<div style="font-size:32px;font-weight:900">'+done.length+'</div><div style="font-size:11px;opacity:.9;margin-top:4px">已读完</div>'+
        '</div>'+
        '<div style="flex:1;min-width:100px;background:var(--accent-peach);color:#fff;border-radius:16px;padding:16px;text-align:center">'+
          '<div style="font-size:32px;font-weight:900">'+want.length+'</div><div style="font-size:11px;opacity:.9;margin-top:4px">待阅读</div>'+
        '</div>'+
      '</div>'+

      /* 正在阅读列表 */
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
        '<span style="font-size:14px;font-weight:800;color:var(--nerv)">📖 正在阅读 ('+reading.length+')</span>'+
        '<div class="btn pri sm" onclick="Book.addBook(\'reading\')">➕ 添加在读书</div>'+
      '</div>'+
      (reading.length?reading.map(b=>
        '<div class="panel" style="margin-bottom:12px"><div class="bd" style="padding:18px">'+
          '<div style="display:flex;gap:14px;align-items:start">'+
            '<div style="width:56px;height:76px;border-radius:12px;background:'+b.cover+';display:grid;place-items:center;color:#fff;font-size:24px;flex:none">📖</div>'+
            '<div style="flex:1;min-width:0">'+
              '<h4 style="margin:0 0 4px">'+esc(b.title)+'</h4>'+
              '<p style="font-size:12px;color:var(--tx-3);margin:0 0 8px">'+esc(b.author||'佚名')+'</p>'+
              '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
                '<span style="font-size:11px;color:var(--tx-3)">'+Math.round(b.total*b.progress/100)+'/'+b.total+'页</span>'+
                '<span style="font-size:11px;font-weight:700;color:var(--nerv)">'+b.progress+'%</span>'+
              '</div>'+
              '<div class="prog" style="height:8px"><i style="width:'+b.progress+'%;background:'+b.cover+'"></i></div>'+
            '</div>'+
            '<div style="display:flex;flex-direction:column;gap:5px;flex:none">'+
              '<div class="btn sm" onclick="Book.editBook(\''+b.id+'\')">✏️ 编辑</div>'+
              '<div class="btn sm dgr" onclick="Book.delBook(\''+b.id+'\')">🗑 删除</div>'+
            '</div>'+

  logRead(bookId){
    const pageInput=$('#page_'+bookId);
    const minsInput=$('#mins_'+bookId);
    const page=parseInt(pageInput?.value)||0;
    const mins=parseInt(minsInput?.value)||30;

    if(page<=0){toast('输入有效页数','err');return}

    const books=DB.get('books',[]);
    const book=books.find(b=>b.id===bookId);
    if(!book)return;

    /* 更新进度 */
    book.progress=Math.min(Math.round(page/book.total*100),100);
    if(book.progress>=100)book.status='done';
    DB.set('books',books);

    /* 记录阅读历史 */
    const records=DB.get('book_records',[]);
    records.unshift({
      id:uid(),
      bookId:bookId,
      bookTitle:book.title,
      pageFrom:Math.max(1,page-mins*2)||1,
      pageTo:page,
      mins:mins,
      status:'reading',
      date:today()
    });
    DB.set('book_records',records.slice(-200));

    pageInput.value='';
    toast('阅读已记录 📖 +'+mins+'分钟');
    this.renderReading();
  },
  finishBook(bookId){
    const books=DB.get('books',[]);
    const book=books.find(b=>b.id===bookId);
    if(book){book.status='done';book.progress=100;book.finishDate=today();DB.set('books',books)}
    toast('🎉 恭喜读完！');this.renderReading();
  },

  /* ============ 阅读记录 ============ */
  /* 时间段范围工具：返回 {from,to} */
  rangeOf(preset){
    const t=new Date();const to=ymd(t);let from=to;
    if(preset==='week'){const d=new Date();d.setDate(d.getDate()-6);from=ymd(d)}
    else if(preset==='month'){const d=new Date();d.setDate(d.getDate()-29);from=ymd(d)}
    else if(preset==='year'){const d=new Date();d.setDate(d.getDate()-364);from=ymd(d)}
    else if(preset==='all'){from='2000-01-01'}
    return {from,to};
  },
  recRange(){return DB.get('book_rec_range',{preset:'month',from:'',to:''})},
  setRecRange(preset){
    const r=this.recRange();r.preset=preset;
    if(preset!=='custom'){const g=this.rangeOf(preset);r.from=g.from;r.to=g.to}
    DB.set('book_rec_range',r);this.renderRecords();
  },
  setRecCustom(){
    const r=this.recRange();r.preset='custom';
    r.from=$('#brFrom').value||r.from;r.to=$('#brTo').value||r.to;
    DB.set('book_rec_range',r);this.renderRecords();
  },

      '<span style="font-size:14px;font-weight:800;color:var(--nerv)">⏱️ 阅读记录</span>'+
      '<div class="btn pri sm" onclick="Book.addRecord()">➕ 添加阅读记录</div></div>'+
      '<div class="panel" style="margin-bottom:14px"><div class="bd"><div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">'+
        '<div class="vw-toggle">'+presets.map(p=>'<span class="'+(rg.preset===p[0]?'on':'')+'" onclick="Book.setRecRange(\''+p[0]+'\')">'+p[1]+'</span>').join('')+'</div>'+
        '<span class="mut" style="margin-left:4px">自定义</span>'+
        '<input type="date" class="ipt" id="brFrom" value="'+rg.from+'" style="width:auto;padding:4px 8px" onchange="Book.setRecCustom()">'+
        '<span class="mut">→</span>'+
        '<input type="date" class="ipt" id="brTo" value="'+rg.to+'" style="width:auto;padding:4px 8px" onchange="Book.setRecCustom()">'+
      '</div><hr class="hr">'+
      kpi([{emo:'📖',v:records.length,k:'次阅读'},{emo:'⏳',v:totalMins,k:'总分钟'},{emo:'📚',v:books.size,k:'本书'},{emo:'📅',v:days.size,k:'天有读'}])+
      '</div></div>';

    const dates=Object.keys(byDate).sort().reverse();
    if(!dates.length){
      html+=emptyBox('这个时间段还没有阅读记录，点「➕ 添加阅读记录」记一笔','⏱️');
    }else{
      dates.forEach(date=>{
        const items=byDate[date];
        const mins=items.reduce((a,r)=>a+(+r.mins||0),0);
        html+='<div class="panel" style="margin-bottom:10px"><div class="hd"><i class="dot"></i><h3><span class="emo">📆</span>'+fmtCN(date)+'</h3>'+
          '<span class="tag">'+items.length+' 次 · '+mins+' 分钟</span></div><div class="bd" style="padding:6px 12px">'+
          items.map(r=>{
            const st=r.status||'reading';
            return '<div style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)">'+
              '<div style="width:44px;height:44px;border-radius:11px;background:var(--nerv-dim);color:var(--nerv);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none">'+(+r.mins||0)+'<span style="font-size:8px">min</span></div>'+
              '<div style="flex:1;min-width:0">'+
                '<b style="font-size:12.5px;display:block">'+esc(r.bookTitle||'未命名')+'</b>'+
                '<span class="mut" style="font-size:10.5px">'+
                  (r.startT&&r.endT?'🕐 '+r.startT+'–'+r.endT+' · ':'')+
                  (r.pageTo?'第 '+(r.pageFrom||'?')+'–'+r.pageTo+' 页':'未记页数')+
                  (r.note?' · 💬 '+esc(r.note):'')+

                '<span class="chip'+(st==='reading'?' on':'')+'" style="cursor:pointer" onclick="Book.setRecStatus(\''+r.id+'\',\'reading\')" title="标记在读">📖在读</span>'+
                '<span class="btn sm" style="padding:3px 8px;font-size:10px" onclick="Book.editRecord(\''+r.id+'\')">✏️</span>'+

    }
    return html;
  },
  /* 阅读记录状态（读完/在读）切换，并联动阅读计划一览 */
  setRecStatus(id,st){
    const rs=DB.get('book_records',[]);const r=rs.find(x=>x.id===id);if(!r)return;
    r.status=st;DB.set('book_records',rs);
    this.syncBookStatus(r.bookTitle,st,r.pageTo);
    this.renderReading();toast(st==='done'?'已标记读完 📗（已同步阅读计划）':'标记在读 📖');
  },
  /* 同步书籍状态（读完=done+进度100；在读=保持 reading 并按页码更新进度） */
  syncBookStatus(title,st,pageTo){
    const books=DB.get('books',[]);const b=books.find(x=>x.title===title);if(!b)return;
    b.status=st;
    if(st==='done')b.progress=100;
    else if(pageTo)b.progress=Math.min(100,Math.round(+pageTo/(b.total||300)*100));
    DB.set('books',books);
  },
  bookOpts(){
    const bs=DB.get('books',[]).map(b=>b.title);
    return bs.length?bs:['（书架还没有书）'];
  },
  minsBetween(s,e){
    if(!s||!e)return 0;
    const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
    let d=(eh*60+em)-(sh*60+sm);if(d<0)d+=1440;return d;
  },
  addRecord(){
    App.modal({title:'添加阅读记录',emo:'⏱️',fields:[
      {k:'date',label:'日期',type:'date',value:today()},

      {k:'pageTo',label:'结束页',type:'number',ph:'可选'},

    }});

  renderManga(){
    const data=DB.get('book_manga',[]);

    const done=data.filter(m=>m.status==='done');
    const rg=this.mgRange();
    if(!rg.from||!rg.to){const g=this.rangeOf(rg.preset||'month');rg.from=g.from;rg.to=g.to}
    const recs=DB.get('manga_records',[]).filter(r=>r.date>=rg.from&&r.date<=rg.to).sort((a,b)=>b.date<a.date?-1:1);
    const mins=recs.reduce((a,r)=>a+(+r.mins||0),0);
    const presets=[['week','近7天'],['month','近30天'],['year','近一年'],['all','全部']];

    const byDate={};recs.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(r)});

    $('#bookBody').innerHTML=
      '<div class="greet">📚 <b>漫画计划 & 阅读记录</b> · 追番也是正经事</div>'+

      /* 三态总览统计卡（参照阅读页面） */
      '<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">'+
        '<div style="flex:1;min-width:100px;background:var(--nerv);color:#fff;border-radius:16px;padding:16px;text-align:center">'+
          '<div style="font-size:32px;font-weight:900">'+reading.length+'</div><div style="font-size:11px;opacity:.9;margin-top:4px">在读</div>'+
        '</div>'+
        '<div style="flex:1;min-width:100px;background:var(--accent-mint);color:#fff;border-radius:16px;padding:16px;text-align:center">'+
          '<div style="font-size:32px;font-weight:900">'+done.length+'</div><div style="font-size:11px;opacity:.9;margin-top:4px">已读完</div>'+
        '</div>'+
        '<div style="flex:1;min-width:100px;background:var(--accent-peach);color:#fff;border-radius:16px;padding:16px;text-align:center">'+
          '<div style="font-size:32px;font-weight:900">'+want.length+'</div><div style="font-size:11px;opacity:.9;margin-top:4px">待阅读</div>'+
        '</div>'+
      '</div>'+

      /* 漫画阅读记录（时间段） */
      '<div class="panel" style="margin-bottom:14px"><div class="hd"><i class="dot"></i><h3><span class="emo">⏱️</span>漫画阅读记录</h3><span class="tag">RANGE</span><div class="sp"></div>'+
      '<div class="btn sm pri" onclick="Book.addMangaRec()">➕ 添加记录</div></div>'+
      '<div class="bd"><div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">'+
        '<div class="vw-toggle">'+presets.map(p=>'<span class="'+(rg.preset===p[0]?'on':'')+'" onclick="Book.setMgRange(\''+p[0]+'\')">'+p[1]+'</span>').join('')+'</div>'+
        '<span class="mut" style="margin-left:4px">自定义</span>'+
        '<input type="date" class="ipt" id="mgFrom" value="'+rg.from+'" style="width:auto;padding:4px 8px" onchange="Book.setMgCustom()">'+
        '<span class="mut">→</span>'+
        '<input type="date" class="ipt" id="mgTo" value="'+rg.to+'" style="width:auto;padding:4px 8px" onchange="Book.setMgCustom()">'+
      '</div><hr class="hr">'+
      kpi([{emo:'📖',v:recs.length,k:'次阅读'},{emo:'⏳',v:mins,k:'总分钟'},{emo:'📚',v:new Set(recs.map(r=>r.title)).size,k:'部漫画'}])+
      (Object.keys(byDate).length?'<hr class="hr">'+Object.keys(byDate).sort().reverse().map(d=>
        '<div style="margin-bottom:8px"><div class="mut" style="font-size:11px;font-weight:700;margin-bottom:4px">'+fmtCN(d)+'</div>'+
          byDate[d].map(r=>
            '<div style="display:flex;align-items:center;gap:6px;padding:7px 2px;border-bottom:1px solid var(--line)">'+
              '<div style="width:38px;height:38px;border-radius:10px;background:var(--nerv-dim);color:var(--nerv);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none">'+(+r.mins||0)+'<span style="font-size:7px">min</span></div>'+
              '<div style="flex:1;min-width:0"><b style="font-size:12px;display:block">'+(r.emoji||'📚')+' '+esc(r.title||'')+'</b>'+
              '<span class="mut" style="font-size:10px">'+(r.startT&&r.endT?'🕐 '+r.startT+'–'+r.endT+' · ':'')+(r.chapters?'第 '+esc(r.chapters)+' 话':'')+(r.note?' · '+esc(r.note):'')+'</span></div>'+
              '<div style="display:flex;gap:4px;flex:none;align-items:center">'+
                '<span class="chip'+(r.status==='unread'?' on':'')+'" style="cursor:pointer" onclick="Book.setMangaRecStatus(\''+r.id+'\',\'unread\')" title="标记未读">📭未读</span>'+
                '<span class="chip'+(r.status==='reading'||!r.status?' on':'')+'" style="cursor:pointer" onclick="Book.setMangaRecStatus(\''+r.id+'\',\'reading\')" title="标记在读">📖在读</span>'+
                '<span class="chip'+(r.status==='done'?' on':'')+'" style="cursor:pointer" onclick="Book.setMangaRecStatus(\''+r.id+'\',\'done\')" title="标记读完">✓读完</span>'+
                '<span class="btn sm" style="padding:3px 7px;font-size:10px" onclick="Book.editMangaRec(\''+r.id+'\')">✏️</span>'+
                '<span class="btn sm dgr" style="padding:3px 7px;font-size:10px" onclick="Book.delMangaRec(\''+r.id+'\')">🗑</span>'+
              '</div>'+
            '</div>').join('')+'</div>').join('')
        :'<div class="mut" style="margin-top:8px">这个时间段还没有漫画记录</div>')+
      '</div></div>'+

      /* 漫画书架 */
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
        '<span style="font-size:14px;font-weight:800;color:var(--nerv)">📚 漫画书架 ('+data.length+')</span>'+
        '<div class="btn pri sm" onclick="Book.addManga()">➕ 添加漫画</div>'+
      '</div>'+
      '<div class="grid g2">'+
        (data.map(m=>{
          const status=m.status==='done'?'✅ 已读完':m.status==='reading'?'📖 在读':'📋 待读';
          return '<div class="panel"><div class="bd" style="text-align:center;padding:20px">'+
            '<div style="font-size:48px;margin-bottom:10px">'+(m.emoji||'📚')+'</div>'+
            '<b style="display:block;font-size:14px">'+esc(m.title)+'</b>'+
            '<p style="font-size:11px;color:var(--tx-3);margin:4px 0">'+esc(m.author||'')+'</p>'+
            '<span class="pill" style="margin:8px 0">'+status+'</span>'+
            (m.status==='reading'&&m.progress?'<div class="prog" style="margin:8px auto;max-width:150px"><i style="width:'+m.progress+'%"></i></div>':'')+
            '<div style="display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap">'+
              '<div class="btn sm pri" onclick="Book.addMangaRec(\''+esc(m.title).replace(/'/g,'')+'\')">⏱️ 记一次</div>'+
              '<div class="btn sm" onclick="Book.editManga(\''+m.id+'\')">编辑</div>'+
              '<div class="btn sm dgr" onclick="Book.delManga(\''+m.id+'\')">删除</div>'+
            '</div>'+
          '</div></div>';
        }).join('')||emptyBox('还没有漫画计划，点「➕ 添加漫画」','📚'))+
      '</div>';
  },
  mangaOpts(){const d=DB.get('book_manga',[]).map(m=>m.title);return d.length?d:['（书架还没有漫画）']},
  addMangaRec(preTitle){
    const opts=this.mangaOpts();
    App.modal({title:'添加漫画记录',emo:'⏱️',fields:[
      {k:'date',label:'日期',type:'date',value:today()},
      {k:'title',label:'看的漫画',type:'select',opts:opts,value:preTitle&&opts.includes(preTitle)?preTitle:opts[0]},
      {k:'startT',label:'开始时间',type:'time',value:'21:00'},
      {k:'endT',label:'结束时间',type:'time',value:'21:30'},
      {k:'mins',label:'本次时长(分钟，留空自动算)',type:'number',ph:'自动'},
      {k:'chapters',label:'看到第几话',ph:'如 12-18'},
      {k:'status',label:'状态',type:'select',opts:['unread','reading','done'],value:'reading'},
      {k:'note',label:'一句话感受',ph:'可选'}
    ],onOk:v=>{
      const mins=+v.mins||this.minsBetween(v.startT,v.endT);
      if(!mins){toast('填一下时长或起止时间','err');return false}
      const m=DB.get('book_manga',[]).find(x=>x.title===v.title);
      const rs=DB.get('manga_records',[]);
      rs.push({id:uid(),date:v.date||today(),title:v.title,emoji:m?m.emoji:'📚',startT:v.startT||'',endT:v.endT||'',mins,chapters:v.chapters||'',status:v.status||'reading',note:v.note||''});
      DB.set('manga_records',rs);if(typeof Daily!=='undefined')Daily.notifySync('漫画');this.renderManga();toast('已记录 📚 +'+mins+' 分钟');
    }});
  },
  editMangaRec(id){
    const rs=DB.get('manga_records',[]);const r=rs.find(x=>x.id===id);if(!r)return;
    App.modal({title:'编辑漫画记录',emo:'✏️',fields:[
      {k:'date',label:'日期',type:'date',value:r.date},
      {k:'title',label:'漫画名',value:r.title},
      {k:'startT',label:'开始时间',type:'time',value:r.startT||''},
      {k:'endT',label:'结束时间',type:'time',value:r.endT||''},
      {k:'mins',label:'时长(分钟)',type:'number',value:String(r.mins||0)},
      {k:'chapters',label:'看到第几话',value:r.chapters||''},
      {k:'status',label:'状态',type:'select',opts:['unread','reading','done'],value:r.status||'reading'},
      {k:'note',label:'感受',value:r.note||''}
    ],onOk:v=>{
      r.date=v.date||r.date;r.title=v.title||r.title;r.startT=v.startT||'';r.endT=v.endT||'';
      r.mins=+v.mins||this.minsBetween(v.startT,v.endT)||r.mins;r.chapters=v.chapters||'';r.note=v.note||'';
      r.status=v.status||r.status||'reading';
      DB.set('manga_records',rs);
      const ms=DB.get('book_manga',[]);const m=ms.find(x=>x.title===r.title);
      if(m){m.status=r.status;if(r.status==='done')m.progress=100;DB.set('book_manga',ms);}
      this.renderManga();toast('已保存');
    }});
  },
  delMangaRec(id){
    App.confirm('删除这条漫画记录？',()=>{
      DB.set('manga_records',DB.get('manga_records',[]).filter(x=>x.id!==id));this.renderManga();toast('已删除');
    });
  },
  /* 漫画阅读记录状态（未读/在读/读完）切换，并联动漫画书架 */
  setMangaRecStatus(id,st){
    const rs=DB.get('manga_records',[]);const r=rs.find(x=>x.id===id);if(!r)return;
    r.status=st;DB.set('manga_records',rs);
    const ms=DB.get('book_manga',[]);const m=ms.find(x=>x.title===r.title);
    if(m){m.status=st;if(st==='done')m.progress=100;DB.set('book_manga',ms);}
    this.renderManga();
    toast(st==='done'?'已标记读完 📗（已同步漫画书架）':st==='unread'?'已标记未读 📭':'标记在读 📖');
  },
  addManga(){
    App.modal({title:'添加漫画',emo:'📚',fields:[
      {k:'title',label:'漫画名'},{k:'author',label:'作者'},
      {k:'emoji',label:'图标emoji',ph:'📚'},
      {k:'status',label:'状态',type:'select',opts:['want','reading','done']}
    ],onOk:v=>{if(!v.title)return false;const d=DB.get('book_manga',[]);d.push({id:uid(),title:v.title,author:v.author,emoji:v.emoji||'📚',status:v.status||'want',progress:0});DB.set('book_manga',d);this.renderManga();toast('已添加')}});
  },
  editManga(id){const d=DB.get('book_manga',[]);const x=d.find(a=>a.id===id);if(!x)return;
    App.modal({title:'编辑漫画',emo:'✏️',fields:[
      {k:'title',label:'标题',value:x.title},{k:'author',label:'作者',value:x.author},
      {k:'emoji',label:'图标',value:x.emoji},{k:'status',label:'状态',type:'select',opts:['want','reading','done'],value:x.status}
    ],onOk:v=>{Object.assign(x,v);DB.set('book_manga',d);this.renderManga()}});
  },
  delManga(id){DB.set('book_manga',DB.get('book_manga',[]).filter(x=>x.id!==id));this.renderManga()},

};

RENDER.book=()=>Book.render();
</script>

<script>
/* ==================================================================
   09 · 灵感库 v3.2 大改版
   包含：选题灵感 | 爆款二创 | 内容复盘 | 内容文案
   + 抖音热点爬虫接口 + AI优化建议
   ================================================================== */

const Idea={
  tab:'topics',

  /* ============ 数据初始化 ============ */
  init(){
    if(!DB.get('idea_topics',null)){
      DB.set('idea_topics',[
        {id:uid(),title:'当代大学生的崩溃瞬间vlog',type:'选题',note:'用反差剪辑，开头3秒放最炸的镜头',tags:['校园','vlog','共鸣'],date:today(),status:'idea'},
        {id:uid(),title:'把日语语法讲成「渣男语录」',type:'选题',note:'拟人化记忆点，适合JapanesePod联动',tags:['教学','创意'],date:today(),status:'idea'},
        {id:uid(),title:'低饱和+顶光=电影感调色教程',type:'选题',note:'参考影视飓风风格',tags:['剪辑','教程'],date:today(),status:'idea'}
      ]);
    }
    if(!DB.get('idea_viral',null)){
      DB.set('idea_viral',[
        {id:uid(),platform:'抖音',origTitle:'【热门】办公室生存指南',myTitle:'高校学工版·办公室生存指南',adaptNote:'把职场场景换成辅导员办公室场景，加入学生视角的吐槽',tags:['二创','校园','搞笑'],date:today()},
        {id:uid(),platform:'B站',origTitle:'【百万播放】一天只吃便利店',myTitle:'大学生挑战：一周只吃食堂最低消费',adaptNote:'结合实际生活费，更有代入感',tags:['挑战','生活'],date:today()}
      ]);
    }
    if(!DB.get('idea_review',null))DB.set('idea_review',[]);
    if(!DB.get('idea_copy',null)){
      DB.set('idea_copy',[
        {id:uid(),content:'不是退步，是在扎根。就像竹子，前四年只长3厘米，第五年每天长30cm。你现在的沉淀，都在为未来的爆发做准备。',usage:'阶段性复盘视频结尾',tags:['励志','金句'],date:today()},
        {id:uid(),content:'所谓「天赋」，不过是有人在你睡觉的时候还在努力。',usage:'学习vlog开头',tags:['励志','激励'],date:today()}
      ]);
    }
  },

  render(){
    this.init();
    subnav('#ideaSubnav',[['topics','💡','选题灵感'],['shots','🖼️','截图存档'],['viral','🔥','爆款二创'],['review','📊','内容复盘'],['copy','✍️','内容文案'],['trending','📱','今日热点']],this.tab,'Idea.tabTo');
    if(this.tab==='topics')this.renderTopics();
    else if(this.tab==='shots')this.renderShots();
    else if(this.tab==='viral')this.renderViral();
    else if(this.tab==='review')this.renderReview();
    else if(this.tab==='copy')this.renderCopy();
    else if(this.tab==='trending')this.renderTrending();
  },
  tabTo(t){this.tab=t;this.render();
    if(t==='shots')this.bindPaste();else this.unbindPaste();
  },

  /* ============ 截图存档 ============ */
  shotCat:'全部',
  shotFolder:'全部',
  shots(){return DB.get('idea_shots',[])},
  saveShots(v){DB.set('idea_shots',v)},
  /* 标签（用户可增删，存于本地） */
  shotCats(){return DB.get('idea_shot_cats',['灵感参考','爆款拆解','排版配色','文案金句','数据截图','其他'])},
  /* 文件夹（用户可新建，存于本地） */
  shotFolders(){return DB.get('idea_shot_folders',['未分类'])},
  renderShots(){
    const all=this.shots();
    const q=($('#shotQ')?.value||'').toLowerCase();
    const mode=DB.get('idea_shot_mode','grid');
    let data=all.slice().reverse();
    if(this.shotCat!=='全部')data=data.filter(x=>x.cat===this.shotCat);
    if(this.shotFolder!=='全部')data=data.filter(x=>(x.folder||'未分类')===this.shotFolder);
    if(q)data=data.filter(x=>((x.title||'')+(x.note||'')+(x.tags||[]).join('')).toLowerCase().includes(q));

    $('#ideaBody').innerHTML=
      '<div class="greet">🖼️ <b>截图存档</b> · 看到好排版、好文案、好数据，随手截下来存这儿（支持拖拽 / 直接 Ctrl+V 粘贴）</div>'+
      '<div class="shot-drop" id="shotDrop" onclick="$(\'#shotFile\').click()">'+
        '<div class="ic">📥</div><b>点击选择图片 / 拖拽到这里 / Ctrl+V 粘贴</b>'+
        '<p>支持一次选择多张，自动存入本地图库</p>'+
        '<input type="file" id="shotFile" accept="image/*" multiple hidden onchange="Idea.uploadShots(this.files)">'+
      '</div>'+
      '<div class="row" style="margin:12px 0;gap:6px;flex-wrap:wrap;align-items:center">'+
        '<input class="ipt" id="shotQ" placeholder="🔎 搜标题/备注/标签" value="'+esc(q)+'" style="width:180px;padding:5px 10px" oninput="Idea.renderShots()">'+
        '<div style="flex:1"></div>'+
        '<span class="mut" style="font-size:11px">'+data.length+' 张</span>'+
        '<div class="vw-toggle"><span class="'+(mode==='grid'?'on':'')+'" onclick="Idea.setShotMode(\'grid\')">⊞ 网格</span><span class="'+(mode==='list'?'on':'')+'" onclick="Idea.setShotMode(\'list\')">☰ 列表</span></div>'+
      '</div>'+
      '<div class="row" style="gap:5px;flex-wrap:wrap;margin-bottom:8px">'+
        '<span class="mut" style="font-size:11px;margin-right:3px">📁</span>'+
        '<span class="pill" style="cursor:pointer;'+(this.shotFolder==='全部'?'background:var(--nerv);color:#fff;font-weight:700':'')+'" onclick="Idea.shotFolderTo(\'全部\')">全部</span>'+
        this.shotFolders().map(f=>'<span class="pill" style="cursor:pointer;'+(this.shotFolder===f?'background:var(--nerv);color:#fff;font-weight:700':'')+'" onclick="Idea.shotFolderTo(\''+esc(f).replace(/'/g,"\\'")+'\')">'+esc(f)+'</span>').join('')+
        '<span class="pill" style="cursor:pointer;background:var(--accent-peach);color:#fff" onclick="Idea.addShotFolder()">＋ 文件夹</span>'+
      '</div>'+
      '<div class="row" style="gap:5px;flex-wrap:wrap;margin-bottom:12px">'+
        '<span class="pill" style="cursor:pointer;'+(this.shotCat==='全部'?'background:var(--nerv);color:#fff;font-weight:700':'')+'" onclick="Idea.shotCatTo(\'全部\')">全部 '+all.length+'</span>'+
        this.shotCats().map(c=>{
          const n=all.filter(x=>x.cat===c).length;
          const del=(c==='其他')?'':'<span style="margin-left:4px;opacity:.65" onclick="event.stopPropagation();Idea.delShotCat(\''+esc(c).replace(/'/g,"\\'")+'\')">✕</span>';
          return '<span class="pill" style="cursor:pointer;'+(this.shotCat===c?'background:var(--nerv);color:#fff;font-weight:700':'')+'" onclick="Idea.shotCatTo(\''+esc(c).replace(/'/g,"\\'")+'\')">'+esc(c)+' '+n+' '+del+'</span>';
        }).join('')+
        '<span class="pill" style="cursor:pointer;background:var(--accent-mint);color:#fff" onclick="Idea.addShotCat()">＋ 标签</span>'+
      '</div>'+
      '<div id="shotWrap"></div>';

    const wrap=$('#shotWrap');
    if(!data.length){wrap.innerHTML=emptyBox('还没有截图存档，上传第一张吧','🖼️');this.bindDrop();return}
    if(mode==='list'){
      wrap.innerHTML='<div class="shot-list">'+data.map(x=>
        '<div class="shot-row"><img id="sh_'+x.id+'" alt="">'+
        '<div style="flex:1;min-width:0"><b style="font-size:12.5px;display:block">'+esc(x.title||'未命名截图')+'</b>'+
        '<span class="mut" style="font-size:10.5px">'+esc(x.cat||'其他')+' · 📁 '+(x.folder||'未分类')+' · '+x.date+(x.note?' · '+esc(x.note):'')+'</span>'+
        ((x.tags||[]).length?'<div style="margin-top:3px">'+x.tags.map(t=>'<span class="pill" style="margin-right:3px;font-size:9.5px">'+esc(t)+'</span>').join('')+'</div>':'')+'</div>'+
        '<span class="btn sm" style="padding:3px 8px;font-size:10px" onclick="Idea.editShot(\''+x.id+'\')">✏️</span>'+
        '<span class="btn sm dgr" style="padding:3px 8px;font-size:10px" onclick="Idea.delShot(\''+x.id+'\')">🗑</span></div>').join('')+'</div>';
    }else{
      wrap.innerHTML='<div class="shot-grid">'+data.map(x=>
        '<div class="shot-card"><div class="rm" onclick="Idea.delShot(\''+x.id+'\')">✕</div>'+
        '<img class="th" id="sh_'+x.id+'" alt="">'+
        '<div class="mt"><b>'+esc(x.title||'未命名截图')+'</b><p>'+esc(x.cat||'其他')+' · 📁 '+(x.folder||'未分类')+' · '+x.date+'</p>'+
        '<div style="margin-top:5px;display:flex;gap:4px"><span class="btn sm" style="padding:2px 7px;font-size:10px;flex:1;justify-content:center" onclick="Idea.editShot(\''+x.id+'\')">✏️ 编辑</span></div></div></div>').join('')+'</div>';
    }
    /* 异步填充图片 */
    data.forEach(async x=>{
      const el=$('#sh_'+x.id);if(!el)return;
      const d=await IDB.get(x.img);
      if(d){el.src=d;el.onclick=()=>lightbox(d,(x.title||'截图')+' · '+(x.note||''));}
    });
    this.bindDrop();

      const s=this.shots();s.forEach(x=>{if(x.cat===cat)x.cat='其他'});this.saveShots(s);

  addShotFolder(){
    App.modal({title:'新建文件夹',emo:'📁',fields:[{k:'name',label:'文件夹名称',ph:'如：竞品分析'}],onOk:v=>{
      if(!v.name)return false;const n=v.name.trim();const fs=this.shotFolders();
      if(fs.includes(n)){toast('文件夹已存在','err');return false}
      fs.push(n);DB.set('idea_shot_folders',fs);this.shotFolder=n;this.renderShots();toast('已新建文件夹 📁 '+n);
    }});
  },
  async uploadShots(files){
    if(!files||!files.length)return;
    let n=0;
    for(const f of files){
      if(!f.type.startsWith('image/'))continue;
      const data=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(f)});
      const id=uid();await IDB.put('shot_'+id,data);
      const s=this.shots();
      const defCat=this.shotCat==='全部'?(this.shotCats()[0]||'其他'):this.shotCat;
      const defFolder=this.shotFolder==='全部'?'未分类':this.shotFolder;
      s.push({id,img:'shot_'+id,title:(f.name||'截图').replace(/\.[^.]+$/,''),cat:defCat,folder:defFolder,note:'',tags:[],date:today()});
      this.saveShots(s);n++;
    }
    if(n){this.renderShots();toast('已存档 '+n+' 张 🖼️')}
  },
  editShot(id){
    const s=this.shots();const x=s.find(a=>a.id===id);if(!x)return;
    App.modal({title:'编辑截图信息',emo:'✏️',fields:[
      {k:'title',label:'标题',value:x.title||''},
      {k:'cat',label:'分类',type:'select',opts:this.shotCats(),value:x.cat||this.shotCats()[0]||'其他'},
      {k:'folder',label:'文件夹',type:'select',opts:this.shotFolders(),value:x.folder||'未分类'},
      {k:'note',label:'备注 / 为什么存它',type:'textarea',style:'min-height:70px',value:x.note||''},
      {k:'tags',label:'标签（逗号分隔）',value:(x.tags||[]).join(',')}
    ],onOk:v=>{
      x.title=v.title||x.title;x.cat=v.cat||x.cat;x.folder=v.folder||'未分类';x.note=v.note||'';
      x.tags=(v.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
      this.saveShots(s);this.renderShots();toast('已保存');
    }});
  },
  delShot(id){
    App.confirm('删除这张截图存档？',async()=>{
      const x=this.shots().find(a=>a.id===id);
      if(x)await IDB.del(x.img);
      this.saveShots(this.shots().filter(a=>a.id!==id));
      this.renderShots();toast('已删除');
    });
  },
  bindDrop(){
    const el=$('#shotDrop');if(!el)return;
    el.ondragover=e=>{e.preventDefault();el.classList.add('dragover')};
    el.ondragleave=()=>el.classList.remove('dragover');
    el.ondrop=e=>{e.preventDefault();el.classList.remove('dragover');this.uploadShots(e.dataTransfer.files)};
  },
  bindPaste(){
    if(this._pasteFn)return;
    this._pasteFn=e=>{
      if(this.tab!=='shots')return;
      const items=(e.clipboardData||{}).items||[];
      const files=[];
      for(const it of items){if(it.type&&it.type.startsWith('image/')){const f=it.getAsFile();if(f)files.push(f)}}
      if(files.length){e.preventDefault();this.uploadShots(files)}
    };
    document.addEventListener('paste',this._pasteFn);
  },
  unbindPaste(){
    if(this._pasteFn){document.removeEventListener('paste',this._pasteFn);this._pasteFn=null}
  },

    if(custom)return custom;
    const dg=this.diagnose(7);
    if(!dg.records)return {auto:true,empty:true,title:'还没有皮肤日记数据',dos:['去「📓 皮肤日记」记录 2–3 天皮肤状态','系统会自动分析高频问题，生成专属的每周建议'],avoid:[],basis:'暂无数据'};
    if(!dg.main.length)return {auto:true,title:'状态平稳，维持现有节奏',dos:SKIN_ADVICE['稳定'].dos.slice(),avoid:SKIN_ADVICE['稳定'].avoid.slice(),basis:'近 7 天记录 '+dg.records+' 天，未标记明显问题'};
    const dos=[],avoid=[],labs=[];
    dg.main.forEach(t=>{
      const a=SKIN_ADVICE[t.c];labs.push(a.lab+'('+t.n+'次)');
      a.dos.forEach(s=>{if(!dos.includes(s))dos.push(s)});
      a.avoid.forEach(s=>{if(!avoid.includes(s))avoid.push(s)});
    });
    return {auto:true,title:'本周重点：'+dg.main.map(t=>SKIN_ADVICE[t.c].lab).join(' + '),
      dos:dos.slice(0,6),avoid:avoid.slice(0,5),
      basis:'近 7 天记录 '+dg.records+' 天 · 高频状态：'+labs.join('、')};
  },

    const a=this.advice();const isCustom=!a.auto;

      '</div>'+

      (a.dos&&a.dos.length?'<div class="mut" style="font-size:11px;font-weight:700;margin:6px 0 2px">✅ 这样做</div><ul>'+a.dos.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'')+

  /* ===== 每周护肤流程（自动生成 + 可改 + 从品架选产品） ===== */
  weekFlow(){return DB.get('skinWeekFlow',{})},
  saveFlow(f){DB.set('skinWeekFlow',f)},
  pickProd(type){
    const p=this.shelf().filter(x=>(x.status||'在用')==='在用');
    const hit=p.find(x=>x.type===type);
    if(hit)return hit.name;
    const alt=p.find(x=>type==='果酸'&&(x.type==='A醇'||x.type==='果酸'));
    return alt?alt.name:'';
  },
  genWeekFlow(){
    const wk=this.week();const dg=this.diagnose(7);
    /* 依据日记调整刷酸/面膜频率 */
    let acid=2,mask=2;
    if(dg.main.length){const a=SKIN_ADVICE[dg.main[0].c];if(a&&a.week){acid=a.week.acid;mask=a.week.mask}}
    const plan={};let ai=0,mi=0;
    const acidDays=[1,4],maskDays=[2,5,0];
    for(let i=0;i<7;i++){
      let type=wk[i];
      if(!type){
        if(i===6)type='休息';
        else if(acidDays.includes(i)&&ai<acid){type='刷酸';ai++}
        else if(maskDays.includes(i)&&mi<mask){type='面膜';mi++}
        else type='基础';
      }
      plan[i]=type;
    }
    const flow={};
    for(let i=0;i<7;i++){
      const tpl=SKIN_FLOW_TPL[plan[i]]||SKIN_FLOW_TPL['基础'];
      flow[i]={type:plan[i],
        am:tpl.am.map(s=>({id:uid(),name:s,prod:this.pickProd(SKIN_STEP_TYPE[s]||s)})),
        pm:tpl.pm.map(s=>({id:uid(),name:s,prod:this.pickProd(SKIN_STEP_TYPE[s]||s)}))};
    }
    this.saveFlow(flow);
    DB.set('skinWeek',plan);
    this.renderRoutine();
    toast('已按皮肤日记生成本周流程 ⚡');
  },
  clearWeekFlow(){App.confirm('清空本周护肤流程？',()=>{this.saveFlow({});this.renderRoutine();toast('已清空')})},

    const f=this.weekFlow();const wd=this.wday();

      return;
    }
    const day=this._flowDay==null?wd:this._flowDay;
    const d=f[day]||{type:'基础',am:[],pm:[]};
    el.innerHTML=

      '</div>'+
      '<div class="row" style="align-items:center;margin-bottom:8px"><span class="pill" style="background:var(--nerv);color:#fff">周'+WK_SHORT[day]+' · '+esc(d.type||'基础')+'</span>'+
      '<div style="flex:1"></div>'+
      '<span class="btn sm" style="padding:3px 9px;font-size:10.5px" onclick="Skin.setFlowType('+day+')">改模式</span>'+
      '<span class="btn sm" style="padding:3px 9px;font-size:10.5px" onclick="Skin.copyFlowToAll('+day+')">应用到全周</span></div>'+
      ['am','pm'].map(slot=>{
        const steps=d[slot]||[];
        return '<div style="margin-bottom:12px"><div style="display:flex;align-items:center;margin-bottom:5px">'+
          '<span class="mut" style="font-weight:700;font-size:11.5px">'+(slot==='am'?'🌞 早间流程':'🌙 晚间流程')+' ('+steps.length+' 步)</span>'+
          '<div style="flex:1"></div><span class="btn sm" style="padding:2px 8px;font-size:10px" onclick="Skin.addFlowStep('+day+',\''+slot+'\')">＋ 加步骤</span></div>'+
          (steps.length?'<div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">'+steps.map((s,idx)=>
            '<div class="sk-step"><div class="no">'+(idx+1)+'</div>'+
            '<div class="si"><b>'+esc(s.name)+'</b><p>'+(s.prod?'🧴 '+esc(s.prod):'<span style="color:var(--tx-3)">未指定产品，点编辑从品架选</span>')+'</p></div>'+
            '<span class="btn sm" style="padding:2px 7px;font-size:10px" onclick="Skin.moveFlowStep('+day+',\''+slot+'\','+idx+',-1)">↑</span>'+
            '<span class="btn sm" style="padding:2px 7px;font-size:10px" onclick="Skin.moveFlowStep('+day+',\''+slot+'\','+idx+',1)">↓</span>'+
            '<span class="btn sm" style="padding:2px 7px;font-size:10px" onclick="Skin.editFlowStep('+day+',\''+slot+'\',\''+s.id+'\')">✏️</span>'+
            '<span class="btn sm dgr" style="padding:2px 7px;font-size:10px" onclick="Skin.delFlowStep('+day+',\''+slot+'\',\''+s.id+'\')">🗑</span></div>').join('')+'</div>'
            :'<div class="mut" style="font-size:11px">这个时段还没有步骤</div>')+
        '</div>';
      }).join('')+
      '<div class="mut" style="font-size:10.5px;margin-top:4px">💡 流程按皮肤日记 + 品架「在用」产品自动匹配，每一步都可以改名、换产品、调顺序、增删。</div>';
  },
  flowDay(i){this._flowDay=i;this.renderWeekFlow()},
  prodOpts(){
    const p=this.shelf();
    return ['（不指定产品）'].concat(p.map(x=>x.name+'｜'+(x.type||'其他')));
  },
  parseProd(v){return (!v||v.indexOf('（不指定')===0)?'':String(v).split('｜')[0]},
  setFlowType(day){
    const f=this.weekFlow();const d=f[day];if(!d)return;
    App.modal({title:'周'+WK_SHORT[day]+'·换个模式',emo:'🗓️',fields:[
      {k:'type',label:'模式',type:'select',opts:SKIN_WEEK_TYPES,value:d.type},
      {k:'regen',label:'是否按模板重排步骤',type:'select',opts:['是，重新排','否，只改标签'],value:'是，重新排'}
    ],onOk:v=>{
      d.type=v.type;
      if(v.regen==='是，重新排'){
        const tpl=SKIN_FLOW_TPL[v.type]||SKIN_FLOW_TPL['基础'];
        d.am=tpl.am.map(s=>({id:uid(),name:s,prod:this.pickProd(SKIN_STEP_TYPE[s]||s)}));
        d.pm=tpl.pm.map(s=>({id:uid(),name:s,prod:this.pickProd(SKIN_STEP_TYPE[s]||s)}));
      }
      this.saveFlow(f);const wk=this.week();wk[day]=v.type;DB.set('skinWeek',wk);

    }});
  },
  copyFlowToAll(day){
    App.confirm('把周'+WK_SHORT[day]+'的流程复制到本周每一天？',()=>{
      const f=this.weekFlow();const src=f[day];if(!src)return;
      for(let i=0;i<7;i++){
        f[i]={type:src.type,
          am:src.am.map(s=>({...s,id:uid()})),
          pm:src.pm.map(s=>({...s,id:uid()}))};
      }
      this.saveFlow(f);this.renderRoutine();toast('已应用到全周');
    });
  },
  addFlowStep(day,slot){
    const f=this.weekFlow();if(!f[day])f[day]={type:'基础',am:[],pm:[]};
    App.modal({title:'加一个步骤',emo:'🧴',fields:[
      {k:'name',label:'步骤名',ph:'如：洁面 / 精华 / 防晒'},
      {k:'prod',label:'使用产品（来自品架）',type:'select',opts:this.prodOpts()}
    ],onOk:v=>{
      if(!v.name)return false;
      f[day][slot].push({id:uid(),name:v.name,prod:this.parseProd(v.prod)});
      this.saveFlow(f);this.renderWeekFlow();toast('已添加');
    }});
  },
  editFlowStep(day,slot,id){
    const f=this.weekFlow();const s=(f[day]&&f[day][slot]||[]).find(x=>x.id===id);if(!s)return;
    const opts=this.prodOpts();
    const cur=opts.find(o=>o.split('｜')[0]===s.prod)||opts[0];
    App.modal({title:'编辑步骤',emo:'✏️',fields:[
      {k:'name',label:'步骤名',value:s.name},
      {k:'prod',label:'使用产品（来自品架）',type:'select',opts:opts,value:cur}
    ],onOk:v=>{
      if(!v.name)return false;
      s.name=v.name;s.prod=this.parseProd(v.prod);
      this.saveFlow(f);this.renderWeekFlow();toast('已保存');
    }});
  },
  delFlowStep(day,slot,id){
    const f=this.weekFlow();if(!f[day])return;
    f[day][slot]=f[day][slot].filter(x=>x.id!==id);
    this.saveFlow(f);this.renderWeekFlow();
  },
  moveFlowStep(day,slot,idx,dir){
    const f=this.weekFlow();const arr=f[day]&&f[day][slot];if(!arr)return;
    const j=idx+dir;if(j<0||j>=arr.length)return;
    const t=arr[idx];arr[idx]=arr[j];arr[j]=t;
    this.saveFlow(f);this.renderWeekFlow();
  },

    const r=this.routine();const grp=w=>r.filter(x=>x.when===w);

    $('#skinSteps').innerHTML=card('早')+card('晚');

      '<div class="panel" style="margin-top:14px"><div class="hd"><i class="dot"></i><h3><span class="emo">🗒️</span>日记列表</h3><span class="tag" id="skinDiaryCount"></span></div>'+
      '<div class="bd" id="skinDiaryList"></div></div>';
    if(todayEntry)(todayEntry.conds||[]).forEach(c=>{const el=$$('#skinCondBox .m').find(x=>x.dataset.v===c);if(el)el.classList.add('on')});
    this._dr=this._dr||'week';this.renderChart();this.renderDiaryList();
  },
  togCond(el){el.classList.toggle('on')},
  setDr(r){this._dr=r;this.renderChart()},
  saveDiary(){
    const conds=[...$$('#skinCondBox .m.on')].map(x=>x.dataset.v);
    const note=$('#skinNote').value.trim();const d=this.diary();
    const i=d.findIndex(x=>x.date===today());
    if(i>=0)d[i]={...d[i],conds,note};else d.push({id:uid(),date:today(),conds,note});
    DB.set('skinDiary',d);this.renderDiary();toast('已记录 📓');
  },
  renderChart(){
    const range=this._dr||'week';const days=range==='week'?7:range==='month'?30:365;
    const d=this.diary();const cut=[];const dt=new Date();dt.setDate(dt.getDate()-(days-1));
    const cnt={};SKIN_CONDS.forEach(c=>cnt[c]=0);let stable=0,bad=0;
    d.filter(x=>parseD(x.date)>=dt).forEach(x=>(x.conds||[]).forEach(c=>{if(cnt[c]!=null)cnt[c]++;if(c==='稳定')stable++;if(['泛红','干燥','出油','爆痘','敏感','暗沉','紧绷','浮肿','脱皮'].includes(c))bad++}));
    const rows=SKIN_CONDS.map(c=>({k:c,v:cnt[c],c:'var(--nerv)'}));
    $('#skinChart').innerHTML=pieChart(rows)+'<div class="mut" style="margin-top:8px">期间记录 '+d.filter(x=>parseD(x.date)>=dt).length+' 天 · 状态「稳定」'+stable+' 次 · 有不适 '+bad+' 次</div>';
  },
  renderDiaryList(){
    const d=this.diary().slice().reverse();$('#skinDiaryCount')&&($('#skinDiaryCount').textContent=d.length+' 天');
    $('#skinDiaryList').innerHTML=d.length?d.map(x=>
      '<div class="item" style="margin-bottom:6px"><div class="acts"><div class="btn sm" onclick="Skin.delDiary(\''+x.id+'\')">删</div></div>'+
      '<h4><span class="mut">'+x.date+'</span> '+(x.conds&&x.conds.length?'<span class="pill" style="background:var(--nerv-dim);color:var(--nerv)">'+x.conds.join('/')+'</span>':'<span class="pill">无标记</span>')+'</h4>'+
      (x.note?'<p>'+esc(x.note)+'</p>':'')+'</div>').join('')
      :emptyBox('记录今天的皮肤状态','📓');
  },
  delDiary(id){DB.set('skinDiary',this.diary().filter(x=>x.id!==id));this.renderDiary()},
  /* ===== 面部按摩（真实手法库 + 打卡 + 自定义需求生成） ===== */
  renderMassage(){
    const on=this.massage().includes(today());
    $('#skinBody').innerHTML=
      '<div class="greet"><b>💆 面部按摩</b> · 真实手法库（点开看步骤，照着做并打卡）</div>'+
      '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">✅</span>今日打卡</h3><span class="tag">DAILY</span></div>'+
      '<div class="bd"><div class="row" style="margin-bottom:10px"><span class="chip'+(on?' on':'')+'" onclick="Skin.massageToggle()">'+(on?'✓ 今日已按摩':'今日面部按摩打卡')+'</span><span class="chip" onclick="Skin.massHist()">查看记录</span></div>'+
      '<div class="mut" style="line-height:1.8;color:var(--tx-2)">连续按摩 '+this.massStreak()+' 天。可搭配精油/面霜，由下往上、由内往外轻推，贵在坚持～</div></div></div>'+
      '<div class="panel"><div class="hd"><i class="dot"></i><h3><span class="emo">🧬</span>我有别的需求，帮我生成</h3><span class="tag">GENERATE</span><div class="sp"></div><div class="btn sm" onclick="Skin.customGen()">✨ 生成</div></div>'+
      '<div class="bd"><input class="ipt f" id="massNeed" placeholder="例：消水肿 / 抗老紧致 / 放松 / 祛黄" onkeydown="if(event.key===\'Enter\')Skin.customGen()"></div></div>'+
      '<div class="panel" style="margin-top:14px"><div class="hd"><i class="dot"></i><h3><span class="emo">💡</span>手法库（点击展开步骤）</h3><span class="tag">'+MASSAGE_LIB.length+' 种</span></div>'+
      '<div class="bd" id="massLib"></div></div>';
    this.renderMassLib();
  },
  renderMassLib(){
    $('#massLib').innerHTML=MASSAGE_LIB.map((m,i)=>
      '<div class="item" style="margin-bottom:8px;padding:10px 12px"><div class="row" style="align-items:flex-start;cursor:pointer" onclick="Skin.openMass('+i+')">'+
      '<div style="flex:1"><h4>💆 '+esc(m.name)+' <span class="pill" style="background:var(--nerv-dim);color:var(--nerv)">'+esc(m.goal)+'</span></h4>'+
      '<p class="mut">'+m.steps.length+' 步 · 点开看详细手法</p></div>'+
      '<a href="'+m.u+'" target="_blank" rel="noopener" class="btn sm" onclick="event.stopPropagation()">↗ 科普</a></div></div>').join('');
  },
  openMass(i){const m=MASSAGE_LIB[i];
    App.modal({title:'💆 '+m.name,emo:'💆',noFoot:true,html:
      '<div style="font-size:13px;line-height:1.85"><div class="mut" style="margin-bottom:8px">适用：'+esc(m.goal)+' · <a href="'+m.u+'" target="_blank" rel="noopener" style="color:var(--nerv)">查看科普原文 ↗</a></div>'+
      '<ol style="margin:0;padding-left:18px">'+(m.steps.map(s=>'<li style="margin-bottom:6px">'+esc(s)+'</li>').join(''))+'</ol>'+
      '<div class="row" style="margin-top:12px"><div class="btn pri" onclick="Skin.massCheckType(\''+esc(m.name).replace(/'/g,"\\'")+'\')">按这个做并打卡</div></div></div>'});
  },
  massCheckType(name){if(!this.massage().includes(today())){const a=this.massage();a.push(today());DB.set('skinMassage',a)}toast('已打卡：'+name+' 💆')},
  customGen(){
    const need=($('#massNeed').value||'').trim();if(!need){toast('先说下你的需求','err');return}
    let types=[];for(const k in MASSAGE_NEED){if(need.includes(k))MASSAGE_NEED[k].split(',').forEach(t=>{if(!types.includes(t))types.push(t)})}
    if(!types.length)types=['淋巴引流','画圈按摩'];
    const picks=MASSAGE_LIB.filter(m=>types.includes(m.name));
    App.modal({title:'✨ 为你生成按摩方案',emo:'✨',noFoot:true,html:
      '<div style="font-size:13px;line-height:1.8"><div class="mut" style="margin-bottom:8px">针对「'+esc(need)+'」，建议顺序：</div>'+
      picks.map((m,idx)=>'<div style="margin-bottom:10px"><b>'+(idx+1)+'. '+esc(m.name)+'</b> <span class="pill" style="background:var(--nerv-dim);color:var(--nerv)">'+esc(m.goal)+'</span><ol style="margin:4px 0 0 18px">'+m.steps.map(s=>'<li style="margin-bottom:3px">'+esc(s)+'</li>').join('')+'</ol></div>').join('')+
      '<div class="row" style="margin-top:10px"><div class="btn pri" onclick="Skin.massCheckType(\''+esc(need).replace(/'/g,"\\'")+'\')">完成并打卡</div></div></div>'});
  },
  massageToggle(){const m=this.massage();const i=m.indexOf(today());if(i<0)m.push(today());else m.splice(i,1);DB.set('skinMassage',m);this.renderMassage()},
  massageHist(){const m=this.massage().slice().reverse().slice(0,20);App.modal({title:'面部按摩记录',emo:'💆',noFoot:true,html:'<div>'+(m.length?m.map(d=>'<div class="mut" style="padding:5px 0;border-bottom:1px solid var(--line)">'+d+'</div>').join(''):'<div class="mut">还没有记录</div>')+'</div>'})},
  massStreak(){const s=new Set(this.massage());let n=0;for(let i=0;i<400;i++){const dt=new Date();dt.setDate(dt.getDate()-i);if(s.has(ymd(dt)))n++;else if(i>0)break}return n}
};
RENDER.skin=()=>Skin.render();
</script>

<script>
/* ==================================================================
   15 · 启动补充（全局挂载 + 快捷键）
   ================================================================== */

/* 全局挂载：确保所有模块和函数可被内联onclick/jsdom访问 */
Object.assign(window,{
  App,Data,DB,IDB,MODULES,RENDER,TABS,
  toast,copy,today,ymd,pad,$,$$,
  Daily,Eng,Jp,Cut,Sport,Mat,Mov,Book,Idea,Skin,Home,
  speak,startVoiceInput,pieChart,barChart,kpi,emptyBox,subnav,greeting,
  Supabase,Splash
});

/* 快捷键 */
document.addEventListener('keydown',e=>{
  if(e.key==='?'&&(e.metaKey||e.ctrlKey)){e.preventDefault();App.help()}
});

/* 跨天刷新检测 */
let _todayStr=today();
setInterval(()=>{
  const now=today();
  if(now!==_todayStr){_todayStr=now;location.reload()}
},60000);

console.log('🌍 地球Online 工作台 v3.2 已启动');
</script>
