  {q:"How are the transportation systems in urban areas and rural areas different?",title:"Part 3 范文",answer:"There are many reasons. Firstly, the government in urban areas has more money, and they can invest more money to built and maintain a modern and advanced transportation system . Secondly, the size of the population is different in urban and rural areas. So the function and passenger demand could be different.\n\n- 41 - 等待特殊的事情 Describe a time when you waited for something special that would happen You should say: What you waited for Where you waited Why it was special And explain how you felt while you were waiting",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Who behave better when waiting, children or adults?",title:"Part 3 范文",answer:"Generally, adults have more self -control than young children, so they will per form better in behavior. Because waiting is usually a boring process, children may have bad behaviors such as running around, making noise and influencing others, but adults will wait civilized and perform better in most cases because they have a higher cognitive level and self-control ability.\n\nCompared to the past, are people less patient now, why? Compared with the past, I personally think that people today are less patient than in the past. On the one hand, more and more people are improving their quali ty of life and pursuing the experience of entertainment projects.\n\n- 42 - There may be an occasion that the production capacity of some popular projects does not keep up with the demands, so the waiting time becomes longer, causing people's lack of patience. On the other hand, people today have higher work",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the positive and negative effects of waiting on society?",title:"Part 3 范文",answer:"Personally, the negative impact of waiting is greater than the positive impact. The main negative impact is to reduce the efficiency of work and social production. People waste their time waiting and can't do more meaningful things. The positive impact is based on the things and the personal attitudes. If it is a work that needs to be done carefully, longer waiting time means longer preparation time, and the final results may be better. And if individuals can improve themselves during the waiting time, such as reading some books, thinking, etc, Then it also has a certain positive effect.\n\n- 43 - 为父母感到骄傲的场合 Describe an occasion when you were proud of your parents. You should say: What the occasion was When and where it happened What your parents did And explain why you were proud of them",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"When would parents feel proud of their children?",title:"Part 3 范文",answer:"Most parents will be proud of their children when their children make some achievements in their growth experience or do something that has a positive impact on the society or on the family. For example, when children get excellent test results in the class, or when children become class committee members and volunteers in school, etc.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Should parents reward children? Why and how?",title:"Part 3 范文",answer:"I think children need to be rewarded, because children's cognitive level gradually improves with growth and age. In this process, they need to know what is right and what is wrong. The most intuitive way is for parents and teachers to educate through reward and punishment. However, reward does not necessarily mean material reward. A word of encouragement and affirmation or a hug is a form of reward, which needs to be done according to the specific behavior of the child.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is it good to reward children too often? Why?",title:"Part 3 范文",answer:"- 44 - The frequency of rewarding children needs to be determined according to the personality characteristics of each child. For introverted or naughty children, I don't think it's a bad thing to reward more frequently, which may make them change their current state faster. For children who have already done well, the frequency of reward can be appropriately reduced, Because they have their own judgment of right and wrong and they will do good things as a habit in the future.\n\nOn what occasions would adults be proud of themselves? Adults also need to reward and encourage themselves. When they break through a difficulty in their project, or after a long period of focus on finishing the work, they should be appropriately proud of themselves, because every time they complete a good project or solve a problem, they have made their own strength for the group, the company and the society. Fee",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is it good to move to a new place frequently? Why?",title:"Part 3 范文",answer:"- 46 - Part2&3 经历类（保留题） 朋友间的争执 Describe an occasion when two of your friends disagreed about something You should say: When it happened What it was about How it was solved And how you felt about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think argument is important?",title:"Part 3 范文",answer:"I think the argument is very important in daily life, like almost everything, including life, working and studying. So let's talk about life first. We are usually dealing with different people with different problems. I think the argument starts in different ways. One could be having two ideas and judging which one is better, while sometimes you have to fight for your own benefit. Sometimes you are pushed to argue with others, making life much easier to make things clear. Let's talk about work and study together. On both of these occasions, people in a group try to make things better, so having an argument or debate actually makes the ideas pop up and helps the project become better.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What do you family members usually have arguments about?",title:"Part 3 范文",answer:"We do not actually have much argument in my family. The only thing I think I will argue with my parents is the education of my brother, my little brother. Since I think children should go outside and play on t he field, but my mom told me that children are studying all the time, and this situation is for almost every student in my brother's\n\n- 47 - class. So basically, my mom doesn't want my brother to work this hard, but occasionally it is something that cannot change in a short time. Other than this, we are all really caring, loving family with very little, little amount of arguments.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is it easier for you to have arguments with your family or with your friends?",title:"Part 3 范文",answer:"I don't really have many arguments with people around me, either my parents, my brothers and sisters, my friends or even strangers. I think I am easygoing and someone who is willing to help others, so it is also hard for me to start an argument with others just because I don't want to do it. Besides, I think everything can be explained and reach a consensus by gently talking to each other, so I don't see something must be solved by arguing.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think people should change the way they think when having arguments?",title:"Part 3 范文",answer:"Yeah, definitely. Having an argument means two or more of you guys don't hold the same opinion on something so you guys cannot agree with each other. Solving the problem means at least some of you guys change their minds or combine their ideas together to form a new idea. In either way, that people definitely change the way they think.\n\n- 48 - 微笑的场合 Describe an occasion you remember when you saw a lot of people smiling You should say: What was the occasion When it happened Who you were with And explain why many people were smiling",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think people who like to smile are more friendly?",title:"Part 3 范文",answer:"Well, it depends. If the smile is genuine, then it makes people around feel comfortable and the smile can be regarded as an open invitation saying that they are willing to interact with others. In this case, these people appear more friendly. However, some people often flash a fake smile, which clearly conveys rejection to cooperate with others. And certainly, this group of people might not be considered friendly.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do most people smile in photographs?",title:"Part 3 范文",answer:"On the one hand, people usually look better and more attractive when they smile. And they tend to choose different poses to make them look good for the camera. On the other hand, the smile indicates happiness so that people try to make these memories colourful after capturing those amazing moments. Afterwards, when they see these old photos, it is likely for them to recall beautiful golden days.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do women smile more than men? why?",title:"Part 3 范文",answer:"I'm not quite sure about that but I do believe there are differences between men and women when they smile. This is because women have been thought to have more expressive smiles and they may be more willing to show their happiness or excitement in public. Besides, women tend to use smile as a way to defuse tension and build trust with others on various occasions. By contrast, men would be more reserved and not willing to share their feelings, thoughts or emotions in such situation.\n\n- 49 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do people smile more when they are younger or older?",title:"Part 3 范文",answer:"I don't think whether a person smiles often or not has something to do with his or her age. Instead, it should depend on one's personality. If a person is outgoing and optimistic, it is mor e likely for him or her to flash smiles for most of the time. But if one is unwilling to express feelings and emotions, it is natural for him or her to smile less. Moreover, indeed, some old people don't smile often because they may fear that smiling makes the wrinkles around the eyes and mouth more visible.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think old people can control feelings better than younger people?",title:"Part 3 范文",answer:"Yes, I think so. An increase in age helps people better regulate emotions mainly because the elderly have a wealth of past experience in controlling feelings and they've been doing it for a long time. While for the young, they tend to be easily influenced by negative emotions such as depression, anxiety, fear and stress as they don't know how to handle them properly, which may even disrupt their performance in daily tasks.\n\n- 50 - 生活计划 Describe something you plan to do in your life You should say: What it is about Why you make it What you need to do first And explain how you would feel if it is successful\n\nI’d like to describe a life plan of mine, which is finish reading 100 books in two years. In today’s world, reading can be both easy and difficult. It is easy because there are millions of books available nowadays that one can get in both the paper and digital version. It is also diffi",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Should parents make plans for children?",title:"Part 3 范文",answer:"I think it is necessary for partents to help children make plans. Because they lack experience of planning for their own time and future. But parents also need to cultivate their children's habit of making their own plans, and encourage them to make plans, even from the daily to-do list.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"When should children start to make plans for themselves?",title:"Part 3 范文",answer:"I think children can start to make plans for themselves at any age, even if it's a 20 minute or an hour life plan, game plan and so on. Because we need to cultivate their habit and guide them step by step. So, I don't think there is a fixed starting age or time. If I have to give an age, I think it's about three or four years old, when they can understand their parents' meaning and have the ability to draw something on paper.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What things should be planned on a daily basis?",title:"Part 3 范文",answer:"I think some things that need long- term persistence to achieve the desired results need to be planned on a daily basis. For example, improve the ability of a certain language, exercise a certain skill or lose weight. These things need us to take the right time every day, practice and consolidate, and constantly review, to achieve the ideal effect.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Are plan always necessary? Can people succeed without plans?",title:"Part 3 范文",answer:"- 51 - I think plans are necessary. Although some people can succeed without a plan, we are the ordinary majority after all. We need to use the plan to supervise our daily life arrangement, to promote the progress of work. So as not to be distracted by other things.\n\n- 52 - 分享 Describe a time when you shared something with others (or another people) You should say: What you shared Who you shared with Why you shared it And explain how you felt about sharing it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you like to share?",title:"Part 3 范文",answer:"Yes, I really enjoy sharing. Whenever I see breath -taking scenery I will always take a picture and post it on social media, it makes me feel so great when others also like the photos I take. And there are also circumstances that I find something delicious and I will share it with my best friend, after all we have similar taste, so she will definitely like the food I like.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the consequences if children don’t like to share?",title:"Part 3 范文",answer:"Well, maybe they will grow up to be more selfish than others. This might cause some circumstances that people regard that they are so mean and stingy and think that they are not easy to get along with, so that they won't share their stuff with the children who don't like sharing, either.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How you feel about sharing accommodation with others on campus?",title:"Part 3 范文",answer:"I kind of like it, since I am afraid of sleeping alone in the room, sharing the room with others makes me feel safe. Of course there are privacy problems and inevitable disagreements, but I think with adequate communication and understanding students are able to share the accommodation peacefully and happily.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How could parents and teachers teach young children to share?",title:"Part 3 范文",answer:"- 53 - I think the best way is to teach both in words and by example. If they only tell their children to share with others while not sharing anything to their friends or relatives, children will never listen to them, so action speaks louder than words. They have to become that kind of person that they wish their children to become.\n\n- 54 - 社交媒体趣事 Describe a time you saw something interesting on social media You should say: When it was Where you saw it What you saw And explain why you think it was interesting",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do people like to use social media?",title:"Part 3 范文",answer:"I think there are two mainly reasons why people like social media. The first one is that people are always curious about new things. Social media can let people grasp the interesting or important things that are happening quickly; The second is that using social media allows people to spend their idle and boring time interacting with their friends and family.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of things are popular on social media?",title:"Part 3 范文",answer:"Generally speaking, the things that are popular on social media are interesting which can make people feel happy. Also, there is another situation that is relatively rare major news. Of course, if it is good news, such as holiday notice, national welfare policy, etc. For individuals, if they see happy events in their circle of friends, like relatives and friends who are going to get married or have a baby, it will also be a welcome and happy thing.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the advantages and disadvantages of using social media?",title:"Part 3 范文",answer:"About advantages, it can reduce the sense of isolation in modern society , and it spread the information rapidly, which generate larger influence and interaction. Additionally, it could broaden our horizon because we could accept lot of informatio n and opinions can communicate with different people simultaneously which enables a highly developed communicative scenario, and it also has disadvantages, sometimes playing it is a waste of time, because\n\n- 55 - we may be addicted to it so that it occupy the time for which we must do such as our academic work or sleeping time, and it may have information related to violence, pornography, or crime which is not good to the teenagers.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What do you think of making friends on social network?",title:"Part 3 范文",answer:"Making friends on the Internet has both advantages and disadvantages. It can broaden our horizons and increase our knowledge. We can communicate with experts and scholars in different fields and people from all walks of life. Furthermore, we can see the local customs of foreign countries through the Internet. But for teenagers, they may also be cheated because they are too young and ignorant, so parents and teachers should pay attention to children’s behavior carefully.\n\n- 56 - 帮助朋友的经历 Describe a time when you did something to help a friend You should say: When it was What did you do Why you helped him/her And how you felt about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How is online help different from real-life help?",title:"Part 3 范文",answer:"Online help can only solve some remote problems, such as helping classmates or friends to solve academic problems, or guiding teaching through voice and video, but not demonstrating in person. Real-life help can be more efficient sometimes, because you can personally know the problems and observe more details, such as helping others repair computers, install machines, and so on. In general, online help and real-life help have their own advantages and disadvantages, which can only be reflected in a specific situation.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Should schools be responsible for teaching students how to cooperate?",title:"Part 3 范文",answer:"- 57 - Of course, the school plays an indispensable role in the process of children's growth, and it should be responsible for the morality and the ability of students. For students, the two places where they spend the longest time are family and school. The school should work with parents to cultivate children's good qualities, including learning to cooperate. Cooperation can get twice the result with half the effort, improving efficiency and stimulating children’s creativity.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the differences between help from friends and help from family?",title:"Part 3 范文",answer:"It's hard to tell the differences between the help from friends and the help from family, because it needs to be analyzed according to specific situations. Take myself as an example, when I encounter difficulties, in order not to let my family worry about me, I usually give priority to seeking the help from my friends, the reaso n is that firstly my friends are near me and can quickly participate in the problem solving. Second, my friends are close to me in age, and we can communicate more easily. However, it is better to accept the help from family when having some particular difficulties, for example, when I am short of money, I prefer to turn to my parents for help, because their love is selfless, and they are willing to pay regardless. Additionally ，in front of parents, there is no need to worry about being shameful or embarrassed.\n\n- 58 - 不太成功的经历 Describe a time when you tried to do",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What's your definition of success?",title:"Part 3 范文",answer:"My definition of success is that I complete the planned tasks within the scheduled time. I don't like to compare with others. As long as I do better than before, it is my progress. So I will set many small plans for myself on the basis of big goals. In this way, every time I achieve a small goal, I will feel happy and be satisfied. So I can encourage myself to continue to work hard.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What things do children try to succeed in?",title:"Part 3 范文",answer:"Children don't need to achieve big goals. They can be regarded as successful if they insist on accomplishing small tasks every day. For example, learn five words every day, clean their room every day, and eat vegetables and fruits every day.\n\nWhich do you think is more important for people to become successful? Hard work or opportunities?\n\n- 59 - I think hard work and opportunities are very important for success, but opportunities are more necessary. Because, if you are bad luck, has not met the good opportunities all the time, no matter how hard you work, you may have been unknown.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think people will be happy if they don't have any goals to achieve?",title:"Part 3 范文",answer:"In the short run, people can be happy without goals. For example, on weekends or short holidays, people like to stay at home, reading, cooking and enjoying the time with their families. But in the long run, people need to set goals and try to achieve them to gain satisfaction, achievement and happiness.\n\n- 60 - 不用手机的时候 Describe a time when you were not allowed to use your mobile phone You should say： Where you were What you were doing at the time Why was the mobile phone not allowed And explain how you feel about the whole experience",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Are children allowed to use mobile phones in your country?",title:"Part 3 范文",answer:"There are no clear regulations but parents in China tend to not allow their children to use mobile phones, because using mobile phones too often in childhood may lead to myopia and inattention. Also, if children get used to using mobile phones too early, they will lose their interests in the real world and they may reluctant to make friends with other peers, which is not helpful to his grow.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How do you like children having mobile phones?",title:"Part 3 范文",answer:"I hold the same opinion with most Chinese parent s because of those concerns I have just mentioned. In order to help children grow up healthily and keep their curiosity towards the real world, they should not be exposed to mobile phones and other gadgets too young. I think children should not be allowed to use mobile phones in their early age.\n\nAt what age should children have mobile phones? Six, seven or eight? I think these ages are still too early for them to use mobile phones. Maybe ten or eleven could be the much more suitable ages. But I have to mention that even they are allowed to use mobile phones at these ages, their using time also should be limited. This is because spending too much time on mobile phones may probably influence their study and normal social activities. And concerns of myopia and inattention still exist since they are still growing.\n\n- 61 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do many old people use mobile phones?",title:"Part 3 范文",answer:"I don’t think so, because my grandparents are still used to using telephones, although my parents bought him a mobile phone. And my grandpa still has a notebook of contact numbers of different relatives. Due to their living habits, they probably feel uncomfortable and strange to use mobile phones. So, I think more old people are likely to use traditional telephones rather than cellphones.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think there are any drawbacks of using the mobile phone?",title:"Part 3 范文",answer:"Yes, there are several disadvantages. Firstly, it influences both eye health and cervical health which have already been general health problems for many people. Besides, we are more likely to be disturbed in our private time. For example, our boss may ask us to do some urgent work by mobile phone, even we have been off work. Also, we are more easily to be distracted by mobile phones when we are required to focus on something.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What do most people use their mobile phones for?",title:"Part 3 范文",answer:"The main purpose is for social. Privately, we use mobile phones to contact with our parents, friends and spouse. In the workplace, we use mobile phones to send files and contact customers or colleagues for work. Besides, young people tend to use mobile phones to show their life on social media such as Facebook and Instagram, especially when they have some special parties or they go out for traveling.\n\n- 62 - Part2&3 事物类（新题） 令人激动的书 Describe an exciting book that you enjoy reading You should say: When you read it What kind of book it is What it is about And explain why you think it is exciting",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you prefer books or movies?",title:"Part 3 范文",answer:"I like reading books better than movies. Because following the words written by the author, I can imagine the plot of the picture by myself. This is a story picture that belongs to me alone , and at the same time it can exercise my imagination. However, the quality of the film is very dependent on the actors' acting skills, and it is difficult to show all the details.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think it is very important to read the book before watching the movie version of it?",title:"Part 3 范文",answer:"I think it is not important to read this book before watching the movie version. The movie will show most of the important scenes and stories in the book. If I really like this story, I will go back and read this book as a supplement to the movie. But for stories that I am not interested in, I think that movies may be more interesting without reading obscure books.\n\n- 63 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do boys and girls like the same kinds of books?",title:"Part 3 范文",answer:"I think that boys and girls do not necessarily like the same type of books. In fact, the types of books that everyone likes are not exactly the same. But bookstores tend to put books on military, politics, and adventure in the mustread for boys, and the books that girls like are more biased towards handicrafts, cooking and stories. I think this is related to social concepts of different genders.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of books do Chinese people like reading?",title:"Part 3 范文",answer:"I sometimes choose books based on the kindle reading list. I think it represents the books that Chinese people like to read to a certain extent. Books on economics and management and history are ranked high on the list. In addition, detective novels are also a choice of many people. Every year, books by authors who have won the Nobel Prize are also welcomed by Chinese people.\n\n- 64 - 希望养成的习惯 Describe a habit your friends has and you want to develop You should say Who your friend is What habit he/she has When you noticed this habit And explain why you want to develop this habit",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What habits should children have?",title:"Part 3 范文",answer:"There are many habits that children need to cultivate. But they may not be able to meet high requirements when they are young, so I think they can cultivate basic habits first. For example, learn to do their own things by themselves, have a regular life routine, be polite, pay attention to hygiene, and other living habits.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What should parents do to teach their children good habits?",title:"Part 3 范文",answer:"The most appropriate way to educate children to develop good habits is to set an example for them. In childhood, the most common way for children to learn is through imitation. Only when parents exercise self-discipline in life, children will naturally learn these good habits. As the saying goes, children are a mirror of their parents.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What influences do children with bad habits have on other children?",title:"Part 3 范文",answer:"Children will imitate and learn from each other. If children with bad habits are very active among their friends, they may let other children learn such bad habits. For example, if a child likes to play outside every time after school and doesn't go home in time, he may take other students with him together. Without the company of parents and the supervision of teachers, these children's safety can't be guaranteed and they are likely to encounter danger outside.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How do people develop bad habits?",title:"Part 3 范文",answer:"- 65 - Bad habits are easier to cultivate than good habits, because bad habits usually make people feel more relaxed in a short time, but people don't realize that they may pay more in the future, or they may have realized it but they don't want to correct because of laziness. For example, brushing mobile phone short videos compared with reading some books every night is a much easier behavior, because reading requires considerable concentration, but in the long run, the benefits of reading must be far greater than watching entertainment short videos.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What habits do people have when they got older?",title:"Part 3 范文",answer:"When people are old, one of the most common changes in their living habits is to change from sleeping late and getting up late when they are young to going to bed early and getting up early, which may be related to the changes in their physical conditions brought about by age. Another habit that the old people around me usually have is that they prefer to take photos to record their life when they are getting older. I think on the one hand, the reason is that the c amera function of smart phones is becoming more and more comprehensive and convenient. On the other hand, when people get old, they want to record the good life as much as possible to help them recall these beautiful days in the future.\n\n- 66 - 浪费时间的活动 Describe an activity you usually do that wastes your time You should say: What it is When and where you usually do it Why you do it And explain why you think it wastes your time",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How to balance life and work?",title:"Part 3 范文",answer:"Life-work balance is a conundrum that a majority of people would be confused about it. I reckon that there are several ways that people could adopt is that they could create a clear schedule and allocate time for their family and work. Through this way, they would not neglect their family because of overwhelming work. Besides, division is also a good idea. This method could alleviate female family stress especially housework in that each family member has his own responsibility.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Will you continue doing something when you are aware that it's a waste of time?",title:"Part 3 范文",answer:"Undoubtedly, I would stop doing it. There are two main reasons, one is that I tend do something more meaningful and attracting to replace it. For another reason, I would have a sense of guilty if I keep doing it. However, if it’s already indispensable for me to alleviate the pressure, I would keep doing it occasionally.\n\nwhat kinds of things make people feet pressured? It varies in distinct people, as for students, it’s pa lpable that students will be overwhelmed by some excess assignments so that they have no enough energy to tackle with the daily tasks. However, when it comes to adults, the salary is the most disturbing thing among them in that they will invariably be harassed with financial pressure because most of people have to support their families and take care of parents. Therefore, different people will be influenced by distinct things in their daily life.\n\n- 67 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do some people refuse to abide by rules?",title:"Part 3 范文",answer:"I reckon that those who are loath to follow the rules may feel it’s too stifling to be restricted by the rules, instead, they tend to follow their heart. Also, some people who have strong personalities won’t easily obey the rules, normally they are prone to do something more thrilling to satisfy their curiosity so it’s overt that they will break the rules rather than follow it without protest.\n\n- 68 - 好的服务 Describe a good service you received You should say: What the service was When you received it Who you were with And how you felt about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What do yo think of the relationship between companies and customers?",title:"Part 3 范文",answer:"Just like a Chinese old saying goes: customers are gods. Companies try their best to provide better goods and services in order to attract more new customers and retain the old customers. Meanwhile , customers are also waiting to receive better goods and services from companies.\n\nAs a customer, what kinds of services would you expect to receive from a company? I expect to received customized services from a company. Giving customized services shows the companies care and love for their clients. Receiving customized services makes customers feel heard, loved, and valued.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of jobs involve coins with the public?",title:"Part 3 范文",answer:"I think jobs in service industry involve coping with the public. Those who work i n service industry are supposed to offer services to the customers, which means that they need to communicate a lot with their customers. They also need to cope with their problems and provide immediate help when in need.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why should companies react quickly when customers have difficulties?",title:"Part 3 范文",answer:"- 69 - In my opinion, customer service is of vital importance to a company. It may affect the customers' choice. Reacting quickly when customers have difficulties shows a high quality of customer service, which might bring the company more clients in the future.\n\n- 70 - 困难的决定 Describe a difficult decision that you once made You should say; What the decision was When you made your decision What the results of the decision were And explain why it was difficult to make",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What decisions do people usually make in their daily lives?",title:"Part 3 范文",answer:"There are some tiny things, for example, where to wear today and what to eat for dinner. But there also be some critical decisions, such as which offer the interviewee should accept and which major the college student should choose.\n\nWhich is easier, making a decision by yourself or making a decision after group discussion? I think it's easier to decide by myself after a group discussion. Because everyone in the group has a different experience and different aspects, so I can listen to other's suggestions and then make the best option.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Why are many young people unwilling to follow their parents' advice?",title:"Part 3 范文",answer:"Some of the young people are rebellious. They think what their parents say is wrong and want to pursue something different. Besides, some parents' suggestions are stereotypes, such as career, marriage, and children's education. Young people like more scientific and modern ideas.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"What’s the most important factor in decision-making?",title:"Part 3 范文",answer:"Brave, ability, and former experience. We need to be brave and confident enough to make decisions and face whatever happens later. Then we need to trust our ability and know what we can achieve. Lastly, we need to make decisions based on former experience and never try to do something that most people are against.\n\n- 72 - 花费超过预期的物品 Describe an item on which you spent more than expected You should say: What it is When and where you bought it Why you bought it And explain why you think you spent more than expected.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"What do you think young people spend most of their money on?",title:"Part 3 范文",answer:"I think young people spend most of their money on food. Nowadays, fewer and fewer young people master cooking skills. Most of them dine out frequently or order food delivery everyday, which is way more expensive than cooking for themselves.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Do people buy things they don’t need?",title:"Part 3 范文",answer:"- 73 - I think this would happened a lot for those who tend to buy things in impulse. Advertising is everywhere now. The sellers try their best to tempt people buying their products by bragging how good their products are. Some people might be lured by the advertisements easily, and pay for the things they don't really need.\n\n- 74 - 困难的技能 Describe a skill that is difficult for you You should say: What it is When you learned it Who taught you And explain why you think it is difficult",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Is it hard for students to learn skills?",title:"Part 3 范文",answer:"No. Young people are more adaptive. They can quickly adapt to a new environment and le arn new things, for example, new technology, new software, and a new language. Besides, young people have a better memory than older people, and they can remember what they learned and utilize it in their studies.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Is a good teacher very important for students' learning experience? Why?",title:"Part 3 范文",answer:"- 75 - Yes, a good teacher could use the proper teaching method to different students and cater to students' demands. They will take stud ents' feelings into consideration instead of just passing their knowledge. Besides, a good teacher will set an excellent example for students, for example, good learning habits and living habits, which can be suitable for students' future development.\n\n- 76 - Part2&3 事物类（保留题） 智力游戏 Describe a puzzle that you enjoyed doing (e.g. Jigsaw, crossword, sudoku） You should say: What it is like How easy or difficult it is How long it takes you to solve And explain how you feel about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why are detective stories attractive to people?",title:"Part 3 范文",answer:"There is no doubt that curiosity is the nature of all the humans. Therefore, when people hear about some detective stories, most of them intend to get to the bottom of the mystery no matter how much time and efforts they dedicate to it and they really enjoy the process of finding correct answers or figure out the problems. When they solve the puzzle that has been plaguing them for long times, they would gain great sense of achievement and satisfaction, which is the reason why people are attracted by the detective stories.\n\nWhich do you think is better? a detective movie or its original novel? As far as I'm concerned, I prefer to watch detective films, because when I was in college and the curriculum was tight, it was very difficult for me to have a lot of free time to read an original book to explore its mysteries. But detective films can condense a thick original book into about two hou",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do children like the sea better than adults?",title:"Part 3 范文",answer:"I don't think children like the sea better than adults. There's no comparison. Children like to run on the beach, build sandcastles, pick up shells, swim in the sea, and do all kinds of interesting sports, such as surfing, beach volleyball and so on. And adults can do water sports, enjoy sunbathing, or reading on the beach.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What types of job positions can be found on or near the sea?",title:"Part 3 范文",answer:"- 79 - I think service jobs can be found near the seaside, such as fast -food restaurants or supermarket waiters. Or, coachwork related to sports, such as surfing instructor, diving instructor, or security personnel, etc.\n\n- 80 - 街市 Describe a street market or an outdoor market you've been to You should say : What it is like When you went there Why you went there And how you felt about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think small markets will disappear in the future?",title:"Part 3 范文",answer:"It is hard to say, actually. People who love small markets are usually those elderly or people in small cities, younger people in large cities usually prefer supermarkets. With the development of the society some small markets might disappear, but maybe in the future the government will spare some effort to protect these small markets, since they can also be a symbol of the city, as well as concentration of culture.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of markets are there in China?",title:"Part 3 范文",answer:"If we divide by time there are morning markets, night markets and common markets, morning markets mainly sell vegetables and meat, night markets sell snacks and clothes, and common markets sell them all. And there are also antique market which sell antique and flea market which sell little stuff.\n\nHave people’s shopping habits changed in recent years? I think nowadays people tend to shop online instead of buying in stores, since the development of logistics brings convenience to customers, plus that it is cheaper to purchase things on websites. People can buy various products like vegetables, meat, clothes and even furnitures only by clicking the buttons anywhere at any time.\n\n- 81 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the differences between shopping in street markets and big shopping malls?",title:"Part 3 范文",answer:"If we divide by time there are morning markets, night markets and common markets, morning markets mainly sell vegetables and meat, night markets sell snacks and clothes, and common markets sell them all. And there are also antique market which sell antique and flea market which sell little stuff.\n\n- 82 - 关于环保的法律 Describe a law to help the environment which you think your country should have You should say: What it is How you first learned about it How it helps the environment And explain why your country should have it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Are there laws about education in china?",title:"Part 3 范文",answer:"In China, the most important law on education is nine-year compulsory education, which is open to all students and everyone can enjoy the right to education. First, it can improve students' comprehensive quality and guide students to establish a correct outlook on life, values and world outlook. Through education, students can cultivate their interest, sentiment a nd promote their all -round development. Additional, Nine -year compulsory education can make students understand more truth, learn more knowledge and improve their scientific and cultural literacy. Secondly, the nine-year compulsory education can effectively guarantee that everyone will receive basic education and will not lose the opportunity to learn because of economic and family reasons.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of rules do schools in china have?",title:"Part 3 范文",answer:"In general, there are many rules in Chinese schools, such as students must have classes, eat meals and have a rest on regular time, and some schools require students to wear school uniforms when they go to school. For example, when I was in junior high school and senior high school, my school required us to wear school unifor ms on any occasion, in this way, we can save the time of thinking about clothes every day and reduce the comparison psychology between students. Of course, there will be some differences between different schools, which need to be embodied in combination with the school's teaching philosophy.\n\n- 83 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What can teachers do to make students obey rules?",title:"Part 3 范文",answer:"Besides giving lessons to students, it is also very important for teachers to supervise and manage students to abide by school rules. In order to make the students better obey every rules of the school, first of all, the teacher should set a good example and take the lead in strictly abiding by it. Secondly, the teacher can tell the students more about the necessity and importance of obeying the rules in the ideological and moral class, and then set up the role of mutual encouragement and supervision among the students, which helps the class form a good atmosphere.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What should parents do to educate children about laws?",title:"Part 3 范文",answer:"Parents should pay attention to the education of ch ildren about legal issues. First of all, they should keep sustainable communication with children, tell them the importance and necessity of the existence of laws and regulations, and let them have the consciousness of abiding by these. Secondly, parents should set a good example for children, reflecting in the small things in life, such as crossing the road to comply with traffic regulations, throwing garbage to correct classification, etc., which means to educate children with action. Third, parents should always pay attention to their children and guide them to the right path in time when they go astray.\n\n- 84 - 想提升的天赋 Describe a natural talent you want to improve, (like sports, music etc) You should say: What it is When you discovered it How you want to improve it And how you feel about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think artists with talents should focus on their talents?",title:"Part 3 范文",answer:"Sure, of course. Talent is a special ability that ordinary people do not have. I think artists should try the ir best to develop their talents and do something meaningful for the development of arts. However, doing artwork requires a solid economic foundation. If it's difficult for them to make a life, perhaps artists should give up their talents.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is it possible for us to know the children who is 3 or 4 years old will be musician and painters?",title:"Part 3 范文",answer:"Maybe we can know what skill that children are interested in. But 3 or 4 years old is full of curiosity and willing to explore different things. Children may be on the spur of the moment, but parents can pay attention to it. At this stage, parents can let their children try different things to find their interests and talents.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think parents feel guilty for putting too much pressure on their children?",title:"Part 3 范文",answer:"Some parents may feel guilty, because they may be forced by peer pressure to push their children to learn different skills. But some parents may think that they are providing more opportunities for their children and children should thanks for them in the future.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why people like to watch talent shows?",title:"Part 3 范文",answer:"- 85 - People can learn about art through talent shows, such as singing competitions and dance competitions. People can learn about different singing skills and dance types. Besides, people admire and support these talented people. It's a good way to appreciate arts. People can know how to evaluate their singing or performing abilities.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think it is more interesting to watch famous peoples or ordinary people’s show?",title:"Part 3 范文",answer:"I prefer to watch famous people's show, because some variety shows can see the daily life of stars, which is quite different from their performance on the stage or on the big screen. I think it's more interesting.\n\n- 86 - 当地新闻 Describe a piece of local news that people in your town or city were interested in You should say: What it was about Where you saw/heard it Who was involved And explain why people were interested in it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do people prefer local or international news?",title:"Part 3 范文",answer:"It is hard to say, I don't think people will be more interested in the news if it is local or international, it is the content that attracts them. If they judge from that piece of news that it is going to cause some changes to their own life.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you think it is important to have national identity?",title:"Part 3 范文",answer:"Yes, I regard it significant to have this characteristic. Every country has their own traditions, culture, language and politics, and these are the roots of one nation. Only when the national identity exists and the citizens respect and protect national identity a nation is believed to keep prosperous. If a nation itself doesn't care about these important features themselves, no other nation will help protect these precious treasure for them.\n\n- 87 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How can people develop their national identity?",title:"Part 3 范文",answer:"I think schools and parents should shoulder the responsibility to teach children to develop this characteristic when they are still young. They need to explain this concept to their children and tell them how wonderful this nation is and how great our country is, so that when these children grow up they will love this nation more.\n\n- 88 - 雇佣很多员工的公司 Describe a company or organization where you live that employs a lot of people You should say: What it does How many people it employs What kind of people work there And explain how you feel about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Should big companies be punished more seriously if they break the law?",title:"Part 3 范文",answer:"Yes, I think so. When a large corporation gets caught violating the law, the costs should be severe. This is mainly because the company can never be imprisoned and the only type of penalty that can efficiently work against a corporation in the criminal context is the criminal fine. In addition, big companies tend to have more shareholders and they should pay for the misconduct of the companies' executives if the crime has been brought to light because they definitely had already benefited from it. As a result, such astronomical criminal penalties can act as a deterrent in the industry or even the whole society.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Should big companies donate more to charities?",title:"Part 3 范文",answer:"Yes, I think so. Donating more to charities should be a social and moral responsibility that every big company should shoulder. By doing so, these large corporations can help alleviate poverty and relieve poverty -related issues throughout the world. However, donating more to charity does not mean that other socially irresponsible practices can be offset, for instance, not complying with applicable laws or acting inconsistently with international norms of behavior.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the good things about working for a bog company?",title:"Part 3 范文",answer:"I feel that there are more opportunities to grow if you work for a large company most of the time. This is mainly because large companies typically have a structure in place to move up the career ladder. And you will never be stuck in a dead end job at a small firm.\n\n- 89 - On top of that, you'll get the chance to specialise and fully develop a specific expertise or job function when working for a big company.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the differences between big companies and small companies?",title:"Part 3 范文",answer:"Of course, there are many differences. First of all, they are different regarding the size of staff. In addition, most big companies, especially those industrial leaders, have comprehensive management systems in which employees can fulfill their own duties in a well- organised way. While for small companies, the promotion and administration systems might not be as advanced as those of big companies.\n\n- 90 - 做手工 Describe an art of craft activity (e.g. painting, woodwork, etc.) you did when you were at school You should say: What you made How you made it What it looked like And how you felt about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What traditional handcrafts are. Popular in china?",title:"Part 3 范文",answer:"Traditional Chinese handicrafts are popular among Chinese people, for example, Chinese paper cutting, Chinese lantern, Chinese kite and Chinese Knot. They are all symbols of the Chinese handicraft and have good meanings and are often used to express good wishes. For example, in Chinese, Knot means reunion, peace, love, acquaintance and so on. Large Chinese knot served as wall hangings have the same decorative value as fine paintings or photographs, and are perfectly suitable for decorating a parlor or study and the hall.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What do young people think of traditional handcrafts?",title:"Part 3 范文",answer:"Most young people are not interested in traditional art, and they will not study classic art or choose it as their career because it doesn't have a high profile. Television shows only modern art and job opportunities in the traditional arts are very limited, and performers often don't make enough money to support their families.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the benefits of making handcrafts?",title:"Part 3 范文",answer:"I believe that making handcrafts can help train the eye and hand because it provides lots of opportunities to observe and the more often we observe, the sooner that skill will become a helpful habit. Besides, handcrafts can help cultivate our sense of and appreciation for beauty.\n\n- 91 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do people make a handcraft in china?",title:"Part 3 范文",answer:"Some Chinese people also make a living by making handicrafts, such as some traditional handicrafts. Most Chinese tend to buy products produced by factory assembly lines, which are cheaper and more modern.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do people like paper-cutting?",title:"Part 3 范文",answer:"Yeah, most Chinese people like traditional paper-cutting and they use it as decorations. Traditional Chinese papercutting is usually made with red paper, the most popular and propitious color in Chinese culture. They adorn walls, windows, doors, lamps and lanterns, and they can also be given as gifts. Paper cuttings were also used to serve as the mold pattern for making embroideries and spray paintings.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do people like to make a handcraft as a gift?",title:"Part 3 范文",answer:"For more intimate relationships, such as parents and lovers, people prefer to give gifts made by themselves. The purpose of giving handmade gifts is to give personal and individual things to the person receiving the gift, which can better show your love.\n\n- 92 - 喜欢的电影 Describe your favorite film/movie You should say: When you watched it Where you watched it What it was about And explain why you like it\n\nI’d like to describe a movie I like very much which is called The Butterfly Effect. It tells a story of a boy who often has blackouts in his childhood. So the doctor suggests that he keep a journal of the things he can’t remember experiencing. When he is in college many years later, he happens to read the things in his journal and somehow, he winds up revisiting the events he has no memory of. I watched it several years ago, when I was still living in my old apartment in Shanghai. I remem",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Are films a waste of money?",title:"Part 3 范文",answer:"I think it depends on the person. But for me personally, I don't think it is a waste of money at all. I enjoy watching movies, and I think it is one of the best relaxation exercises for me. When I have the pleasure of watching a fantastic movie, I actually feel that I broaden my views, experience something totally different from my life, as well as fulfilled my emotional states. But I believe it is hard for someone who doesn't like movies to think in the same way I thought.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"Are foreign movies popular in china?",title:"Part 3 范文",answer:"Yeah, I think so. the foreign movies contain movies from any other different countries. Some popular movies in China are primarily in Korean, Japanese, or English. For example, the Marvel and D C movies actually got up very high sales in China. Other romantic or classic movies also have a large repeat amount of playing every year. People from almost all ages know some classical movies such as Titanic.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is it important that a country has its own movies?",title:"Part 3 范文",answer:"- 93 - To be honest, I think yes, any country needs at least some of their own movies as long as they can do it. Thinking about the countries that have the money and skills to make their own movie, it is actually a good way to publicize their government's idea and gather cohesion from the citizens in their country. Besides, having more movies created by its own country might make people feel a sense of belonging when watching the movie. Those who love movies but their countries don't have the movie production industry, I guess they might feel a sense of insecurity or doubt.\n\n- 94 - 家里重要的设备 Describe a piece of equipment which is important to you in your home You should say: What it is What it is for Why it is important And explain how you feel about it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of machines are there in people’s homes?",title:"Part 3 范文",answer:"In modern society, the appliances in people's home have become more and more diversified. I think they can be roughly divided into two categories. One is practical appliances ; the other is entertainment appliances. Some appliances have both these two functions. Specifically, the practical appliances include refrigerators, rice cookers, ovens, microwave ovens, etc., while the entertainment appliances include televisions, game machines, projectors and so on . In recent two years, there are also some smart appliances, which greatly improve our efficiency and quality of life.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the differences between the young and the old in their attitudes towards machines?",title:"Part 3 范文",answer:"For the elderly, their cognition of machines is still in favor of practical functions, as long as they prefer to have basic electrical appliances which can meet the needs of daily life; For young people, they are more interested in novelty and are willing to accept the new multi- functional smart appliances. Simultaneously, they also like to purchase some entertainment machines in order to enrich their life.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What kinds of professions require people to use machines?",title:"Part 3 范文",answer:"In fact, there are many occupations that need to use machines. It depends on what e xactly kind of machine are used. If the computer can be seen as a kind of machine, then many modern professions need to use it, whether it is a designer or an ordinary clerk, because the digital office provided by the computer greatly improves people's\n\n- 95 - work efficiency. If it's heavy machinery, most of the workers in th e factory are using it, especially in the manufacturing industry, such as automobile manufacturers, construction sites and so on.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Will many people’s work be done by robots in the future?",title:"Part 3 范文",answer:"In my opinion, some jobs will be replaced by robots, especially some high-risk jobs, time -consuming and laborconsuming jobs or jobs that need to maintain a sterile environment, such as high-altitude cleaning, medical product production and so on. From a long-term point of view, it can save cost and improve efficiency to design a suitable robot to complete th ese kinds of work instead of human. Of course, there are also some jobs that cannot be replaced, like doctors and teachers. Although compared with people, robots may have more professional and comprehensive knowledge, the most important thing in these jobs is communication and humanized understanding, which robots can't be competent.\n\n- 96 - 放学/下班后的活动 Describe an activity you often enjoy doing when your work or school day ends You should say: What it is When do you usually do it How you feel about it And explain why do you do it",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do some people enjoy extreme sports?",title:"Part 3 范文",answer:"There are many reasons for that. First of all, people get addicted to extreme sports because they can feel closer to nature, more self-aware and at peace. When they go surfing or scuba diving, they would feel that they are part of nature. On top of that, some people enjoy extreme sports just because they desire excitement and adventures. When they overcome physical and mental challenges brought by extreme sports, their confidence can be greatly boosted.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Are men more likely to do extreme sports than women?",title:"Part 3 范文",answer:"Yes, I think so. Engaging in extreme sports often requires relatively strong physical fitness and muscle strength. Men’s bodies tend to be naturally muscular and large, and generally, men tend to perform better than women in this regard. Therefore, it would be much easier for them to overcome physical challenges brought by such extreme sports.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are the most popular outdoor activities in China?",title:"Part 3 范文",answer:"Well, I’m not quite sure about that but as far as I know, visiting amusement parks can be quite popular in China, especially among the young. Taking a one-day trip to Disneyland is a desirable way to spend one’s holiday because you can escape from the real world which may be filled with unpleasant things.\n\n- 97 - In addition, for the middle -aged, they prefer square dancing with pop songs as background music, which can help them unwind and keep fit.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What do young people usually do in groups?",title:"Part 3 范文",answer:"I think there are many group activities that young people usually do . First of all, boys tend to play basketball or football in their spare time, which helps develop their abilities of coordination and lets them keep fit. On top of that, many youngsters would go clubbing and dance together, serving as a favorable means of entertainment, relaxation and socialization.\n\n- 98 - 一篇关于健康的文章 Describe an article you read from the internet about health lifestyle You should say: When and where was it posted What the article was about How useful the information was And explain how you feel about the article",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do you often reading this genre of magazine?",title:"Part 3 范文",answer:"I seldom read this genre of magazine which focus on health lifestyle. My parents enjoy reading those and they would convey some useful information to me. I prefer to read entertainment news on the website or my mobile phone.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What can people do to become much healthier?",title:"Part 3 范文",answer:"According to my experience, there’s no quick-fix solution to adopting a healthy lifestyle. It’s important to implement small steps and keep up with them consistently, for example, eating nutritious foods, exercising consistently, finding peace of mind and getting plenty of rest.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why would cars cause pollution?",title:"Part 3 范文",answer:"There are several reasons. A car emits carbon monoxide when the carbon in fuel doesn’t burn completely. Besides, a car’s exhaust emits hydrocarbons, a toxic compound of hydrogen and carbon. And particulate matter in the air contribute to atmospheric haze and can damage people’s lungs.\n\n- 99 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Will people exercise more and eat healthier in the future?",title:"Part 3 范文",answer:"Sure. People begin to pay more attention to healthy lifestyle and usually have a long list of resolutions which usually includes eating healthier and exercising more. Besides, there’s a Healthy Lifestyle Awareness Day held on the 22nd of February as a reminder for everyone to live healthier lives.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is it necessary for people to read healthy magazines?",title:"Part 3 范文",answer:"Sure. People can get professional information from healthy magazines. From those articles, we could learn how to balance our diet and how to cook a healthy meal. Besides, we could know how to stretch our body without hurting muscles.\n\nWere people much healthier in the past? I don’t think so. Comparing to the past, people live longer and have a higher quality of life. Lots of people begin to aware the importance of healthy lifestyle and start a new year with a long list of resolutions which usually includes eating healthier and exercising more.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"How to tell whether a website is reliable?",title:"Part 3 范文",answer:"Frankly, I will not totally count on any website. Before acting on any health information I find online, I will talk with my doctor about it, ask for some professional advice. You know, when looking at health information online, your common sense and good judgment will be very important.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do Chinese students feel stressful?",title:"Part 3 范文",answer:"I think students in every country are stressful. They have to face the stress from their parents, their peers and their teachers. While, Chinese students are extremely stressful especially before they pass the college entrance examination, which would decide the university, the major and even their life in the future.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why don’t schools in China teach their students how to keep healthy?",title:"Part 3 范文",answer:"We have some lessons and reading materials for students to learn how to keep healthy, but schools spend less time on that. They think their jobs are to teach students knowledge and help them pass exams, and parents should take responsibilities to keep student health.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why there are plenty of false information in books?",title:"Part 3 范文",answer:"I guess recently the publishers would like to make more money and pay less attention on the content of books, not to speak of checking the authenticity. Some of writers would like to use appealing ideas to attract readers’ attention and make more money. But sometimes they would use the false information.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"What kind of people would like to go to a cafe?",title:"Part 3 范文",answer:"From my observation, there are probably two categories of people who like to go to cafes in Shanghai. One is whitecollar workers at work. On the one hand, they need to buy coffee as a refreshing drink. On the other hand, they often choose cafes as their social places. The other is the group of high school students and college students, who will drink coffee and concentrating on completing the homework or tasks assigned by the school in the coffee shop during the holidays .",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Why do young people like studying in a cafe instead of at home?",title:"Part 3 范文",answer:"As a student, like most of my peers, I prefer to study in a coffee shop rather than at home. Firstly, the cafe has a quiet environment similar to the library, which allows me to focus on doing my own things, and the activities of my parents, brothers or sisters at home may interfere with me. Secondly, the environment at home is too comfortable so that I may become lazy when staying at home, such as lying in bed watching movies and playing mobile phones instead of studying, whic h will not happen in the cafe. Finally, when I go to the cafe to study, I can call my classmates and friends together, which is more convenient than at home.\n\n- 101 -",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do old people like to drink coffee?",title:"Part 3 范文",answer:"That depends. In China, most older people don't like drinking coffee. They prefer tea, but a few old people also like coffee, such as my father, but what he likes is instant latte with a lot of sugar and milk instead of freshly ground coffee. I feel that drinking coffee has become a daily habit in foreign countries. Both the elderly and young people like it very much, as if it has became a national drink.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Do Chinese people like to drink coffee?",title:"Part 3 范文",answer:"For young people in China today, especially people under the age of 30 generally prefer coffee. They buy a cup of coffee to refresh themselves at work or school. Because coffee is a kind of drink introduced from abroad, older people in China do not have the habit of drinking coffee from childhood, especially those over the age of 50. They are more inclined to drink Chinese traditional drink, namely tea.\n\n- 102 - 假期旅游的地方 Describe a place you visited on vacation You should say: Where it is When you went there What you did there And explain why you went there",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"What are some popular attractions that people like to visit in your country?",title:"Part 3 范文",answer:"It depends. For boys, they prefer to visit some natural scenery, such as famous mountains, lakes, and rivers, where they can learn something about history. Girls like to take the perfect Wechat Moments to snap at an internetfamous site, such as cafes and shops.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

  {q:"How does this affect the environment and nature?",title:"Part 3 范文",answer:"The density of people in cities results in heavier reliance on fossil fuels because urban residents are used to commuting by private vehicle, which has enormous negative impacts on air and environment. In addition, in order to accommodate the expanding urban population, local authorities have no choice but to use more public land to build apartments, resulting in fewer green spaces in the city. Moreover, it is likely for people to suck up natural\n\n- 105 - resources from the countryside and spit back vast quantities of waste, which should be of critical concern to the public.",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,
  {q:"Is there a way to balance city and nature?",title:"Part 3 范文",answer:"Yes, there are some ways to strike a balance between city a nd nature. First of all, local administration should make more efficient use of natural resources, notably energy, but also materials, water and land. In this way, it will prevent nature from the risk of excessive exploitation. On the other hand, city planning should be aimed at building a greener city. For example, a mix of open spaces, parks or even farms can be built within residential communities to make the city surrounded by leafy suburbs.\n\nWhat can be done to prevent damage to the nature? 【和上一題有相似之處】 There are several ways to prevent nature from being damaged by human activities. Firstly, local administration should make more efficient use of natural resources, notably energy, but also materials, water and land. In this way, it will prevent nature from the risk of excessive exploitation. On top of that, residents can brin",tips:"💡 Part 3 讨论题：先亮观点，再用原因+例子支撑；用 however / therefore / moreover 体现逻辑层次，可从个人与社会双视角拔高。"} ,

function vbase(v){
  if(IRR_BASE[v])return IRR_BASE[v];
  let b=v;
  if(/ing$/.test(b))b=b.replace(/ing$/,'');
  else if(/ed$/.test(b)&&b.length>3)b=b.replace(/ed$/,'');
  else if(/s$/.test(b)&&!/^(ss|us|is|os|ch|sh)/i.test(b))b=b.replace(/s$/,'');
  if(ENG_POS[b])return b;
  return v;
}

  minsBetween(s,e){
    if(!s||!e)return 0;
    const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
    let d=(eh*60+em)-(sh*60+sm);if(d<0)d+=1440;return d;
  },
